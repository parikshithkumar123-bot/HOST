<script>
/**
 * PortalUXJS_v415
 * Premium UX layer for HOST Portal.
 * Adds full login loading screen, heart water fill progress, mobile polish, row saving states,
 * and safe helper functions used by modules.
 */
(function portalUXV415(){
  if (window.__portalUXV415Loaded) return;
  window.__portalUXV415Loaded = true;

  var progressTimer = null;
  var currentProgress = 0;
  var targetProgress = 0;
  var currentMessage = 'Preparing portal';

  function ensureStyle(){
    if (document.getElementById('portalUXV415Style')) return;
    var logoUriV414 = window.SHG_HEART_LOGO_URI || 'https://drive.google.com/thumbnail?id=1KGIgikEbb7NWKt1vXhT4V10yXLw-ukmA&sz=w400';
    var style = document.createElement('style');
    style.id = 'portalUXV415Style';
    style.textContent = ''
      + '@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap");'
      + '.portal-load-v414{position:fixed;inset:0;z-index:999990;background:radial-gradient(ellipse at 20% 50%,rgba(232,141,7,.07) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(47,198,215,.05) 0%,transparent 50%),linear-gradient(145deg,#091e3a 0%,#0f2d54 40%,#163a63 70%,#1a4a7a 100%);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Nunito,Arial,sans-serif;color:#fff}'
      + '.portal-load-v414[hidden]{display:none!important}'
      + '.portal-load-card-v414{width:min(440px,calc(100vw - 32px));border-radius:28px;background:rgba(255,255,255,.075);border:1px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 32px 80px rgba(9,30,58,.55),0 8px 24px rgba(9,30,58,.3);padding:36px 32px;text-align:center;box-sizing:border-box;backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);position:relative;isolation:isolate}'
      + '.portal-load-card-v414::before{content:"";position:absolute;inset:-1px;border-radius:29px;padding:1px;background:linear-gradient(135deg,rgba(181,18,24,.7) 0%,rgba(232,141,7,.9) 35%,rgba(255,200,80,.6) 55%,rgba(232,141,7,.8) 75%,rgba(181,18,24,.5) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:0;animation:plBorderPulse 4s ease-in-out infinite;will-change:opacity}'
      + '@keyframes plBorderPulse{0%,100%{opacity:.75}50%{opacity:1}}'
      + '.portal-load-card-v414::after{content:"";position:absolute;inset:0;border-radius:28px;background:url("' + logoUriV414 + '") center/65% auto no-repeat;filter:blur(40px) saturate(1.2) opacity(.1);pointer-events:none;z-index:0}'
      + '.portal-heart-wrap-v414{width:160px;height:145px;margin:0 auto 20px;position:relative;display:grid;place-items:center;z-index:1}'
      + '.portal-heart-v414{width:138px;height:138px;position:relative;overflow:hidden;filter:drop-shadow(0 0 12px rgba(232,141,7,.55)) drop-shadow(0 0 28px rgba(181,18,24,.3));border-radius:0;background:transparent;animation:plHeartGlow 3.6s ease-in-out infinite}'
      + '@keyframes plHeartGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(232,141,7,.5)) drop-shadow(0 0 22px rgba(232,141,7,.25))}40%{filter:drop-shadow(0 0 16px rgba(181,18,24,.65)) drop-shadow(0 0 32px rgba(232,141,7,.3)) drop-shadow(0 0 48px rgba(181,18,24,.15))}70%{filter:drop-shadow(0 0 12px rgba(232,141,7,.7)) drop-shadow(0 0 26px rgba(255,200,80,.3))}}'
      + '.portal-heart-bg-v414{position:absolute;inset:0;background:center/contain no-repeat;opacity:.98;z-index:3}'
      + '.portal-heart-water-v414{position:absolute;left:-18%;right:-18%;bottom:0;height:0;background:linear-gradient(180deg,rgba(232,141,7,.85),rgba(181,18,24,.9));transition:height .45s ease;border-radius:40% 40% 0 0;animation:portalWaveV414 2.3s ease-in-out infinite;z-index:2;mix-blend-mode:screen}'
      + '.portal-heart-shine-v414{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%);mix-blend-mode:screen;z-index:4;pointer-events:none}'
      + '.portal-heart-border-v414{display:none}'
      + '@keyframes portalWaveV414{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(10px) rotate(1deg)}}'
      + '.portal-load-title-v414{margin:0 0 6px;font-size:1.15rem;font-weight:900;color:#fff;letter-spacing:-.01em;position:relative;z-index:1}'
      + '.portal-load-message-v414{margin:0 0 10px;color:rgba(255,255,255,.6);font-size:.84rem;min-height:20px;position:relative;z-index:1}'
      + '.portal-load-quote-v414{margin:0 0 14px;font-weight:800;color:rgba(232,141,7,.9);font-size:.82rem;letter-spacing:.03em;position:relative;z-index:1}'
      + '.portal-progress-track-v414{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin:12px 0 8px;position:relative;z-index:1}'
      + '.portal-progress-bar-v414{height:100%;width:0;background:linear-gradient(90deg,#2fc6d7,#e88d07,#b51218);border-radius:999px;transition:width .35s ease;box-shadow:0 0 8px rgba(232,141,7,.5)}'
      + '.portal-progress-num-v414{font-size:.8rem;font-weight:900;color:rgba(255,255,255,.5);position:relative;z-index:1}'
      + '.portal-row-saving-v414{opacity:.56!important;position:relative!important;pointer-events:none!important}'
      + '.portal-row-saving-v414::after{content:attr(data-saving-text);position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#0076b6;color:white;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;box-shadow:0 8px 18px rgba(0,0,0,.18);z-index:10;white-space:nowrap}'
      + '.portal-row-saved-v414{animation:portalSavedFlashV414 1.1s ease}'
      + '@keyframes portalSavedFlashV414{0%{background:#e9f8ed}100%{background:inherit}}'
      + '@media(max-width:720px){'
      + '.portal-load-card-v414{border-radius:22px;padding:28px 18px}.portal-heart-wrap-v414{width:135px;height:124px}.portal-heart-v414{transform:scale(.86)}'
      + '.app-shell{padding:8px!important}.login-stage{grid-template-columns:1fr!important;gap:12px!important;min-height:auto!important}.login-hero{display:none!important}.login-panel{min-height:calc(100vh - 20px)!important}.glass-card{width:100%!important;padding:24px 18px!important;border-radius:22px!important}'
      + '.dashboard-stage{width:100%!important;margin:0!important;gap:10px!important}.topbar{border-radius:18px!important;padding:12px!important}.topbar-main{gap:10px!important}.topbar-left{flex:1 1 100%!important}.topbar h1{font-size:1.35rem!important}.top-actions{width:100%!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important}.top-actions button,.premium-role-btn{width:100%!important;min-height:40px!important;padding:0 10px!important}.premium-role-dropdown{width:100%!important}.premium-role-menu{left:0!important;right:0!important;min-width:0!important;width:100%!important;max-height:65vh!important}'
      + '.center-column.card{padding:8px!important;min-height:auto!important;border-radius:18px!important}.host-zone{min-height:430px!important;border-radius:20px!important}.host-zone-border{border-width:8px!important}.host-zone-divider-x{height:8px!important}.host-zone-divider-y{width:8px!important}.host-core-wrap{transform:scale(.62)!important}.host-node{transform:scale(.62)!important}.host-flyout{padding:20px!important}.host-flyout-copy h4{font-size:1.05rem!important}.host-flyout-copy p{display:none!important}'
      + '.admin-table-wrap,.p60-table-wrap,.rtc-table-wrap,.rrc-table-wrap,.mtc-table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}.admin-table,.p60-read-table,.rtc-table,.rrc-table,.mtc-table{min-width:760px!important}input,select,textarea{font-size:16px!important}'
      + '.p60-head,.rtc-titlebar,.rrc-titlebar,.mtc-titlebar{position:sticky!important;top:0!important;z-index:50!important}'
      + '}'
      + '@media(prefers-reduced-motion:reduce){.portal-heart-water-v414{animation:none}.portal-row-saved-v414{animation:none}}';
    document.head.appendChild(style);
  }

  function ensureOverlay(){
    ensureStyle();
    var overlay = document.getElementById('portalLoadingOverlayV414');
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.id = 'portalLoadingOverlayV414';
    overlay.className = 'portal-load-v414';
    overlay.hidden = true;
    overlay.innerHTML = ''
      + '<div class="portal-load-card-v414" role="status" aria-live="polite">'
      + '<div class="portal-heart-wrap-v414"><div class="portal-heart-v414"><div class="portal-heart-water-v414" id="portalHeartWaterV414"></div><div class="portal-heart-bg-v414" id="portalLoadingLogoV414"></div><div class="portal-heart-shine-v414"></div></div><div class="portal-heart-border-v414"></div></div>'
      + '<h3 class="portal-load-title-v414">SAISETHSONS Portal</h3>'
      + '<p class="portal-load-message-v414" id="portalLoadMessageV414">Preparing portal</p>'
      + '<p class="portal-load-quote-v414">Patience is the key for success</p>'
      + '<div class="portal-progress-track-v414"><div class="portal-progress-bar-v414" id="portalProgressBarV414"></div></div>'
      + '<div class="portal-progress-num-v414" id="portalProgressNumberV414">0%</div>'
      + '</div>';
    document.body.appendChild(overlay);
    applyCompanyLogoToLoader();
    return overlay;
  }

  function applyCompanyLogoToLoader(){
    var logo = document.getElementById('portalLoadingLogoV414');
    if (!logo) return;

    var uri = '';
    var existing = document.querySelector('[data-heart-logo-target="login"], [data-heart-logo-target="dashboard"]');

    if (existing) {
      if (existing.tagName === 'IMG') uri = existing.getAttribute('src') || '';
      else {
        var bg = existing.style.backgroundImage || '';
        uri = bg.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
      }
    }

    if (!uri || uri.indexOf('data:image/gif') === 0) {
      uri = window.SHG_HEART_LOGO_URI || 'https://drive.google.com/thumbnail?id=1KGIgikEbb7NWKt1vXhT4V10yXLw-ukmA&sz=w200-h200';
    }

    logo.style.backgroundImage = 'url(' + uri + ')';
  }

  function paint(){
    var water = document.getElementById('portalHeartWaterV414');
    var bar = document.getElementById('portalProgressBarV414');
    var num = document.getElementById('portalProgressNumberV414');
    var msg = document.getElementById('portalLoadMessageV414');
    var pct = Math.max(0, Math.min(100, Math.round(currentProgress)));
    if (water) water.style.height = pct + '%';
    if (bar) bar.style.width = pct + '%';
    if (num) num.textContent = pct + '%';
    if (msg) msg.textContent = currentMessage;
  }

  function startTimer(){
    clearInterval(progressTimer);
    progressTimer = setInterval(function(){
      if (currentProgress < targetProgress) {
        // Ease toward the real target checkpoint
        currentProgress += Math.max(0.5, (targetProgress - currentProgress) * 0.16);
        if (currentProgress > targetProgress) currentProgress = targetProgress;
      } else if (currentProgress < 97) {
        // Gentle auto-drift while waiting for the next real step (max 97% — never fake 100%)
        currentProgress += 0.25;
      }
      paint();
    }, 200);
  }

  window.portalShowLoadingV414 = function(message, percent){
    var overlay = ensureOverlay();
    currentProgress = Math.max(0, Math.min(100, Number(percent || 5)));
    targetProgress = Math.max(currentProgress, Math.min(96, currentProgress + 18));
    currentMessage = message || 'Preparing portal';
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
    paint();
    startTimer();
  };

  window.portalLoadingStepV414 = function(message, percent){
    currentMessage = message || currentMessage;
    if (percent != null) targetProgress = Math.max(targetProgress, Math.min(99, Number(percent)));
    paint();
  };

  window.portalHideLoadingV414 = function(message){
    currentMessage = message || 'Ready';
    targetProgress = 100;
    currentProgress = 100;
    paint();
    clearInterval(progressTimer);
    setTimeout(function(){
      var overlay = document.getElementById('portalLoadingOverlayV414');
      if (overlay) overlay.hidden = true;
      document.body.style.overflow = '';
    }, 420);
  };

  window.portalFailLoadingV414 = function(message){
    clearInterval(progressTimer);
    currentMessage = message || 'Could not load. Please try again.';
    targetProgress = Math.max(currentProgress, 100);
    paint();
    setTimeout(function(){
      var overlay = document.getElementById('portalLoadingOverlayV414');
      if (overlay) overlay.hidden = true;
      document.body.style.overflow = '';
    }, 900);
  };

  window.setPortalRowSavingV414 = function(rowEl, saving, text){
    if (!rowEl) return;
    if (saving) {
      rowEl.dataset.savingText = text || 'Saving...';
      rowEl.classList.add('portal-row-saving-v414');
    } else {
      rowEl.classList.remove('portal-row-saving-v414');
      rowEl.classList.add('portal-row-saved-v414');
      setTimeout(function(){ try { rowEl.classList.remove('portal-row-saved-v414'); } catch(e){} }, 1200);
    }
    Array.prototype.forEach.call(rowEl.querySelectorAll('button,input,select,textarea'), function(el){
      el.disabled = !!saving;
    });
  };

  window.findPortalRowV414 = function(el){
    if (!el) return null;
    return el.closest('tr') || el.closest('[data-row-card]') || el.closest('.p60-card') || el.closest('.rtc-section') || el.closest('.rrc-detail') || el.closest('.mtc-detail');
  };

  ensureStyle();
})();
</script>
