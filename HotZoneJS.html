    if(cc&&ws){cc.innerHTML='';cc.appendChild(ws);cc.style.display='block';}
    if(nl)nl.style.display='none';
    if(ws){ws.hidden=false;ws.style.display='grid';}
    ['adminWorkspaceEyebrow','adminWorkspaceTitle','adminWorkspaceNote'].forEach(function(id){
      var el=document.getElementById(id)||window[id];if(el){el.textContent='';el.style.display='none';}
    });
    var sg=document.getElementById('adminSummaryGrid')||window.adminSummaryGrid;
    var st=document.getElementById('adminSectionTabs')||window.adminSectionTabs;
    var sc=document.getElementById('adminSections')||window.adminSections;
    if(sg)sg.innerHTML='';if(st)st.innerHTML='';
    if(sc)sc.innerHTML='<div class="hz2-page" id="hz2Root"></div>';
  }

      var b=document.createElement('div');b.className='hz2-body';b.innerHTML=buildViewOnlyContent_();
      root.appendChild(b);bindEvents_();return;
    }
    root.appendChild(buildTopbar_());
    var body=document.createElement('div');body.className='hz2-body';
    if(S.loading)body.innerHTML='<div class="hz2-shimmer"></div><div class="hz2-shimmer" style="width:80%"></div><div class="hz2-shimmer" style="width:60%"></div>';
    else if(S.view==='list')    body.innerHTML=buildListView_();
    else if(S.view==='edition') body.innerHTML=buildEditionView_();
    else if(S.view==='preview') body.innerHTML=buildPreviewView_(false);
    else if(S.view==='calendar')body.innerHTML=buildCalendarView_();
    else if(S.view==='sc')      body.innerHTML=buildSCView_();
    root.appendChild(body);
    if(S.confirmModal)root.appendChild(buildConfirmModal_());
    if(S.emailDialog) root.appendChild(buildEmailDialog_());
    bindEvents_();
  }

  function buildPreviewView_(viewOnly){
    if(!S.currentEdition)return'<div class="hz2-empty">No edition to preview.</div>';
    var ed=S.currentEdition,weekStr='Week ending '+(ed.week_ending||'');

  function buildCalendarHtml_(editable){
    var now=new Date(),year=S._calYear||now.getFullYear(),month=S._calMonth!=null?S._calMonth:now.getMonth();
    var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
    var lastDay=new Date(year,month+1,0);
    var evMap={};
    (S.calendar||[]).filter(function(e){return e.status!=='DELETED';}).forEach(function(ev){var k=(ev.event_date||'').slice(0,10);if(!evMap[k])evMap[k]=[];evMap[k].push(ev);});
    var h='<div class="hz2-cal"><div class="hz2-cal-head"><button class="hz2-btn hz2-btn-dark" id="hz2CalPrev" style="padding:0 10px">‹</button><h4>'+monthNames[month]+' '+year+'</h4><button class="hz2-btn hz2-btn-dark" id="hz2CalNext" style="padding:0 10px">›</button></div><div class="hz2-cal-grid">';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){h+='<div class="hz2-cal-dh">'+d+'</div>';});
    var startDow=new Date(year,month,1).getDay();
    for(var p=0;p<startDow;p++)h+='<div class="hz2-cal-cell other-month"></div>';
    for(var day=1;day<=lastDay.getDate();day++){
      var ds=year+'-'+(String(month+1).padStart(2,'0'))+'-'+(String(day).padStart(2,'0'));
      var dayEvs=evMap[ds]||[];
      h+='<div class="hz2-cal-cell'+(ds===now.toISOString().slice(0,10)?' today':'')+'"'+(editable?' data-cal-date="'+ds+'"':'')+'>'+
        '<div class="hz2-cal-date">'+day+'</div>'+
        dayEvs.slice(0,2).map(function(ev){return'<div class="hz2-cal-event" data-ev-id="'+esc(ev.event_id)+'">'+esc(ev.title)+'</div>';}).join('')+
        (dayEvs.length>2?'<div style="font-size:.65rem;color:#64748b">+'+(dayEvs.length-2)+' more</div>':'')+
      '</div>';
    }
    var trailing=(7-((startDow+lastDay.getDate())%7))%7;
    for(var t=0;t<trailing;t++)h+='<div class="hz2-cal-cell other-month"></div>';
    h+='</div></div>';
    if(editable&&S.calForm!=null)h+=buildCalEventForm_();
    if(S._viewingEvent)h+=buildCalEventDetail_(editable);
    return h;
  }

  function bindEvents_(){
    var back=byId('hz2Back');
    if(back)back.addEventListener('click',function(){
      _browseSCOpen=false;S.calForm=null;S._viewingEvent=null;S.scEditing=null;
      S._saving=false; // reset any stuck save state on navigation
      if(S.view==='preview')      S.view='edition';
      else if(S.view==='calendar')S.view=S.currentEdition?'edition':'list';
      else if(S.view==='sc')      S.view='list';
      else if(S.view==='edition'){S.view='list';S.currentEdition=null;S.contributions={};S.activeSection=null;}
      else S.view='list';
      renderView_();
    });
    var close=byId('hz2Close');
    if(close)close.addEventListener('click',function(){try{if(typeof goBackToDashboardHome==='function')goBackToDashboardHome();else if(typeof restoreDashboardHomeLayout_==='function')restoreDashboardHomeLayout_();}catch(e){}});
    var voN=byId('hz2VoTabNews'),voC=byId('hz2VoTabCal');
    if(voN)voN.addEventListener('click',function(){S.viewonlyTab='newspaper';renderView_();});
    if(voC)voC.addEventListener('click',function(){S.viewonlyTab='calendar';loadCalendar_(function(){renderView_();});});

    var cOk=byId('hz2ConfirmOk');if(cOk)cOk.addEventListener('click',function(){var fn=S.confirmModal&&S.confirmModal.onConfirm;S.confirmModal=null;if(fn)fn();});
    var cCan=byId('hz2ConfirmCancel');if(cCan)cCan.addEventListener('click',function(){S.confirmModal=null;renderView_();});

    var pdfBtn=byId('hz2PdfBtn');if(pdfBtn)pdfBtn.addEventListener('click',downloadPdf_);

    var calBtn=byId('hz2CalBtn');if(calBtn)calBtn.addEventListener('click',function(){S.view='calendar';S._calYear=new Date().getFullYear();S._calMonth=new Date().getMonth();S.calForm=null;S._viewingEvent=null;loadCalendar_();});
    var calPrev=byId('hz2CalPrev');if(calPrev)calPrev.addEventListener('click',function(){var m=S._calMonth-1;if(m<0){m=11;S._calYear--;}S._calMonth=m;S.calForm=null;S._viewingEvent=null;renderView_();});
    var calNext=byId('hz2CalNext');if(calNext)calNext.addEventListener('click',function(){var m=S._calMonth+1;if(m>11){m=0;S._calYear++;}S._calMonth=m;S.calForm=null;S._viewingEvent=null;renderView_();});
    var newEv=byId('hz2NewEventBtn');if(newEv)newEv.addEventListener('click',function(){S.calForm={event_date:'',title:'',message:'',link_url:'',link_title:''};S._viewingEvent=null;renderView_();});
    document.querySelectorAll('[data-cal-date]').forEach(function(cell){cell.addEventListener('click',function(e){if(e.target.closest('[data-ev-id]'))return;S.calForm={event_date:this.dataset.calDate,title:'',message:'',link_url:'',link_title:''};S._viewingEvent=null;renderView_();});});
    document.querySelectorAll('[data-ev-id]').forEach(function(chip){chip.addEventListener('click',function(e){e.stopPropagation();var ev=(S.calendar||[]).find(function(x){return x.event_id===this.dataset.evId;},this);if(ev){S._viewingEvent=ev;S.calForm=null;renderView_();}});});
    var evDC=byId('hz2EvDetailClose');if(evDC)evDC.addEventListener('click',function(){S._viewingEvent=null;renderView_();});
    var evDE=byId('hz2EvDetailEdit');if(evDE)evDE.addEventListener('click',function(){var ev=(S.calendar||[]).find(function(x){return x.event_id===this.dataset.evId;},this);if(ev){S.calForm=JSON.parse(JSON.stringify(ev));S._viewingEvent=null;renderView_();}});
    var evCan=byId('hz2EvCancel');if(evCan)evCan.addEventListener('click',function(){S.calForm=null;S._viewingEvent=null;renderView_();});
    var evSave=byId('hz2EvSave');if(evSave)evSave.addEventListener('click',saveCalEvent_);
    var evDel=byId('hz2EvDelete');if(evDel)evDel.addEventListener('click',function(){showConfirm_('Delete this calendar event?',function(){delCalEvent_(S.calForm.event_id);});});

    var pgPrev=byId('hz2PagePrev');if(pgPrev)pgPrev.addEventListener('click',function(){if(S._page>0){S._page--;S._selectedEditions={};renderView_();}});
    var pgNext=byId('hz2PageNext');if(pgNext)pgNext.addEventListener('click',function(){if(S._page<totalPages_()-1){S._page++;S._selectedEditions={};renderView_();}});

    var selAll=byId('hz2SelectAll');
    if(selAll)selAll.addEventListener('change',function(){
      pageEditions_().forEach(function(ed){if(this.checked)S._selectedEditions[ed.edition_id]=true;else delete S._selectedEditions[ed.edition_id];},this);
      // Surgical DOM update — no full re-render
      document.querySelectorAll('.hz2-ed-check').forEach(function(cb){
        cb.checked=!!S._selectedEditions[cb.dataset.checkEid];
        var row=cb.closest('.hz2-edition-row');
        if(row){if(cb.checked)row.classList.add('hz2-selected');else row.classList.remove('hz2-selected');}
      });
      var cnt=selectedCount_(),bulkBtn=byId('hz2BulkDeleteBtn');
      if(bulkBtn){bulkBtn.textContent='🗑 Delete Selected ('+cnt+')';bulkBtn.style.display=cnt?'':'none';}
      selAll.indeterminate=!selAll.checked&&pageEditions_().some(function(ed){return S._selectedEditions[ed.edition_id];});
    });

    document.querySelectorAll('.hz2-ed-check').forEach(function(cb){
      cb.addEventListener('change',function(e){
        e.stopPropagation();
        if(this.checked)S._selectedEditions[this.dataset.checkEid]=true;else delete S._selectedEditions[this.dataset.checkEid];
        var row=this.closest('.hz2-edition-row');
        if(row){if(this.checked)row.classList.add('hz2-selected');else row.classList.remove('hz2-selected');}
        var cnt=selectedCount_(),bulkBtn=byId('hz2BulkDeleteBtn');
        if(cnt){
          if(!bulkBtn){renderView_();}
          else{bulkBtn.textContent='🗑 Delete Selected ('+cnt+')';bulkBtn.style.display='';}
        } else {
          if(bulkBtn)bulkBtn.style.display='none';
        }
        var sa=byId('hz2SelectAll');
        if(sa){sa.checked=pageEditions_().every(function(ed){return S._selectedEditions[ed.edition_id];});sa.indeterminate=!sa.checked&&pageEditions_().some(function(ed){return S._selectedEditions[ed.edition_id];});}
      });
    });

    var bulkBtn=byId('hz2BulkDeleteBtn');
    if(bulkBtn)bulkBtn.addEventListener('click',function(){
      var ids=Object.keys(S._selectedEditions);if(!ids.length)return;
      showConfirm_('Delete '+ids.length+' edition'+(ids.length>1?'s':'')+' and all their contributions? This cannot be undone.',function(){bulkDeleteEditions_(ids);});
    });

    document.querySelectorAll('[data-del-edition]').forEach(function(btn){
      btn.addEventListener('click',function(e){e.stopPropagation();var eid=this.dataset.delEdition;showConfirm_('Delete this edition and all its contributions? This cannot be undone.',function(){deleteEdition_(eid);});});

  function saveContrib_(){
    if(S._saving){toast('Already saving...','info');return;}
    var title=(byId('hz2CTitle')||{}).value||'',body=(byId('hz2CBody')||{}).value||'';
    var linkUrl=(byId('hz2CLinkUrl')||{}).value||'',linkTitle=(byId('hz2CLinkTitle')||{}).value||'';
    var saveTpl=byId('hz2SaveTpl')&&byId('hz2SaveTpl').checked;
    var saveSC=byId('hz2SaveSC')&&byId('hz2SaveSC').checked;
    if(!title.trim()&&!body.trim()){toast('Add a title or body.','error');return;}
    S._saving=true;
    var btn=byId('hz2CSave');if(btn){btn.classList.add('hz2-btn-saving');btn.textContent=S.editingContrib?'Updating…':'Saving…';}
    function doSave(imgUrl,fileId){
      var now=new Date().toISOString(),section=S.activeSection,editing=S.editingContrib;
      var newItem={contribution_id:editing?editing.contribution_id:'_tmp_'+now,edition_id:S.currentEdition&&S.currentEdition.edition_id,section:section,title:title.trim(),body:body.trim(),link_url:linkUrl.trim(),link_title:linkTitle.trim(),image_url:imgUrl||(editing&&editing.image_url)||'',image_file_id:fileId||'',submitted_by:myId()||'You',submitted_by_id:myId(),submitted_at:now,status:'ACTIVE'};
      if(!S.contributions[section])S.contributions[section]=[];
      var prevItems=JSON.parse(JSON.stringify(S.contributions[section]));
      if(editing){S.contributions[section]=S.contributions[section].map(function(c){return c.contribution_id===editing.contribution_id?newItem:c;});}
      else{S.contributions[section].push(newItem);}
      if(S.currentEdition&&S._contribCache[S.currentEdition.edition_id])S._contribCache[S.currentEdition.edition_id].contributions=S.contributions;
      S.editingContrib=null;S.pendingImage=null;
      var editor=byId('hz2Editor');if(editor){editor.classList.add('hz2-saved-flash');setTimeout(function(){var e=byId('hz2Editor');if(e)e.classList.remove('hz2-saved-flash');},600);}
      patchContribList_();
      // Re-query after patch — closure btn refers to stale DOM element
      var freshBtn=byId('hz2CSave');
      if(freshBtn){freshBtn.classList.remove('hz2-btn-saving');freshBtn.textContent='+ Add Contribution';}
      else if(btn){btn.classList.remove('hz2-btn-saving');btn.textContent='+ Add Contribution';}
      google.script.run
        .withSuccessHandler(function(res){
          S._saving=false;
          var sb=byId('hz2CSave');if(sb){sb.classList.remove('hz2-btn-saving');}
          if(!res||!res.success){S.contributions[section]=prevItems;if(S.currentEdition&&S._contribCache[S.currentEdition.edition_id])S._contribCache[S.currentEdition.edition_id].contributions=S.contributions;toast((res&&res.error)||'Save failed — rolled back.','error');renderView_();return;}
          if(res.data&&res.data.contribution_id&&newItem.contribution_id.startsWith('_tmp_')){S.contributions[section]=S.contributions[section].map(function(c){return c.contribution_id===newItem.contribution_id?Object.assign({},c,{contribution_id:res.data.contribution_id}):c;});}
          if(saveSC){google.script.run.withSuccessHandler(function(){toast('Saved to library!','info');}).withFailureHandler(function(){}).saveHotzoneCategory({sessionToken:tok(),section:section,title:title.trim(),body:body.trim(),link_url:linkUrl.trim(),link_title:linkTitle.trim(),image_url:imgUrl||'',image_file_id:fileId||''});}
          toast('Saved!','success');
        })
        .withFailureHandler(function(e){S._saving=false;var sb=byId('hz2CSave');if(sb)sb.classList.remove('hz2-btn-saving');S.contributions[section]=prevItems;if(S.currentEdition&&S._contribCache[S.currentEdition.edition_id])S._contribCache[S.currentEdition.edition_id].contributions=S.contributions;toast(e&&e.message?e.message:'Save failed.','error');renderView_();})
        .saveHotzoneContribution({sessionToken:tok(),edition_id:S.currentEdition&&S.currentEdition.edition_id,section:section,title:title.trim(),body:body.trim(),link_url:linkUrl.trim(),link_title:linkTitle.trim(),contribution_id:editing?editing.contribution_id:'',image_url:imgUrl||(editing&&editing.image_url)||'',image_file_id:fileId||'',save_as_template:saveTpl?'1':''});
    }
    if(S.pendingImage){google.script.run.withSuccessHandler(function(res){if(res&&res.success&&res.data)doSave(res.data.image_url,res.data.file_id);else{S._saving=false;doSave('','');}}).withFailureHandler(function(){S._saving=false;doSave('','');}).uploadHotzoneImage({sessionToken:tok(),base64:S.pendingImage.base64,fileName:S.pendingImage.fileName,mimeType:S.pendingImage.mimeType});}
    else doSave('','');
  }

    var btn=byId('hz2EvSave');if(btn){btn.disabled=true;btn.textContent='Saving...';}
    google.script.run
      .withSuccessHandler(function(res){if(btn){btn.disabled=false;btn.textContent='Save Event';}if(!res||!res.success){toast((res&&res.error)||'Save failed.','error');return;}toast('Event saved!','success');S.calForm=null;S._viewingEvent=null;loadCalendar_();})
      .withFailureHandler(function(e){if(btn){btn.disabled=false;btn.textContent='Save Event';}toast(e&&e.message?e.message:'Save failed.','error');})
      .saveHotzoneCalendarEvent({sessionToken:tok(),event_id:(S.calForm&&S.calForm.event_id)||'',event_date:date,title:title.trim(),message:msg.trim(),link_url:lUrl.trim(),link_title:lTitle.trim()});
  }

  function delCalEvent_(eventId){
    var prev=JSON.parse(JSON.stringify(S.calendar));
    S.calendar=S.calendar.filter(function(e){return e.event_id!==eventId;});
    S.calForm=null;S._viewingEvent=null;renderView_();
    google.script.run.withSuccessHandler(function(){toast('Deleted.','info');}).withFailureHandler(function(e){S.calendar=prev;toast(e&&e.message?e.message:'Delete failed.','error');renderView_();}).deleteHotzoneCalendarEvent({sessionToken:tok(),event_id:eventId});
  }

  function loadSavedCategories_(cb){google.script.run.withSuccessHandler(function(res){S.savedCategories=(res&&res.success&&res.data&&res.data.categories)||[];if(typeof cb==='function')cb();else renderView_();}).withFailureHandler(function(){if(typeof cb==='function')cb();else renderView_();}).getHotzoneCategories({sessionToken:tok()});}

  function saveSCEdit_(){
    var sc=S.scEditing;if(!sc)return;
    var sec=(byId('hz2SCSec')||{}).value||sc.section,title=(byId('hz2SCTitle')||{}).value||'',body=(byId('hz2SCBody')||{}).value||'';
    var lUrl=(byId('hz2SCLinkUrl')||{}).value||'',lTitle=(byId('hz2SCLinkTitle')||{}).value||'';
    var prev=JSON.parse(JSON.stringify(S.savedCategories));
    S.savedCategories=S.savedCategories.map(function(c){return c.category_id===sc.category_id?Object.assign({},c,{section:sec,title:title.trim(),body:body.trim(),link_url:lUrl.trim(),link_title:lTitle.trim()}):c;});
    S.scEditing=null;renderView_();
    google.script.run
      .withSuccessHandler(function(res){if(!res||!res.success){S.savedCategories=prev;toast((res&&res.error)||'Save failed.','error');renderView_();return;}toast('Saved!','success');})
      .withFailureHandler(function(e){S.savedCategories=prev;toast(e&&e.message?e.message:'Save failed.','error');renderView_();})
      .saveHotzoneCategory({sessionToken:tok(),category_id:sc.category_id,section:sec,title:title.trim(),body:body.trim(),link_url:lUrl.trim(),link_title:lTitle.trim(),image_url:sc.image_url||'',image_file_id:sc.image_file_id||''});
  }

  function delSavedCategory_(cid){
    var prev=JSON.parse(JSON.stringify(S.savedCategories));
    S.savedCategories=S.savedCategories.filter(function(c){return c.category_id!==cid;});renderView_();
    google.script.run.withSuccessHandler(function(){toast('Deleted.','info');}).withFailureHandler(function(e){S.savedCategories=prev;toast(e&&e.message?e.message:'Delete failed.','error');renderView_();}).deleteHotzoneCategory({sessionToken:tok(),category_id:cid});
  }

  window.openHotzoneManagement_ = function(){
    injectCSS_();
    Object.assign(S,{view:'list',editions:[],currentEdition:null,contributions:{},activeSection:null,editingContrib:null,pendingImage:null,loading:true,calForm:null,_viewingEvent:null,calendar:[],emailDialog:null,confirmModal:null,savedCategories:[],scEditing:null,scFilter:'',scSelected:{},_page:0,_selectedEditions:{},_editionCacheTs:0,_contribCache:{},_saving:false});
    _browseSCOpen=false;
    if(typeof portalShowLoadingV414==='function')portalShowLoadingV414('Loading Hot Zone...',30);
    mountShell_();setTimeout(function(){renderView_();loadEditions_(true);},20);
  };

  window.openHotzoneViewer_ = function(){
    injectCSS_();
    Object.assign(S,{view:'viewonly',viewonlyTab:'newspaper',loading:true,calForm:null,_viewingEvent:null,emailDialog:null,confirmModal:null});
    if(typeof portalShowLoadingV414==='function')portalShowLoadingV414('Loading Hot Zone...',30);
    mountShell_();
    setTimeout(function(){
      google.script.run
        .withSuccessHandler(function(res){S.loading=false;if(typeof portalHideLoadingV414==='function')portalHideLoadingV414();if(res&&res.success&&res.data){S.currentEdition=res.data.edition||null;S.contributions=res.data.contributions||{};}loadCalendar_(function(){renderView_();});})
        .withFailureHandler(function(){S.loading=false;if(typeof portalHideLoadingV414==='function')portalHideLoadingV414();renderView_();})
        .getHotzoneLatestPublished({sessionToken:tok()});
    },20);
  };

})();
</script>
