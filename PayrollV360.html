<script>
// PAYROLL MODULE V360 — Full rewrite
(function payrollModuleV360_() {

  var S = window.payrollStateV360 = window.payrollStateV360 || {
    mode: 'submission',
    subTab: 'FORM',
    reviewTab: 'INBOX',
    step: 0,
    data: null,
    reviewData: null,
    adminData: null,
    roeData: null,
    dashData: null,
    currentDraft: null,
    openId: '',        // expanded view card
    editId: '',        // inline-editing card (review)
    selectedIds: {},   // bulk approve checkboxes
    answers: {},
    filters: { restaurant: 'ALL', status: 'ALL', search: '', dateMode: '7d', dateFrom: '', dateTo: '' },
    roePoolPage: 0,    // current page for ROE pool table
    reviewPage: 0,     // current page for review list
    dashDateMode: '7d',// date filter for MRO dashboard
    busy: false
  };

  var SECTIONS = {
    attendanceBonusRows:  { title:'Attendance Bonus',                   addText:'Add Employee', columns:[{key:'employeeId',label:'Employee',type:'employee'},{key:'attendancePercentage',label:'Attendance %',type:'number'}] },
    newHireRows:          { title:'New Hire / Returned From Leave',      addText:'Add Employee', columns:[{key:'employeeId',label:'Employee',type:'employee'},{key:'type',label:'Type',type:'select',options:['New Hire','Returned From Leave']},{key:'startDate',label:'Start Date',type:'date'}] },
    roeRows:              { title:'ROE Applications', addText:'Attach ROE', columns:[{key:'roeApplicationId',label:'ROE Application',type:'roeApplication'},{key:'employeeName',label:'Employee',type:'readonly'},{key:'terminationDate',label:'Last Day',type:'readonly'},{key:'reasonForSeparation',label:'Reason',type:'readonly'}] },
    missingTrainingRows:  { title:'Missing / Training Hours',            addText:'Add Employee', columns:[{key:'employeeId',label:'Employee',type:'employee'},{key:'missingHours',label:'Missing Hrs',type:'number'},{key:'trainingHours',label:'Training Hrs',type:'number'},{key:'reason',label:'Reason',type:'text'}] },
    uniformDeductionRows: { title:'Uniform Deduction (Extra Uniforms)',  addText:'Add Employee', columns:[{key:'employeeId',label:'Employee',type:'employee'},{key:'item',label:'Item',type:'text'},{key:'amount',label:'Amount ($)',type:'number'},{key:'reason',label:'Reason',type:'text'}] }
  };
  var SECTION_ORDER = ['attendanceBonusRows','newHireRows','roeRows','missingTrainingRows','uniformDeductionRows'];
  var STEPS = ['START','DETAILS'].concat(SECTION_ORDER).concat(['NOTES','REVIEW']);

  // ── Utils ─────────────────────────────────────────────────────────────
  function $(id){ return document.getElementById(id); }
  function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function cl(v){ return String(v==null?'':v).trim(); }
  function esc(v){ return cl(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function up(v){ return cl(v).toUpperCase(); }
  function token_(){ try{if(typeof getSessionToken_==='function')return getSessionToken_()||'';}catch(e){} try{return sessionStorage.getItem('portalSessionToken')||'';}catch(e){} return ''; }
  function toast_(msg,type){
    type=type||'info';
    var host=$('payrollPageV360')||document.body;
    var box=$('p60InlineToast');
    if(!box){
      box=document.createElement('div');
      box.id='p60InlineToast';
      box.setAttribute('role','status');
      box.style.cssText='position:fixed;right:24px;bottom:24px;z-index:99999;max-width:420px;padding:12px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);font-weight:700;background:#eef6ff;color:#16456b;border:1px solid #bcd7ef;display:none';
      host.appendChild(box);
    }
    var colors={success:['#e9f8ed','#17622a','#bce7c5'],error:['#fff0f0','#9b1c1c','#f3b4b4'],info:['#eef6ff','#16456b','#bcd7ef'],warning:['#fff8e6','#7a5200','#f5dba0']};
    var c=colors[type]||colors.info;
    box.style.background=c[0];box.style.color=c[1];box.style.borderColor=c[2];
    box.textContent=msg||'';box.style.display='block';
    clearTimeout(box._timer);
    box._timer=setTimeout(function(){box.style.display='none';},3600);
  }
  function todayISO_(){ return new Date().toISOString().slice(0,10); }
  // Normalize any date value to YYYY-MM-DD for use in <input type="date"> value attrs.
  // Handles: ISO strings with time, MM/DD/YYYY, spreadsheet serial numbers, plain YYYY-MM-DD.
  function toDateInput_(v){
    if(!v)return'';
    var s=cl(String(v));
    // Already YYYY-MM-DD
    if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
    // ISO datetime — slice off time
    if(/^\d{4}-\d{2}-\d{2}T/.test(s))return s.slice(0,10);
    // Spreadsheet serial number (number of days since Dec 30 1899)
    if(/^\d{4,6}$/.test(s)){
      var epoch=new Date(1899,11,30);
      epoch.setDate(epoch.getDate()+parseInt(s,10));
      return epoch.toISOString().slice(0,10);
    }
    // Try JS Date parse for other formats (MM/DD/YYYY, "March 15 2025", etc.)
    var d=new Date(s);
    if(!isNaN(d.getTime()))return d.toISOString().slice(0,10);
    return'';
  }
  function fmtDate_(v){ if(!v)return''; var d=new Date(v); return isNaN(d)?cl(v):d.toLocaleDateString(); }
  // For date-only fields (pay_period_ending etc) — strips time before formatting
  function fmtDateOnly_(v){
    if(!v)return'';
    // Normalize to YYYY-MM-DD first (strips any time/timezone)
    var iso=toDateInput_(v);
    if(iso){
      // Parse as local date to avoid timezone shift
      var parts=iso.split('-');
      var d=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
      return isNaN(d)?iso:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    }
    var d=new Date(v);
    return isNaN(d)?cl(v):d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  function fmtDateTime_(v){ if(!v)return''; var d=new Date(v); return isNaN(d)?cl(v):d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
  function statusLabel_(s){ var v=up(s||'DRAFT'); var m={DRAFT:'Draft',SUBMITTED:'Submitted',VIEWED:'Viewed by MRO',IN_REVIEW:'In Review',CORRECTION_NEEDED:'Correction Needed',RESUBMITTED:'Resubmitted',APPROVED:'Approved',RECALLED:'Recalled',REJECTED:'Rejected'}; return m[v]||cl(s||'DRAFT').replace(/_/g,' '); }
  function statusCls_(s){ return up(s||'DRAFT').replace(/[^A-Z0-9]+/g,'-'); }
  function isEditable_(s,row){ var v=up(s||''); var locked=row&&up(row.locked_by_mro)==='YES'; if(locked)return false; return v==='DRAFT'||v==='SUBMITTED'||v==='CORRECTION_NEEDED'||v==='RECALLED'; }
  function activeCorrectionNote_(row){ return up(row&&row.status)==='CORRECTION_NEEDED' ? cl(row.correction_notes||row.admin_notes||'') : ''; }
  function approvalSummaryHtml_(row){ if(up(row&&row.status)!=='APPROVED')return''; return '<div class="p60-note-box p60-note-success" style="margin-top:10px"><b>Approved by MRO</b>'+(row.approved_at?' · '+esc(fmtDateTime_(row.approved_at)):'')+(Number(row.correction_count||0)>0?' · Corrections: '+esc(row.correction_count):'')+'</div>'; }
  function canRecall_(s,row){ var v=up(s||''); var locked=row&&up(row.locked_by_mro)==='YES'; return !locked&&(v==='DRAFT'||v==='SUBMITTED'); }
  function canReturnToRestaurant_(row){ return !!row && up(row.status)==='IN_REVIEW' && up(row.locked_by_mro)==='YES'; }
  function isMRO_(){ try{ var r=up((window.state&&state.session&&state.session.roleCode)||''); return r==='MRO'||r==='HR_ADMIN'||r==='SUPER_ADMIN'||r==='SENIOR_MANAGEMENT'; }catch(e){return false;} }

  // ── Page lifecycle ────────────────────────────────────────────────────
  function hideMain_(){
    var ds=document.querySelector('.dashboard-stage');
    if(ds){ds.hidden=false;ds.style.display='';}
    ['dashboard-grid','.newsletter','.right-column','.login-stage'].forEach(function(s){
      var el=s.startsWith('.')?document.querySelector(s):$(s)||document.querySelector('.'+s);
      if(el)el.style.display='none';
    });
    var aw=$('adminWorkspace');if(aw)aw.hidden=true;
    ['payrollModulePageV340','payrollModulePageV342','payrollModulePageV350'].forEach(function(id){var e=$(id);if(e){e.hidden=true;e.style.display='none';}});
  }
  function cleanupUI_(){
    S.busy=false;
    var pg=$('payrollPageV360');
    if(pg){pg.hidden=true;pg.style.display='none';var c=$('payrollContentV360');if(c)c.innerHTML='';}
    document.body.classList.remove('payroll-open');
    document.body.style.overflow='';
  }
  function ensurePage_(){
    var pg=$('payrollPageV360');
    if(pg)return pg;
    pg=document.createElement('section');
    pg.id='payrollPageV360'; pg.hidden=true;
    pg.innerHTML='<div id="payrollContentV360"></div>';
    (document.querySelector('.dashboard-stage')||document.querySelector('.app-shell')||document.body).appendChild(pg);
    injectStyles_();
    return pg;
  }
  function showPage_(){ hideMain_(); var pg=ensurePage_(); pg.hidden=false;pg.style.display='block';pg.style.pointerEvents='auto'; document.body.classList.add('payroll-open'); window.scrollTo({top:0,behavior:'smooth'}); }
  function setContent_(html){ var c=$('payrollContentV360');if(c)c.innerHTML=html; }
  function backToDash_(){
    cleanupUI_();
    try{if(typeof goBackToDashboardHome==='function'){goBackToDashboardHome();return;}}catch(e){}
    try{if(typeof restoreDashboardHomeLayout_==='function'){restoreDashboardHomeLayout_();return;}}catch(e){}
    ['dashboard-grid','.center-column','.newsletter','.right-column'].forEach(function(s){var el=s.startsWith('.')?document.querySelector(s):$(s)||document.querySelector('.'+s);if(el)el.style.display='';});
    var aw=$('adminWorkspace');if(aw)aw.hidden=true;
    try{if(window.state)state.currentActionKey='';}catch(e){}
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ── Data helpers ──────────────────────────────────────────────────────
  function normRn_(v){ return cl(v).replace(/[^0-9A-Za-z]/g,'').toUpperCase(); }
  function restaurantKeyMap_(){
    var map={};
    function add(arr){(arr||[]).forEach(function(r){
      var rn=cl(r.restaurant_number||r.restaurantNumber||r.restaurant_code||r.restaurantCode||r.number||r.code||'');
      var id=cl(r.restaurant_id||r.restaurantId||r.id||'');
      if(rn){map[normRn_(rn)]=rn;}
      if(id&&rn){map[normRn_(id)]=rn;}
    });}
    try{add(S.data&&S.data.restaurants);}catch(e){}
    try{add(S.reviewData&&S.reviewData.restaurants);}catch(e2){}
    try{add(S.adminData&&S.adminData.restaurants);}catch(e3){}
    try{add(window.state&&state.adminTools&&state.adminTools.restaurants);}catch(e4){}
    return map;
  }
  function normalizeRestaurantKey_(value){
    value=cl(value);
    if(!value)return '';
    var map=restaurantKeyMap_();
    return map[normRn_(value)]||value;
  }
  function employeeRestaurants_(r){
    var raw=[
      r.restaurant_number,
      r.restaurantNumber,
      r.restaurant_code,
      r.restaurantCode,
      r.assigned_restaurant,
      r.assignedRestaurant,
      r.assigned_restaurant_number,
      r.assignedRestaurantNumber,
      r.restaurant_id,
      r.restaurantId,
      r.restaurantNumbers,
      r.restaurant_numbers
    ];
    var out=[];
    raw.forEach(function(x){
      cl(x).split(',').forEach(function(part){
        var mapped=normalizeRestaurantKey_(part);
        if(mapped && out.indexOf(mapped)===-1)out.push(mapped);
      });
    });
    return out;
  }
  function employeeMatchesRestaurant_(emp,rn){
    var target=normRn_(rn);
    if(!target) return true;
    return (emp.restaurantKeys||[]).some(function(x){ return normRn_(x)===target; });
  }
  function allEmployees_(){
    var list=[],seen={};
    function add(arr){(arr||[]).forEach(function(r){
      var name=cl(r.full_name||r.name||r.team_member_name||r.employee_name||((r.first_name||'')+' '+(r.last_name||'')).trim());
      var id=cl(r.employee_id||r.team_member_id||r.teamMemberId||r.id||name);
      if(!id||seen[id])return; seen[id]=true;
      var st=up(r.status||r.employee_status||'ACTIVE');
      if(['INACTIVE','ARCHIVED','QUIT','DID NOT SHOW UP','DIDNT SHOW UP','TERMINATED','DEACTIVATED'].indexOf(st)!==-1)return;
      var keys=employeeRestaurants_(r);
      list.push({
        id:id,
        name:name||id,
        rn:keys[0]||'',
        restaurantKeys:keys,
        first:cl(r.first_name||r.firstName||''),
        last:cl(r.last_name||r.lastName||'')
      });
    });}
    add(S.data&&S.data.employees); add(S.reviewData&&S.reviewData.employees);
    try{add(window.state&&state.adminTools&&(state.adminTools.teamMembers||state.adminTools.employees));}catch(e){}
    return list.sort(function(a,b){return a.name.localeCompare(b.name);});
  }
  function empOptions_(selected,rn){
    var all=allEmployees_();
    var list=rn ? all.filter(function(e){return employeeMatchesRestaurant_(e,rn);}) : all;
    var html='<option value="">Select employee</option>';
    if(rn && !list.length){
      return html+'<option value="" disabled>No active employees found for selected restaurant</option>';
    }
    list.forEach(function(e){ var sel=(cl(selected)===e.id||cl(selected)===e.name)?' selected':''; html+='<option value="'+esc(e.id)+'" data-name="'+esc(e.name)+'" data-first="'+esc(e.first)+'" data-last="'+esc(e.last)+'"'+sel+'>'+esc(e.name)+'</option>'; });
    return html;
  }
  function rnOptions_(selected,includeAll){
    var list=[],seen={};
    function add(arr){(arr||[]).forEach(function(r){var n=cl(r.restaurant_number||r.restaurantNumber||r.restaurant_code||'');if(n&&!seen[n]){seen[n]=true;list.push({n:n,label:n+(r.restaurant_name||r.name?' – '+(r.restaurant_name||r.name):'')}); }});}
    add(S.data&&S.data.restaurants); add(S.reviewData&&S.reviewData.restaurants);
    try{add(window.state&&state.adminTools&&state.adminTools.restaurants);}catch(e){}
    if(!list.length) add(((S.data&&S.data.submissions)||[]).concat((S.reviewData&&S.reviewData.submissions)||[]));
    list.sort(function(a,b){return a.n.localeCompare(b.n);});
    var html=includeAll?'<option value="ALL">All Restaurants</option>':'<option value="">Select restaurant…</option>';
    list.forEach(function(r){html+='<option value="'+esc(r.n)+'"'+(cl(selected)===r.n?' selected':'')+'>'+esc(r.label)+'</option>';});
    return html;
  }

  // ── Draft helpers ─────────────────────────────────────────────────────
  function defaultDraft_(){
    var rn='';try{rn=cl((S.data&&S.data.restaurantNumber)||(window.state&&state.session&&(state.session.restaurantNumber||state.session.restaurantId))||'');}catch(e){}
    return {restaurantNumber:rn,payPeriodEnding:todayISO_(),timeCardUpdated:'Yes',statHours:'',specialNotes:'',attendanceBonusRows:[],newHireRows:[],roeRows:[],missingTrainingRows:[],uniformDeductionRows:[]};
  }
  function draft_(){ S.currentDraft=S.currentDraft||defaultDraft_(); return S.currentDraft; }
  function readScreen_(){
    var d=draft_();
    var m={restaurant:'payrollRnV360',period:'payrollPeriodV360',timeCard:'payrollTimeCardV360',stat:'payrollStatV360',notes:'payrollNotesV360'};
    Object.keys(m).forEach(function(k){var el=$(m[k]);if(el){if(k==='restaurant')d.restaurantNumber=el.value;else if(k==='period')d.payPeriodEnding=el.value;else if(k==='timeCard')d.timeCardUpdated=el.value;else if(k==='stat')d.statHours=el.value;else if(k==='notes')d.specialNotes=el.value;}});
    SECTION_ORDER.forEach(function(key){if($('payrollTable_'+key))d[key]=collectRows_(key);if(S.answers[key]==='SKIP')d[key]=[];});
  }
  function collectRows_(key){
    var rows=[];var tbl=$('payrollTable_'+key);if(!tbl)return rows;
    qsa('tbody tr',tbl).forEach(function(tr){
      var obj={};qsa('[data-field]',tr).forEach(function(inp){
        var f=inp.getAttribute('data-field');obj[f]=inp.value;
        if(f==='employeeId'){var o=inp.options[inp.selectedIndex];obj.employeeName=o?(o.getAttribute('data-name')||o.textContent):'';obj.firstName=o?o.getAttribute('data-first'):'';obj.lastName=o?o.getAttribute('data-last'):'';}
      });
      if(rowHasMeaningfulInputForSectionV22_(key,obj)) rows.push(obj);
    });
    return rows;
  }

  // V22: Do not save empty/default section rows.
  // This stops blank New Hire rows from showing only Type = New Hire later.
  function rowHasMeaningfulInputForSectionV22_(key,row){
    row=row||{};
    function real(v){
      var x=cl(v);
      if(!x)return false;
      if(/^select employee$/i.test(x))return false;
      if(/^select$/i.test(x))return false;
      if(x==='—')return false;
      return true;
    }
    if(key==='attendanceBonusRows') return real(row.employeeId)||real(row.employeeName)||real(row.attendancePercentage);
    if(key==='newHireRows') return real(row.employeeId)||real(row.employeeName)||real(row.startDate);
    if(key==='roeRows') return real(row.roeApplicationId)||real(row.employeeName)||real(row.terminationDate)||real(row.reasonForSeparation);
    if(key==='missingTrainingRows') return real(row.employeeId)||real(row.employeeName)||real(row.missingHours)||real(row.trainingHours)||real(row.reason);
    if(key==='uniformDeductionRows') return real(row.employeeId)||real(row.employeeName)||real(row.item)||real(row.amount)||real(row.reason);
    return Object.keys(row).some(function(k){return real(row[k]);});
  }

  function buildPayload_(){
    readScreen_();var d=draft_();
    return {sessionToken:token_(),submissionId:d.submissionId||'',restaurantNumber:d.restaurantNumber||'',payPeriodEnding:d.payPeriodEnding||'',timeCardUpdated:d.timeCardUpdated||'',statHours:d.statHours||'',payrollApproval:'',specialNotes:d.specialNotes||'',attendanceBonusRows:d.attendanceBonusRows||[],newHireRows:d.newHireRows||[],roeRows:d.roeRows||[],missingTrainingRows:d.missingTrainingRows||[],uniformDeductionRows:d.uniformDeductionRows||[]};
  }
  function validatePayload_(p){ if(!p.restaurantNumber)return'Please select a restaurant.'; if(!p.payPeriodEnding)return'Please enter the week ending date.'; if(!p.timeCardUpdated)return'Please confirm time card status.'; return''; }
  function rowFromSubmission_(row){
    var p={};try{p=JSON.parse(row.payload_json||'{}');}catch(e){}
    return {submissionId:row.submission_id||'',restaurantNumber:row.restaurant_number||'',payPeriodEnding:toDateInput_(row.pay_period_ending)||todayISO_(),timeCardUpdated:row.time_card_updated||'Yes',statHours:row.stat_hours_1_0||'',specialNotes:row.special_notes||'',status:row.status||'DRAFT',attendanceBonusRows:p.attendanceBonusRows||[],newHireRows:p.newHireRows||[],roeRows:p.roeRows||[],missingTrainingRows:p.missingTrainingRows||[],uniformDeductionRows:p.uniformDeductionRows||[]};
  }
  function findRow_(id,admin){
    var list=admin?(S.reviewData&&S.reviewData.submissions||[]):(S.data&&S.data.submissions||[]);
    return list.find(function(r){return String(r.submission_id||r.submissionId||'')===String(id);})||null;
  }

  // ── Button level cache helpers ───────────────────────────────────────
  var PAYROLL_BUTTON_CACHE_MS = 60000;

  function buttonCache_(){
    S.buttonCache = S.buttonCache || {};
    return S.buttonCache;
  }

  function isFreshCache_(item){
    return !!(item && item.data && (Date.now() - (item.loadedAt || 0) < PAYROLL_BUTTON_CACHE_MS));
  }

  function getButtonCache_(key){
    var item = buttonCache_()[key];
    return isFreshCache_(item) ? item.data : null;
  }

  function setButtonCache_(key,data){
    if(!data)return;
    buttonCache_()[key] = { data:data, loadedAt:Date.now() };
  }

  function clearPayrollButtonCache_(area){
    var c = buttonCache_();
    if(!area || area==='ALL'){
      S.buttonCache = {};
      S.adminSummaryCache = {};
      S.data = null;
      S.reviewData = null;
      S.adminData = null;
      adminClearViewCache_ && adminClearViewCache_();
      return;
    }
    if(area==='submission'){ delete c.submission; S.data=null; S.roeData=null; }
    // V31 FIX: Do not wipe the live Payroll Review data while the page is open.
    // After approving one payroll, renderReviewList_ still needs S.reviewData to show the remaining In Review items.
    // We only remove the saved button cache so next full page open can reload fresh data.
    if(area==='review'){ delete c.review; }
    if(area==='admin'){
      Object.keys(c).forEach(function(k){ if(k.indexOf('admin:')===0) delete c[k]; });
      S.adminData=null;
      S.adminSummaryCache = {};
      adminClearViewCache_ && adminClearViewCache_();
    }
  }

  function adminButtonCacheKey_(){
    return 'admin:'+[S.adminTab||'BATCHES',S.adminBatchKey||'',S.adminPage||0,S.adminAuditPage||0,S.adminDateMode||'7d',S.adminBrand||'ALL',S.adminRestaurant||'ALL',S.adminSearch||''].join('|');
  }

  // ── Open pages ────────────────────────────────────────────────────────
  function openSubmission_(){
    S.mode='submission';
    showPage_();

    // V25: Payroll Submission tabs should feel instant.
    // Use current or cached data first, then refresh in the background for My Submissions and Approved.
    var cached = S.data || getButtonCache_('submission');
    if(cached){
      S.data = cached;
      if(!S.currentDraft)S.currentDraft=defaultDraft_();
      loadRoeData_(renderSubmission_);
      if(['MINE','APPROVED'].indexOf(S.subTab || '') !== -1){
        refreshSubmissionDataSilently_(false);
      }
      return;
    }

    setContent_('<div class="p60-head"><div class="p60-title"><h2>Payroll Submission</h2><p>Loading…</p></div></div><div class="p60-body"><div class="p60-empty">Loading…</div></div>');
    google.script.run
      .withSuccessHandler(function(res){
        if(!res||!res.success){var msg=(res&&res.error)||'Could not load payroll.';toast_(msg,'error');setContent_('<div class="p60-head"><div class="p60-title"><h2>Payroll Submission</h2><p>Could not load.</p></div></div><div class="p60-body"><div class="p60-empty">'+esc(msg)+'</div></div>');return;}
        S.data=res.data||{};
        setButtonCache_('submission',S.data);
        if(!S.currentDraft)S.currentDraft=defaultDraft_();
        loadRoeData_(renderSubmission_);
      })
      .withFailureHandler(function(e){toast_(e&&e.message?e.message:'Could not load payroll.','error');})
      .getPayrollSubmissionWorkspaceData(token_());
  }

  function refreshSubmissionDataSilently_(forceRender){
    if(S.submissionRefreshBusy)return;
    S.submissionRefreshBusy=true;
    google.script.run
      .withSuccessHandler(function(res){
        S.submissionRefreshBusy=false;
        if(!res||!res.success)return;
        S.data=res.data||{};
        setButtonCache_('submission',S.data);
        if(forceRender || S.mode==='submission'){
          if(['MINE','APPROVED'].indexOf(S.subTab || '') !== -1) renderSubmission_();
        }
      })

  function loadRoeData_(callback, forceRefresh){
    var rn='';
    try{ rn=(draft_&&draft_().restaurantNumber)||''; }catch(e){}
    try{ if(!rn && S.data) rn=S.data.restaurantNumber||S.data.restaurant_number||''; }catch(e2){}
    try{ if(!rn && window.state && state.session) rn=state.session.restaurantNumber||state.session.restaurant_number||state.session.restaurantId||''; }catch(e3){}

    function done_(){
      if(typeof callback==='function'){
        try{ callback(); }catch(cbErr){ console.error('Payroll ROE callback failed', cbErr); }
      }
    }

    // Use cached ROE data if available and not forcing refresh
    if(!forceRefresh && S.roeData && (S.roeData.roes||S.roeData.pool)){
      done_();
      return;
    }

    if(!window.google || !google.script || !google.script.run){
      S.roeData = S.roeData || { roes:[], pool:[] };
      done_();
      return;
    }

    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.success){
          S.roeData = res.data || { roes:[], pool:[] };
        } else {
          S.roeData = { roes:[], pool:[] };
          console.warn((res&&res.error)||'ROE data could not load.');
        }
        done_();
      })
      .withFailureHandler(function(e){
        S.roeData = { roes:[], pool:[] };
        console.warn('getPayrollRoeApplicationData failed', e);
        done_();
      })
      .getPayrollRoeApplicationData({sessionToken:token_(),restaurantNumber:rn});
  }

  function normalizeRoeStatus_(value){ return up(value||'ROE_SUBMITTED'); }
  function roePool_(){
    var d=draft_();
    var rn=normalizeRestaurantKey_(d.restaurantNumber||'');
    var data=S.roeData||{};
    var rows=(data.pool&&data.pool.length?data.pool:data.roes)||[];
    return rows.filter(function(r){
      var rowRn=normalizeRestaurantKey_(r.restaurant_number||r.restaurantNumber||r.restaurant_id||r.restaurantId||'');
      var same=!rn||!rowRn||normRn_(rowRn)===normRn_(rn);
      var attached=cl(r.payroll_submission_id||r.payrollSubmissionId||r.attached_payroll_id||'');
      var status=normalizeRoeStatus_(r.status);
      var usable=['ROE_SUBMITTED','ROE_APPROVED','CORRECTION_NEEDED'].indexOf(status)!==-1;
      return same && !attached && usable;
    });
  }
  function roeById_(id){
    id=cl(id);
    if(!id)return null;
    var data=S.roeData||{};
    var rows=[].concat(data.pool||[],data.roes||[],data.roeApplications||[]);
    for(var i=0;i<rows.length;i++){
      var r=rows[i]||{};
      if(cl(r.roe_id||r.roeId||r.submission_id||r.submissionId)===id)return r;
    }
    return null;
  }
  function roeEmployeeName_(r){
    return cl(r&&(r.employee_name||r.employeeName||((r.first_name||r.firstName||'')+' '+(r.last_name||r.lastName||'')).trim()))||'';
  }
  function roeOptions_(selected){
    var rows=roePool_();

      var name=roeEmployeeName_(r);

  function badgeHtml_(status){
    var s = up(status||'');
    var map = {
      'ROE_SUBMITTED':'Submitted','ROE_APPROVED':'Approved',
      'CORRECTION_NEEDED':'Correction','COMPLETED':'Completed',

  var ROE_PAGE_SIZE = 5;

  function roePoolTableHtml_(roes){
    var page = S.roePoolPage || 0;
    var total = roes.length;
    var totalPages = Math.max(1, Math.ceil(total / ROE_PAGE_SIZE));
    page = Math.min(page, totalPages - 1);

    var pageRoes = roes.slice(page * ROE_PAGE_SIZE, (page + 1) * ROE_PAGE_SIZE);

    var html = '<div class="p60-section-label" style="display:flex;justify-content:space-between;align-items:center">'
      + '<span>ROE Pool for this Restaurant</span>'

          ? '<span style="font-size:.8rem;font-weight:700;color:#555">Showing '+(page*ROE_PAGE_SIZE+1)+'–'+Math.min((page+1)*ROE_PAGE_SIZE,total)+' of '+total+'</span>'

      + '</div>';

      return html + '<div class="p60-empty">No ROE applications yet.</div>';
    }

    html += '<table class="p60-read-table"><thead><tr>'
      + '<th>ROE ID</th><th>Employee</th><th>Reason</th><th>Status</th><th>Payroll</th>'
      + '</tr></thead><tbody>';

        + '<span style="font-size:.83rem;color:#555;font-weight:700">Page '+(page+1)+' of '+totalPages+'</span>'
        + '<button class="p60-btn-sm" id="roePoolNext"'+(page>=totalPages-1?' disabled':'')+'>Next →</button>'
        + '</div>';
    }
    return html;
  }

  function bindRoePoolPagination_(roes){

  function adminViewCacheKeyFor_(tab,batchKey,page){
    tab=tab||S.adminTab||'BATCHES';
    batchKey=(batchKey!==undefined)?batchKey:(S.adminBatchKey||'');
    if(page===undefined||page===null){
      page=(tab==='AUDIT')?(S.adminAuditPage||0):(S.adminPage||0);

  function adminGetCachedView_(){
    var key=adminViewCacheKey_();
    var cache=S.adminViewCache||{};
    var item=cache[key];
    if(!item||!item.data)return null;
    // Keep tab cache for 5 minutes. Manual refresh will clear it earlier.
    if(Date.now()-(item.loadedAt||0)>300000)return null;
    return item.data;
  }

  function adminSetCachedViewFor_(tab,batchKey,page,data){
    if(!data)return;
    S.adminViewCache=S.adminViewCache||{};
    S.adminViewCache[adminViewCacheKeyFor_(tab,batchKey,page)]={data:data,loadedAt:Date.now()};

  function adminPrefetchAdminTabs_(){
    if(S.mode!=='payroll-admin')return;
    if(S.adminPrefetchingTabs)return;

    var tabs=['BATCHES','APPROVED','ROE_PENDING','ROE_DONE','AUDIT'];
    var missing=tabs.filter(function(tab){
      var key=adminViewCacheKeyFor_(tab,'',0);
      var item=(S.adminViewCache||{})[key];
      return !(item&&item.data&&Date.now()-(item.loadedAt||0)<300000);
    });
    if(!missing.length)return;

    S.adminPrefetchingTabs=true;
    var left=missing.length;
    missing.forEach(function(tab){
      var payload={
        sessionToken:token_(),
        tab:tab,
        batchKey:'',
        page:0,
        pageSize:ADMIN_PAGE_SIZE,
        dateMode:S.adminDateMode||'7d',
        brand:S.adminBrand||'ALL',
        restaurant:S.adminRestaurant||'ALL',
        search:S.adminSearch||'',
        forceRefresh:false
      };
      google.script.run
        .withSuccessHandler(function(res){
          if(res&&res.success){
            var data=res.data||{};
            adminSetCachedViewFor_(tab,'',0,data);
            if((tab==='BATCHES'||tab==='APPROVED') && (data.batches||[]).length){
              S.adminListCacheMap=S.adminListCacheMap||{};
              S.adminListCacheMap[adminListCacheKey_(tab)]={key:adminListCacheKey_(tab),data:data,loadedAt:Date.now()};
            }
          }
          left--;
          if(left<=0)S.adminPrefetchingTabs=false;
        })
        .withFailureHandler(function(){
          left--;
          if(left<=0)S.adminPrefetchingTabs=false;
        })
        .queryPayrollAdminWorkspaceData(payload);
    });
  }

  }

    // Do not reload Payroll Admin on every tab click.
    // Use browser cache unless this is a real manual refresh.
    if(!S.adminForceRefresh){
      if(adminUseCachedView_())return;
      if(isBatchList && adminUseCachedBatchList_())return;

    S.adminLoading=true;
    if(showLoading){
      renderPayrollAdmin_();

      .withSuccessHandler(function(res){

          S.adminListCache={key:adminListCacheKey_(S.adminTab||'BATCHES'),data:S.adminData,loadedAt:Date.now()};
        }
        if(S.adminBatchKey && S.adminData.viewMode==='batch_detail' && !S.adminData.batch){

      .withFailureHandler(function(e){
        S.adminLoading=false;
        S.adminForceRefresh=false;

  function payrollHistoryListFromRow_(row){
    row=row||{};
    var h=[];
    if(Array.isArray(row.status_history))h=h.concat(row.status_history);
    if(Array.isArray(row.history))h=h.concat(row.history);
    if(Array.isArray(row.payroll_history))h=h.concat(row.payroll_history);
    ['payroll_history_json','status_history_json','history_json'].forEach(function(k){
      var raw=row[k];
      if(!raw)return;
      try{
        var parsed=JSON.parse(raw||'[]');
        if(Array.isArray(parsed))h=h.concat(parsed);
      }catch(e){}
    });

    function pushIf(at,by,action,note){
      if(!at && !by && !action)return;
      h.push({at:at||'',by:by||'System',action:action||'',status:action||'',note:note||''});
    }

    if(!h.length){
      pushIf(row.submitted_at,row.submitted_by||row.submitted_by_name,'SUBMITTED','Payroll submitted');
      pushIf(row.reviewed_at||row.admin_viewed_at,row.reviewed_by||row.admin_viewed_by,'VIEWED_BY_MRO','Payroll viewed');
      pushIf(row.approved_at||row.last_approved_at,row.approved_by_name||row.approved_by||row.reviewed_by||row.updated_by,'APPROVED','Payroll approved');
      pushIf(row.website_updated_at,row.website_updated_by,'WEBSITE_UPDATED','Marked done by Payroll Admin');
      pushIf(row.updated_at,row.updated_by,'UPDATED','Payroll updated');
    }

    var seen={};
    h=h.filter(function(x){
      if(!x)return false;
      var key=[payrollHistoryDate_(x),payrollHistoryBy_(x),x.action||x.status||'',x.note||''].join('|');
      if(seen[key])return false;
      seen[key]=true;
      return true;
    });
    h.sort(function(a,b){return new Date(payrollHistoryDate_(a)||0)-new Date(payrollHistoryDate_(b)||0);});
    return h;
  }

  function payrollHistoryDate_(x){ return (x&& (x.at||x.updated_at||x.timestamp||x.date||x.created_at))||''; }
  function payrollHistoryBy_(x){ return (x&& (x.by||x.updated_by||x.user||x.actor||x.name))||'System'; }

  function approvedByFromPayroll_(row){
    row=row||{};
    var direct=cl(row.approved_by_name||row.approved_by||row.reviewed_by||row.updated_by||row.admin_viewed_by||'');
    if(direct)return direct;
    var h=payrollHistoryListFromRow_(row).slice().reverse();
    for(var i=0;i<h.length;i++){
      var action=up(h[i].action||h[i].status||'');
      if(action==='APPROVED'||action.indexOf('APPROVED')!==-1){
        return payrollHistoryBy_(h[i]);
      }
    }
    return 'Not available';
  }

  function approvedAtFromPayroll_(row){
    row=row||{};
    var direct=cl(row.approved_at||row.last_approved_at||'');
    if(direct)return direct;
    var h=payrollHistoryListFromRow_(row).slice().reverse();
    for(var i=0;i<h.length;i++){
      var action=up(h[i].action||h[i].status||'');
      if(action==='APPROVED'||action.indexOf('APPROVED')!==-1){

  function submittedByFromPayroll_(row){

  function isMeaningfulPayrollEntry_(row){
    row=row||{};
    function good(v){
      v=cl(v);
      if(!v)return false;
      if(up(v)==='SELECT EMPLOYEE')return false;
      if(up(v)==='SELECT ROE APPLICATION')return false;
      return true;
    }
    var hasEmployee=good(row.employeeName)||good(row.employeeId)||good(row.firstName)||good(row.lastName);
    if(hasEmployee)return true;
    return Object.keys(row).some(function(k){
      var v=cl(row[k]);
      if(!good(v))return false;
      if(k==='type' && (up(v)==='NEW HIRE'||up(v)==='RETURNED FROM LEAVE') && !hasEmployee)return false;
      if(k==='roeApplicationId' && !good(row.employeeName) && !good(row.terminationDate) && !good(row.reasonForSeparation))return false;
      return true;
    });
  }

  function adminSummarySection_(title,rows){
    rows=(rows||[]).filter(isMeaningfulPayrollEntry_);
    if(!rows.length)return '';
    function label_(key){
      var map={
        employeeId:'Employee ID', employeeName:'Employee Name', firstName:'First Name', lastName:'Last Name',
        attendancePercentage:'Attendance %', type:'Type', startDate:'Start Date',
        roeApplicationId:'ROE Application ID', roeId:'ROE ID', submissionId:'Submission ID',
        terminationDate:'Last Day of Work', lastDayOfWork:'Last Day of Work', reasonForSeparation:'Reason for Separation',
        missingHours:'Missing Hours', trainingHours:'Training Hours', reason:'Reason',
        item:'Item', amount:'Amount', notes:'Notes'
      };
      if(map[key])return map[key];
      return String(key||'').replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g,function(c){return c.toUpperCase();});
    }
    function val_(value){return value==null||value===''?'—':value;}
    var keys=Object.keys(rows[0]||{}).filter(function(k){return k && rows.some(function(row){var v=cl(row[k]); return v && up(v)!=='SELECT EMPLOYEE';});});
    if(!keys.length)return '';
    return'<div class="p60-section-label">'+esc(title)+'</div><div class="p60-summary-list">'+rows.map(function(row){return'<div class="p60-summary-item">'+keys.map(function(k){return'<div class="p60-summary-pair"><span>'+esc(label_(k))+'</span><strong>'+esc(val_(row[k]))+'</strong></div>';}).join('')+'</div>';}).join('')+'</div>';
  }

  function adminUpdatePayrolls_(ids,action,batchKey){
    ids=(ids||[]).map(String).filter(Boolean);
    if(!ids.length){toast_('Select at least one payroll.','error');return;}
    if(S.busy)return;
    S.busy=true;

    var btns=[];
    ids.forEach(function(id){
      var b=document.querySelector('[data-mark-one-website="'+cssEscape_(id)+'"]');
      if(b)btns.push(b);
    });
    var bulk=$('p60MarkDone');
    if(bulk)btns.push(bulk);
    btns.forEach(function(b){
      b.disabled=true;
      b.setAttribute('aria-busy','true');
      b.dataset.oldText=b.textContent;
      b.textContent='Working...';
    });

    function markRowsDoneInMemory_(data){
      if(!data)return;
      function touch(row){
        if(!row)return;
        var id=cl(row.submission_id||row.submissionId||'');
        if(ids.indexOf(id)===-1)return;
        if(action==='WEBSITE_UPDATED'){
          row.website_update_status='WEBSITE_UPDATED';
          row.website_updated_at=row.website_updated_at||new Date().toISOString();
          row.admin_viewed_status=row.admin_viewed_status||'VIEWED';
        }
      }
      (data.approvedPayrolls||[]).forEach(touch);
      (data.submissions||[]).forEach(touch);
      (data.rows||[]).forEach(touch);
      (data.batches||[]).forEach(function(batch){
        (batch.rows||[]).forEach(touch);
        var received=(batch.rows||[]).filter(function(r){return cl(r.submission_id||r.submissionId||'');}).length;
        var done=(batch.rows||[]).filter(function(r){return up(r.website_update_status)==='WEBSITE_UPDATED';}).length;
        if(received){
          batch.received=batch.received||received;
          batch.updated=done;
          batch.pending=Math.max(0,Number(batch.totalRestaurants||received)-Number(batch.received||received));
          batch.status=done>=Number(batch.received||received)?'COMPLETED':(done>0?'PARTIAL':'PENDING');
        }
      });
      if(data.batch){
        (data.batch.rows||[]).forEach(touch);
        var rcv=(data.batch.rows||[]).filter(function(r){return cl(r.submission_id||r.submissionId||'');}).length;
        var dn=(data.batch.rows||[]).filter(function(r){return up(r.website_update_status)==='WEBSITE_UPDATED';}).length;
        if(rcv){
          data.batch.received=data.batch.received||rcv;
          data.batch.updated=dn;
          data.batch.status=dn>=Number(data.batch.received||rcv)?'COMPLETED':(dn>0?'PARTIAL':'PENDING');
        }
      }
      if(data.summary&&action==='WEBSITE_UPDATED'){
        var count=ids.length;
        data.summary.payrollWebsiteUpdated=Number(data.summary.payrollWebsiteUpdated||0)+count;
      }
    }

    function updateAllAdminCaches_(){
      markRowsDoneInMemory_(S.adminData);
      var cache=S.adminViewCache||{};
      Object.keys(cache).forEach(function(k){markRowsDoneInMemory_(cache[k]&&cache[k].data);});
      var cacheMap=S.adminListCacheMap||{};
      Object.keys(cacheMap).forEach(function(k){markRowsDoneInMemory_(cacheMap[k]&&cacheMap[k].data);});
      if(S.adminListCache)markRowsDoneInMemory_(S.adminListCache.data);
      var buttonCache=buttonCache_();
      Object.keys(buttonCache).forEach(function(k){if(k.indexOf('admin:')===0)markRowsDoneInMemory_(buttonCache[k]&&buttonCache[k].data);});
      if(S.adminData){
        setButtonCache_(adminButtonCacheKey_(),S.adminData);
        adminSetCachedView_(S.adminData);
      }
    }

    google.script.run
      .withSuccessHandler(function(res){
        S.busy=false;
        btns.forEach(function(b){
          b.disabled=false;
          b.removeAttribute('aria-busy');
          b.textContent=b.dataset.oldText||'Done';
        });
        if(!res||!res.success){toast_((res&&res.error)||'Could not update payrolls.','error');return;}

        var savedCount=(res.data&&typeof res.data.count==='number')?res.data.count:ids.length;
        if(savedCount<ids.length){
          toast_('Could not save all selected payrolls. Saved '+savedCount+' of '+ids.length+'. Refresh and try again.','error');
        }
        if(savedCount<1)return;

        toast_((action==='WEBSITE_UPDATED'?'Marked done: ':'Updated ')+savedCount+' payroll(s).','success');
        S.adminSelected={};
        updateAllAdminCaches_();

        // Stay on the same tab and same expanded batch. Do not force a full reload.
        if(S.adminBatchKey && S.adminData){
          var batch=(S.adminData.batch)||((S.adminData.batches||[]).find(function(b){return b.key===S.adminBatchKey;}));
          if(batch){
            adminRenderBatchDetail_(batch);
            setTimeout(adminPrefetchRoeTabs_,80);
            return;
          }
        }
        renderPayrollAdmin_();
        setTimeout(adminPrefetchRoeTabs_,80);
      })
      .withFailureHandler(function(e){
        S.busy=false;
        btns.forEach(function(b){
          b.disabled=false;
          b.removeAttribute('aria-busy');
          b.textContent=b.dataset.oldText||'Done';
        });
        toast_(e&&e.message?e.message:'Could not update payrolls.','error');
      })
      .updatePayrollAdminWebsiteStatus({sessionToken:token_(),submissionIds:ids,action:action,batchKey:batchKey||''});
  }

  function cssEscape_(value){
    value=String(value||'');
    if(window.CSS&&typeof window.CSS.escape==='function')return window.CSS.escape(value);
    return value.replace(/[^a-zA-Z0-9_-]/g,'\\$&');
  }

  function adminRenderApproved_(data){

  // Optimistic ROE card update — no full reload needed
  function adminUpdateRoeCardInPlace_(id, newStatus){
    S.adminOpenRoeId='';
    // Update in cached data
    var d=S.adminData||{};
    var roes=d.roeApplications||d.roes||[];
    var roe=roes.find(function(r){return cl(r.roe_id||r.roeId||'')===cl(id);});
    if(roe){
      roe.status=newStatus;
      if(newStatus==='DEACTIVATED') roe.deactivated_employee='YES';
    }
    // Re-render just the ROE card if visible
    var card=document.querySelector('[data-roe-card="'+cssEscape_(id)+'"]');
    if(card && roe){
      var pendingRoes=roes.filter(function(r){
        var s=up(r.status||'');
        return s!=='ROE_APPROVED'&&s!=='COMPLETED'&&s!=='DEACTIVATED';
      });
      var doneRoes=roes.filter(function(r){
        var s=up(r.status||'');
        return s==='ROE_APPROVED'||s==='COMPLETED'||s==='DEACTIVATED';
      });
      // Move card to correct tab section if status changed
      var isPending=['ROE_SUBMITTED','CORRECTION_NEEDED','ATTACHED_TO_PAYROLL'].indexOf(up(newStatus))!==-1;
      if(!isPending){
        // Fade out and remove from pending, re-render done section
        card.style.transition='opacity .3s,transform .3s';
        card.style.opacity='0';
        card.style.transform='translateX(10px)';
        setTimeout(function(){
          card.remove();
          // Update pending count badge if visible
          var pendingLabel=document.querySelector('[data-roe-pending-count]');
          if(pendingLabel) pendingLabel.textContent=pendingRoes.length;
        },300);
      }
    } else {
      // Fallback: soft reload (no skeleton flash)
      adminRefreshView_(false);
    }
  }

  function doSave_(mode){
    if(S.busy)return;
    var p=buildPayload_();var err=validatePayload_(p);if(err){toast_(err,'error');return;}
    S.busy=true;
    var btn=$(mode==='draft'?'p60Draft':'p60Submit');
    if(btn){btn.disabled=true;btn.textContent=mode==='draft'?'Saving…':'Submitting…';}
    var fnName=mode==='draft'?'savePayrollSubmissionDraft':'submitPayrollOnBehalf';
    google.script.run
      .withSuccessHandler(function(res){
        S.busy=false;if(btn){btn.disabled=false;btn.textContent=mode==='draft'?'Save Draft':'Submit Payroll';}
        if(!res||!res.success){toast_((res&&res.error)||'Could not save.','error');return;}
        clearPayrollButtonCache_('submission');
        clearPayrollButtonCache_('review');
        clearPayrollButtonCache_('admin');
        var data=res.data||{};var newId=data.submissionId||data.submission_id||p.submissionId||'';
        if(newId)draft_().submissionId=newId;
        clearPayrollButtonCache_('submission');
        if(mode==='submit'){
          toast_('Payroll submitted successfully.','success');
          showConfirm_(newId);
        }
        else {
          toast_('Draft saved.','success');
          refreshSubmissionDataSilently_(false);
        }
      }).withFailureHandler(function(e){S.busy=false;if(btn){btn.disabled=false;btn.textContent=mode==='draft'?'Save Draft':'Submit Payroll';}toast_(e&&e.message?e.message:'Error saving payroll.','error');})
      [fnName](p);

  function countStatus_(rows){ var o={SUBMITTED:0,RESUBMITTED:0,IN_REVIEW:0,CORRECTION_NEEDED:0,APPROVED:0,RECALLED:0};rows.forEach(function(r){var s=up(r.status||'');if(o[s]!==undefined)o[s]++;});return o; }

  var REV_PAGE_SIZE=15;

  function payrollRowDate_(r){
    var candidates=[
      r.submitted_at,
      r.submittedAt,
      r.created_at,
      r.createdAt,
      r.updated_at,
      r.updatedAt,
      r.pay_period_ending,
      r.payPeriodEnding
    ];

    for(var i=0;i<candidates.length;i++){
      var v=candidates[i];
      if(!v)continue;
      var d=new Date(v);
      if(!isNaN(d.getTime()))return d;
    }

    return null;
  }

  function reviewDateCutoff_(mode){var now=new Date();now.setHours(0,0,0,0);if(mode==='7d'){var d=new Date(now);d.setDate(d.getDate()-7);return d;}if(mode==='month'){return new Date(now.getFullYear(),now.getMonth(),1);}if(mode==='ytd'){return new Date(now.getFullYear(),0,1);}return null;}
  function renderReviewList_(){
    var list=$('p60ReviewList');if(!list)return;
    var rows=((S.reviewData&&S.reviewData.submissions)||[]).slice();
    var rn=S.filters.restaurant||'ALL',status=S.filters.status||'ALL',search=cl(S.filters.search).toLowerCase();
    var dateMode=S.filters.dateMode||'7d',cutoff=reviewDateCutoff_(dateMode);
    var dateFrom=S.filters.dateFrom?new Date(S.filters.dateFrom):null;
    var dateTo=S.filters.dateTo?new Date(S.filters.dateTo):null;
    if(dateTo)dateTo.setHours(23,59,59,999);
    rows=rows.filter(function(r){
      var okR=rn==='ALL'||String(r.restaurant_number)===rn;
      var okS=status==='ALL'||(status==='INBOX'&&['SUBMITTED','RESUBMITTED'].indexOf(up(r.status))!==-1)||up(r.status)===status;
      var txt=[r.restaurant_number,r.submitted_by,r.pay_period_ending,r.status].join(' ').toLowerCase();
      var okQ=!search||txt.indexOf(search)!==-1;
      var okD=true;
      var sub=payrollRowDate_(r);
      if(cutoff){okD=!!(sub&&sub>=cutoff);}
      else if(dateMode==='custom'){if(sub&&dateFrom)okD=sub>=dateFrom;if(sub&&dateTo)okD=okD&&sub<=dateTo;}
      return okR&&okS&&okQ&&okD;
    });

    // V21: If View moved a payroll from Inbox to In Review, keep that payroll visible and expanded right away.
    // This prevents the card from disappearing because of filters, cache, or date range while the background save is still running.
    if(S.openId){
      var opened=((S.reviewData&&S.reviewData.submissions)||[]).find(function(r){
        return String(r.submission_id||r.submissionId||'')===String(S.openId);
      });
      if(opened && !rows.some(function(r){return String(r.submission_id||r.submissionId||'')===String(S.openId);})){
        var openedStatus=up(opened.status||'');
        var tabAllowsOpen=(S.reviewTab==='IN_REVIEW'&&openedStatus==='IN_REVIEW') ||
          (S.reviewTab==='INBOX'&&['SUBMITTED','RESUBMITTED'].indexOf(openedStatus)!==-1) ||
          (S.reviewTab==='APPROVED'&&openedStatus==='APPROVED') ||
          (S.reviewTab==='CORRECTION'&&openedStatus==='CORRECTION_NEEDED') ||
          status==='ALL';
        if(tabAllowsOpen) rows.unshift(opened);
      }
    }

    var total=rows.length;
    if(!total){list.innerHTML='<div class="p60-empty">No submissions match your filters.</div>';return;}
    var totalPages=Math.max(1,Math.ceil(total/REV_PAGE_SIZE));
    S.reviewPage=Math.min(S.reviewPage||0,totalPages-1);
    var page=S.reviewPage;
    var pageRows=rows.slice(page*REV_PAGE_SIZE,(page+1)*REV_PAGE_SIZE);
    var pager=total>REV_PAGE_SIZE
      ?'<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 2px;margin-bottom:8px">'
        +'<button class="p60-btn-sm" id="p60RevPrev"'+(page===0?' disabled':'')+'>← Prev</button>'
        +'<span style="font-size:.83rem;color:#555;font-weight:700">Page '+(page+1)+' of '+totalPages+' &nbsp;·&nbsp; '+(page*REV_PAGE_SIZE+1)+'–'+Math.min((page+1)*REV_PAGE_SIZE,total)+' of '+total+'</span>'
        +'<button class="p60-btn-sm" id="p60RevNext"'+(page>=totalPages-1?' disabled':'')+'>Next →</button>'
        +'</div>'
      :'';
    var heading=S.reviewTab==='APPROVED'?'<div class="p60-card" style="margin-bottom:10px"><div class="p60-card-body"><b>Approved Payrolls</b><p class="p60-muted">Finalized payrolls are view only. Use filters to search by restaurant, week ending, or submitter.</p></div></div>':'';
    list.innerHTML=pager+heading+pageRows.map(function(r){return reviewCardHtml_(r);}).join('')+(total>REV_PAGE_SIZE?pager:'');
    bindReviewCards_();updateBulkBar_();
    document.querySelectorAll('#p60RevPrev').forEach(function(btn){btn.onclick=function(){S.reviewPage=Math.max(0,(S.reviewPage||0)-1);renderReviewList_();window.scrollTo({top:0,behavior:'smooth'});};});
    document.querySelectorAll('#p60RevNext').forEach(function(btn){btn.onclick=function(){S.reviewPage=Math.min(totalPages-1,(S.reviewPage||0)+1);renderReviewList_();window.scrollTo({top:0,behavior:'smooth'});};});
  }

  function collectInlineEditorPayload_(id,row){
    var rn=cl(($('p60IeRn_'+id)||{}).value||row.restaurant_number||'');
    var period=cl(($('p60IePeriod_'+id)||{}).value||toDateInput_(row.pay_period_ending)||'');
    var tc=cl(($('p60IeTc_'+id)||{}).value||row.time_card_updated||'Yes');
    var stat=cl(($('p60IeStat_'+id)||{}).value||row.stat_hours_1_0||'');
    var notes=cl(($('p60IeNotes_'+id)||{}).value||row.special_notes||'');
    var adminNotes=cl(($('p60IeAdminNotes_'+id)||{}).value||'');
    var sections={};
    SECTION_ORDER.forEach(function(key){sections[key]=collectRows_(key);});
    return {
      payload:{sessionToken:token_(),submissionId:id,restaurantNumber:rn,payPeriodEnding:period,timeCardUpdated:tc,statHours:stat,payrollApproval:'',specialNotes:notes,attendanceBonusRows:sections.attendanceBonusRows||[],newHireRows:sections.newHireRows||[],roeRows:sections.roeRows||[],missingTrainingRows:sections.missingTrainingRows||[],uniformDeductionRows:sections.uniformDeductionRows||[]},
      adminNotes:adminNotes
    };
  }

  function saveInlineEditor_(id,row,finalStatus){
    if(S.busy)return;
    var col=collectInlineEditorPayload_(id,row);
    var payload=col.payload;var adminNotes=col.adminNotes;
    if(!payload.restaurantNumber){toast_('Restaurant is required.','error');return;}
    if(!payload.payPeriodEnding){toast_('Week ending date is required.','error');return;}
    if(finalStatus==='CORRECTION_NEEDED'&&!adminNotes){
      toast_('Enter MRO notes before requesting a correction.','error');
      var ta=$('p60IeAdminNotes_'+id);
      if(ta){ta.style.border='2px solid #b51218';ta.focus();}
      return;
    }
    S.busy=true;
    qsa('.p60-ie-save-draft,.p60-ie-approve,.p60-ie-correction').forEach(function(b){b.disabled=true;b.setAttribute('aria-busy','true');});
    google.script.run
      .withSuccessHandler(function(res){
        if(!res||!res.success){
          S.busy=false;
          qsa('.p60-ie-save-draft,.p60-ie-approve,.p60-ie-correction').forEach(function(b){b.disabled=false;b.removeAttribute('aria-busy');});
          toast_((res&&res.error)||'Could not save.','error');return;
        }
        var savedId=(res.data&&(res.data.submissionId||res.data.submission_id))||id;
        if(!finalStatus||finalStatus==='DRAFT'){
          S.busy=false;toast_('✓ Changes saved.','success');S.editId='';openReview_();return;
        }
        google.script.run
          .withSuccessHandler(function(res2){
            S.busy=false;
            qsa('.p60-ie-save-draft,.p60-ie-approve,.p60-ie-correction').forEach(function(b){b.disabled=false;b.removeAttribute('aria-busy');});
            if(!res2||!res2.success){toast_((res2&&res2.error)||'Saved but status update failed.','error');openReview_();return;}
            clearPayrollButtonCache_('review');
            clearPayrollButtonCache_('admin');
            clearPayrollButtonCache_('submission');
            toast_(finalStatus==='APPROVED'?'✓ Approved':'⚠ Correction request sent','success');
            S.editId='';openReview_();
          })
          .withFailureHandler(function(e){S.busy=false;toast_(e&&e.message?e.message:'Status update failed.','error');openReview_();})
          .updatePayrollSubmissionStatus({sessionToken:token_(),submissionId:savedId,status:finalStatus,adminNotes:adminNotes,correctionNotes:adminNotes});
      })
      .withFailureHandler(function(e){
        S.busy=false;
        qsa('.p60-ie-save-draft,.p60-ie-approve,.p60-ie-correction').forEach(function(b){b.disabled=false;b.removeAttribute('aria-busy');});
        toast_(e&&e.message?e.message:'Could not save.','error');
      })
      .submitPayrollOnBehalf(payload);
  }


  function appendLocalPayrollTimelineV28_(timelineJson, action, note){
    var history=[];
    try{
      history=JSON.parse(timelineJson||'[]');
      if(!Array.isArray(history))history=[];
    }catch(e){history=[];}
    history.push({
      at:new Date().toISOString(),
      by:'MRO',
      action:action||'VIEWED_BY_MRO',
      note:note||''
    });
    return JSON.stringify(history);
  }

    });
    var fs=$('p60FStatus');

  function openInboxPayrollInstantV28_(id,row){
    if(!row)return false;

    var now=new Date().toISOString();

    // Open first. Do not wait for Apps Script.
    S.reviewTab='IN_REVIEW';
    S.filters=S.filters||{};
    S.filters.status='IN_REVIEW';
    S.openId=id;
    S.editId='';
    S.reviewPage=0;
    S.selectedIds={};

    row.status='IN_REVIEW';
    row.locked_by_mro='YES';
    row.review_viewed_at=row.review_viewed_at||now;
    row.reviewed_at=row.reviewed_at||now;
    row.updated_at=now;
    row.admin_viewed_status='VIEWED';
    row.timeline_json=appendLocalPayrollTimelineV28_(row.timeline_json,'VIEWED_BY_MRO','Moved to In Review');

    if(S.reviewData&&S.reviewData.submissions){
      var found=false;
      S.reviewData.submissions=S.reviewData.submissions.map(function(r){
        if(String(r.submission_id||r.submissionId||'')===String(id)){
          found=true;
          return row;
        }
        return r;
      });
      if(!found)S.reviewData.submissions.unshift(row);
    }

    // Full local render only. This is instant because it uses existing reviewData.
    renderReview_();

    setTimeout(function(){
      var card=document.getElementById('p60RC_'+id);
      if(card)card.scrollIntoView({behavior:'smooth',block:'start'});
    },0);

    // Save in background after UI is already open.
    try{
      google.script.run
        .withSuccessHandler(function(res){
          if(!res||!res.success){
            toast_((res&&res.error)||'Opened, but could not save In Review status. Refresh and try again.','error');
            return;
          }
          clearPayrollButtonCache_('review');
          clearPayrollButtonCache_('admin');
          clearPayrollButtonCache_('submission');
        })
        .withFailureHandler(function(e){
          toast_(e&&e.message?e.message:'Opened, but could not save In Review status. Refresh and try again.','error');
        })
        .updatePayrollSubmissionStatus({sessionToken:token_(),submissionId:id,status:'IN_REVIEW',adminNotes:'',correctionNotes:''});
    }catch(e){}

    return true;
  }

  function updateReviewRowLocalV29_(id, patch){
    if(!S.reviewData)S.reviewData={submissions:[]};
    S.reviewData.submissions=S.reviewData.submissions||[];
    var found=null;
    S.reviewData.submissions.forEach(function(r){
      if(String(r.submission_id||r.submissionId||'')===String(id))found=r;
    });
    if(!found)return null;
    Object.keys(patch||{}).forEach(function(k){found[k]=patch[k];});
    return found;
  }

  function ensureRowInReviewLocalV29_(id,row){
    var now=new Date().toISOString();
    row=row||findRow_(id,true);

    row.status='IN_REVIEW';
    row.locked_by_mro='YES';

  function editReviewPayrollInstantV29_(id){
    var row=findRow_(id,true);
    if(!row)return;
    if(['SUBMITTED','RESUBMITTED'].indexOf(up(row.status))!==-1){
      ensureRowInReviewLocalV29_(id,row);
      saveInReviewBackgroundV29_(id);
    }
    S.reviewTab='IN_REVIEW';
    S.filters.status='IN_REVIEW';
    S.openId='';
    S.editId=id;
    S.reviewPage=0;
    renderReview_();
    setTimeout(function(){var card=$('p60RC_'+id);if(card)card.scrollIntoView({behavior:'smooth',block:'start'});},0);
  }

  function approveReviewPayrollInstantV29_(id){
    if(!id||S.busy)return;
    var row=findRow_(id,true);
    if(!row)return;

    S.busy=true;
    var now=new Date().toISOString();
    var oldStatus=row.status||'';
    row.status='APPROVED';
    row.approved_at=now;
    row.updated_at=now;
    row.timeline_json=appendLocalPayrollTimelineV28_(row.timeline_json,'APPROVED_BY_MRO','Approved');
    updateReviewRowLocalV29_(id,row);
    toast_('Approving…','info');
    renderReviewList_();

    function approveOnServer_(){
      google.script.run
        .withSuccessHandler(function(res){
          S.busy=false;
          if(!res||!res.success){
            updateReviewRowLocalV29_(id,{status:oldStatus||'IN_REVIEW'});
            toast_((res&&res.error)||'Could not approve.','error');
            renderReviewList_();
            return;
          }
          clearPayrollButtonCache_('review');
          clearPayrollButtonCache_('admin');
          clearPayrollButtonCache_('submission');
          delete S.selectedIds[id];
          toast_('Approved successfully.','success');
          renderReviewList_();
          updateBulkBar_();
        })
        .withFailureHandler(function(e){
          S.busy=false;
          updateReviewRowLocalV29_(id,{status:oldStatus||'IN_REVIEW'});
          toast_(e&&e.message?e.message:'Could not approve.','error');
          renderReviewList_();
        })
        .updatePayrollSubmissionStatus({sessionToken:token_(),submissionId:id,status:'APPROVED',adminNotes:'',correctionNotes:''});
    }

    if(['SUBMITTED','RESUBMITTED'].indexOf(up(oldStatus))!==-1){
      saveInReviewBackgroundV29_(id,function(){ approveOnServer_(); });
    } else {
      approveOnServer_();
    }
  }

  function bindReviewCards_(){
    // View toggle. Inbox View opens the payroll instantly in In Review before server save finishes.
    qsa('[data-view-id]').forEach(function(b){b.onclick=function(event){
      if(event)event.preventDefault();
      var id=b.getAttribute('data-view-id');
      var wasOpen=String(S.openId)===String(id);
      var row=findRow_(id,true);

      if(wasOpen){
        S.openId='';
        renderReviewList_();
        return;
      }

      if(row&&['SUBMITTED','RESUBMITTED'].indexOf(up(row.status))!==-1){
        openInboxPayrollInstantV28_(id,row);
        return;
      }

      S.openId=id;
      S.editId='';
      renderReviewList_();
    };});

    // Edit must work right away after Inbox View opens. Do not wait for refresh.
    qsa('[data-edit-review]').forEach(function(b){b.onclick=function(event){
      if(event)event.preventDefault();
      editReviewPayrollInstantV29_(b.getAttribute('data-edit-review'));
    };});

    // Quick approve must also work while the background In Review save is still running.
    qsa('[data-quick-approve]').forEach(function(b){b.onclick=function(event){
      if(event)event.preventDefault();
      approveReviewPayrollInstantV29_(b.getAttribute('data-quick-approve'));
    };});

    // Quick correction button opens edit mode and focuses MRO notes.
    qsa('[data-quick-correction]').forEach(function(b){b.onclick=function(event){
      if(event)event.preventDefault();
      var id=b.getAttribute('data-quick-correction');
      editReviewPayrollInstantV29_(id);
      setTimeout(function(){var ta=$('p60IeAdminNotes_'+id);if(ta){ta.focus();ta.scrollIntoView({behavior:'smooth',block:'center'});}},120);
    };});

    // Cancel inline edit
    qsa('[data-cancel-edit]').forEach(function(b){b.onclick=function(){S.editId='';renderReviewList_();};});

    // Inline editor save buttons
    qsa('.p60-ie-save-draft').forEach(function(b){b.onclick=function(){
      var id=b.getAttribute('data-ie-id');var row=findRow_(id,true);if(row)saveInlineEditor_(id,row,'DRAFT');
    };});
    qsa('.p60-ie-approve').forEach(function(b){b.onclick=function(){
      var id=b.getAttribute('data-ie-id');var row=findRow_(id,true);
      appConfirmV413('Save all changes and approve?', function(){ if(row)saveInlineEditor_(id,row,'APPROVED'); }, null, { title:'Approve Payroll', okText:'Approve' });
      return;
    };});
    qsa('.p60-ie-correction').forEach(function(b){b.onclick=function(){
      var id=b.getAttribute('data-ie-id');var row=findRow_(id,true);if(row)saveInlineEditor_(id,row,'CORRECTION_NEEDED');
    };});

    // Correction via read-only notes textarea
    qsa('[data-correction-id]').forEach(function(b){b.onclick=function(){
      var id=b.getAttribute('data-correction-id');
      var notesEl=$('adminNotes_'+id);var note=notesEl?cl(notesEl.value):'';
      if(!note){toast_('Enter MRO notes before requesting a correction.','error');return;}
      doStatusUpdate_(id,'CORRECTION_NEEDED',note);
    };});

    // Bulk select checkboxes
    qsa('.p60-bulk-cb').forEach(function(cb){cb.onchange=function(){
      var id=cb.getAttribute('data-cb-id');
      if(cb.checked)S.selectedIds[id]=true; else delete S.selectedIds[id];
      updateBulkBar_();
    };cb.checked=!!S.selectedIds[cb.getAttribute('data-cb-id')];});

    // Add/remove row in open inline editor
    qsa('[data-add-row]').forEach(function(b){b.onclick=function(){
      var key=b.getAttribute('data-add-row');
      var tbl=$('payrollTable_'+key);if(!tbl)return;
      var editId=S.editId;var row=findRow_(editId,true);if(!row)return;
      var d=rowFromSubmission_(row);var rn=d.restaurantNumber||'';
      var tbody=tbl.querySelector('tbody');
      if(tbody){var tr=document.createElement('tr');tr.innerHTML=rowHtml_(key,{},rn).replace(/^<tr>/,'').replace(/<\/tr>$/,'');tbody.appendChild(tr);bindRowButtons_(tbody);bindRoeApplicationSelects_(tbody);}
    };});
    qsa('[data-remove-row]').forEach(function(b){b.onclick=function(){b.closest('tr').remove();};});
  }

  function updateBulkBar_(){
    var bar=$('p60BulkBar');if(!bar)return;
    var count=Object.keys(S.selectedIds).length;
    bar.style.display=count>0?'flex':'none';
    var cnt=$('p60BulkCount');
    if(cnt)cnt.textContent=count+' selected';
    var btn=$('p60BulkApprove');
    if(btn){
      btn.textContent='✓ Approve '+count;
      btn.onclick=function(){doBulkApprove_(Object.keys(S.selectedIds));};
    }
    var selAll=$('p60BulkSelectAll');
    if(selAll)selAll.onclick=function(){
      var rows=((S.reviewData&&S.reviewData.submissions)||[]);
      var rn=S.filters.restaurant||'ALL',status=S.filters.status||'ALL';
      rows.filter(function(r){
        var okR=rn==='ALL'||String(r.restaurant_number)===rn;
        var s=up(r.status||'');
        var okS=s!=='APPROVED'&&s!=='RECALLED';
        return okR&&okS;
      }).forEach(function(r){S.selectedIds[r.submission_id||'']=true;});
      renderReviewList_();
    };
    var corrBtn=$('p60BulkCorrection');
    if(corrBtn)corrBtn.onclick=function(){
      var ids=Object.keys(S.selectedIds);
      if(!ids.length)return;
      appPromptV413('Enter correction note for all selected payrolls:', '', function(note){
        note=cl(note||'');
        if(!note){toast_('Enter a correction note.','error');return;}
        S.busy=true;

  var COL_LABELS = {
    employeeName:         'Employee',
    terminationDate:      'Last Day of Work',
    roeApplicationId:     'ROE Application ID',
    roeId:                'ROE ID',
    reasonForSeparation:  'Reason for Separation',

  // Keys to hide in read view (internal/duplicate fields)
  var COL_HIDE = ['roeId','firstName','lastName','employeeId','roeId'];

  function colLabel_(k){
    if(COL_LABELS[k]) return COL_LABELS[k];
    return k.replace(/([A-Z])/g,' $1').replace(/_/g,' ').trim()
      .replace(/\w/g,function(c){return c.toUpperCase();});
  }

  function cleanReadValueV21_(value){
    var s=cl(value);
    if(!s)return '';
    var normalized=s.toLowerCase().replace(/\s+/g,' ').trim();
    if(normalized==='select employee')return '';
    if(normalized.indexOf('select employee')!==-1)return '';
    if(normalized==='select')return '';
    if(normalized==='employee name')return '';
    if(normalized==='employee')return '';
    if(normalized==='—'||normalized==='-'||normalized==='n/a')return '';
    return s;
  }

  function readRowHasDataV21_(row,key){
    row=row||{};
    if(key==='attendanceBonusRows'){
      return !!(cleanReadValueV21_(row.employeeName)||cleanReadValueV21_(row.employeeId)||cleanReadValueV21_(row.attendancePercentage));
    }
    if(key==='newHireRows'){
      return !!(cleanReadValueV21_(row.employeeName)||cleanReadValueV21_(row.employeeId)||cleanReadValueV21_(row.startDate));
    }
    if(key==='roeRows'){
      return !!(cleanReadValueV21_(row.employeeName)||cleanReadValueV21_(row.roeApplicationId)||cleanReadValueV21_(row.terminationDate)||cleanReadValueV21_(row.reasonForSeparation));
    }
    if(key==='missingTrainingRows'){
      return !!(cleanReadValueV21_(row.employeeName)||cleanReadValueV21_(row.employeeId)||cleanReadValueV21_(row.missingHours)||cleanReadValueV21_(row.trainingHours)||cleanReadValueV21_(row.reason));
    }
    if(key==='uniformDeductionRows'){
      return !!(cleanReadValueV21_(row.employeeName)||cleanReadValueV21_(row.employeeId)||cleanReadValueV21_(row.item)||cleanReadValueV21_(row.amount)||cleanReadValueV21_(row.reason));
    }
    return Object.keys(row).some(function(k){return cleanReadValueV21_(row[k]);});
  }

  function readSectionHtml_(title,rows,key){
    rows=(rows||[]).filter(function(r){return readRowHasDataV21_(r,key);});

    // Do not treat default dropdown values as real entries.
    // Example: New Hire row with only Type = New Hire must still show No entries.
    if(key==='newHireRows'){
      rows=rows.filter(function(r){
        return !!(cleanReadValueV21_(r.employeeName)||cleanReadValueV21_(r.employeeId)||cleanReadValueV21_(r.startDate));
      });
    }

    // Build key list only from rows with real values.
    var keys=[];
    rows.forEach(function(r){
      Object.keys(r||{}).forEach(function(k){
        if(COL_HIDE.indexOf(k)!==-1)return;
        if(keys.indexOf(k)!==-1)return;
        var hasValue=rows.some(function(row){return !!cleanReadValueV21_(row[k]);});
        if(hasValue)keys.push(k);
      });
    });

    // If no real rows or no real columns, show No entries only.
    if(!rows.length || !keys.length){
      return '<div class="p60-section-label">'+esc(title.toUpperCase())+'</div><div class="p60-empty">No entries.</div>';
    }

    // Extra guard: if the only visible column is employeeName but it has no real employee value, show No entries.
    if(keys.length===1 && keys[0]==='employeeName'){
      var hasEmployee=rows.some(function(r){return !!cleanReadValueV21_(r.employeeName);});
      if(!hasEmployee){
        return '<div class="p60-section-label">'+esc(title.toUpperCase())+'</div><div class="p60-empty">No entries.</div>';
      }
    }

    var emp=keys.indexOf('employeeName');
    if(emp!==-1){keys.splice(emp,1);keys.unshift('employeeName');}

    var roeIdIdx=keys.indexOf('roeId');
    var roeAppIdx=keys.indexOf('roeApplicationId');
    if(roeIdIdx!==-1 && roeAppIdx!==-1) keys.splice(roeIdIdx,1);

    var html='<div class="p60-section-label">'+esc(title.toUpperCase())+'</div><div class="p60-table-wrap"><table class="p60-read-table"><thead><tr>';
    keys.forEach(function(k){html+='<th>'+esc(colLabel_(k))+'</th>';});
    html+='</tr></thead><tbody>';
    rows.forEach(function(r){
      html+='<tr>';
      keys.forEach(function(k){
        var val=cleanReadValueV21_(r[k]);
        if(k==='terminationDate'||k==='startDate') val=fmtDateOnly_(val)||val;
        html+='<td>'+esc(val||'—')+'</td>';
      });
      html+='</tr>';
    });
    return html+'</tbody></table></div>';
  }
