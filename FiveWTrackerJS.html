<script>
(function fiveWTrackerModule_() {

  var PASS_OV  = 18;
  var PASS_SIG = 10;
  var W_LABELS = ['Welcome','What','Work','Wow','Wave'];
  var W_KEYS   = ['w1','w2','w3','w4','w5'];
  var W_COLORS = ['#103d6e','#144a38','#3d1a5e','#6b2010','#0d3d50'];

  // ── State ─────────────────────────────────────────────────────────────────
  var fw = {
    allRows:      [],
    restaurants:  [],
    isAdmin:      false,
    filter:       'ALL',   // restaurant filter (admin)
    dateMode:     'ALL',   // ALL / 30 / 90
    evalPage:     0,
    PAGE_SIZE:    10
  };

  // ── Helpers ───────────────────────────────────────────────────────────────
  function esc(s)  { return escapeHtml ? escapeHtml(String(s||'')) : String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function tok()   { return typeof getSessionToken_==='function' ? getSessionToken_() : ''; }
  function getSec(){ return document.getElementById('adminSections')||window.adminSections||null; }

  function filteredRows() {
    var rows = fw.allRows;
    // Restaurant filter (admin only)
    if (fw.filter && fw.filter !== 'ALL') {
      rows = rows.filter(function(r){ return r.rn === fw.filter; });
    }
    // Date filter
    if (fw.dateMode !== 'ALL') {
      var days = parseInt(fw.dateMode, 10);
      var cutoff = Date.now() - days * 86400000;
      rows = rows.filter(function(r){ return r.ts >= cutoff; });
    }
    return rows;
  }

  function pct(n, d) { return d ? Math.round(n/d*100) : 0; }
  function avg(rows, key) {
    return rows.length ? (rows.reduce(function(s,r){return s+r[key];},0)/rows.length).toFixed(1) : '0.0';
  }

  var _sessionRefreshed = false;

  // ── Page opener ───────────────────────────────────────────────────────────
  function open5WTracker_() {
    // On first open, bust boot cache and refresh role actions so 5W Tracker appears
    if (!_sessionRefreshed) {
      _sessionRefreshed = true;
      google.script.run
        .withSuccessHandler(function(res) {
          try {
            if (res && res.success && res.data && res.data.dashboard && window.state) {
              var d = res.data.dashboard;
              if (d.roleActions) {
                state.roleActions = d.roleActions.filter(function(a) {
                  return String(a && a.key || '').toUpperCase() !== 'DROPDOWN_SETTINGS';
                });
                if (typeof renderRoleActions === 'function') renderRoleActions();
              }
            }
          } catch(e) {}
        })
        .withFailureHandler(function(){})
        .refreshMySession(tok());
    }
    hideAllPages_();
    // Inject CSS once
    ensure5WStyle_();
    // Show workspace shell
    var cl  = document.querySelector('.center-column');
    var nl  = document.querySelector('.newsletter');
    var ws  = document.getElementById('adminWorkspace')  || window.adminWorkspace;
    var sg  = document.getElementById('adminSummaryGrid')|| window.adminSummaryGrid;
    var tb  = document.getElementById('adminSectionTabs')|| window.adminSectionTabs;
    var sec = getSec();
    if (!cl||!ws||!sec) return;
    if (nl)  nl.style.display  = 'none';
    cl.innerHTML = ''; cl.appendChild(ws); cl.style.display = 'block';
    ws.hidden = false; ws.style.display = 'grid';
    if (document.getElementById('adminWorkspaceEyebrow')) document.getElementById('adminWorkspaceEyebrow').style.display='none';
    if (document.getElementById('adminWorkspaceTitle'))   document.getElementById('adminWorkspaceTitle').style.display='none';
    if (document.getElementById('adminWorkspaceNote'))    document.getElementById('adminWorkspaceNote').style.display='none';
    if (sg) sg.innerHTML = '';
    if (tb) tb.innerHTML = '';
    if (typeof renderRoleActions==='function') renderRoleActions();

    // Show loading screen
    sec.innerHTML = buildLoadingHtml_();
    startFakeProgress_(sec, function() {
      // Fetch data
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res||!res.success) {
            sec.innerHTML = buildErrorHtml_(res&&res.error||'Could not load evaluation data.');
            return;
          }
          fw.allRows     = res.data.rows     || [];
          fw.restaurants = res.data.restaurants || [];
          fw.isAdmin     = !!res.data.isAdmin;
          PASS_OV        = res.data.passOverall || 18;
          PASS_SIG       = res.data.passSig     || 10;
          fw.filter      = 'ALL';
          fw.dateMode    = 'ALL';
          fw.evalPage    = 0;
          renderDashboard_(sec);
        })
        .withFailureHandler(function(e) {
          sec.innerHTML = buildErrorHtml_(e.message||'Failed to load data.');
        })
        .get5WTrackerData({ sessionToken: tok() });
    });
  }

  // ── Loading screen ────────────────────────────────────────────────────────
  function buildLoadingHtml_() {
    return '<div id="fw5WLoader" style="background:#0b1d3a;min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;">' +
      '<div style="text-align:center;margin-bottom:48px;">' +
        '<div style="font-size:48px;margin-bottom:16px;">📊</div>' +
        '<div style="color:#ffffff;font-size:26px;font-weight:700;font-family:Georgia,serif;letter-spacing:1px;margin-bottom:6px;">5W TRACKER</div>' +
        '<div style="color:#5b8dc9;font-size:13px;letter-spacing:2px;text-transform:uppercase;">Sethpitality Guest Experience Program</div>' +
      '</div>' +
      '<div style="width:360px;max-width:90vw;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<span style="color:#93c5fd;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;">Loading Evaluations</span>' +
          '<span id="fw5WPct" style="color:#ffffff;font-size:14px;font-weight:700;">0%</span>' +
        '</div>' +
        '<div style="background:#162d56;border-radius:6px;height:8px;overflow:hidden;">' +
          '<div id="fw5WBar" style="height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:6px;transition:width 0.1s ease;"></div>' +
        '</div>' +
        '<div id="fw5WStatus" style="color:#5b8dc9;font-size:11px;margin-top:10px;text-align:center;">Connecting to evaluation database...</div>' +
      '</div>' +
    '</div>';
  }

  var _loadingMessages = [
    'Connecting to evaluation database...',
    'Reading evaluation records...',
    'Calculating section scores...',
    'Building performance metrics...',
    'Preparing your dashboard...'
  ];

  function startFakeProgress_(sec, onComplete) {
    var pct = 0;
    var dataReady = false;
    var animDone  = false;

    // Start data fetch immediately in parallel
    onComplete._trigger = function() {
      dataReady = true;
      if (animDone) onComplete();
    };
    // Swap onComplete to signal data ready
    var originalComplete = onComplete;
    onComplete = function() { dataReady = true; if (animDone) originalComplete(); };

    // Animate bar
    var interval = setInterval(function() {
      var bar  = document.getElementById('fw5WBar');
      var pctEl = document.getElementById('fw5WPct');
      var statusEl = document.getElementById('fw5WStatus');
      if (!bar) { clearInterval(interval); return; }

      // Speed up near end if data is ready, slow down if not
      var step = dataReady ? 4 : (pct < 70 ? 2 : 0.5);
      pct = Math.min(pct + step, dataReady ? 100 : 92);

      bar.style.width = pct + '%';
      if (pctEl) pctEl.textContent = Math.round(pct) + '%';
      if (statusEl) {
        var msgIdx = Math.min(Math.floor(pct / 22), _loadingMessages.length - 1);
        statusEl.textContent = _loadingMessages[msgIdx];
      }

      if (pct >= 100) {
        clearInterval(interval);
        animDone = true;
        if (dataReady) originalComplete();
      }
    }, 60);

    // Trigger the actual data fetch
    originalComplete();
  }

  function buildErrorHtml_(msg) {
    return '<div class="fw-page"><div class="fw-titlebar"><div class="fw-title">5W Tracker</div>' +
      '<button class="fw-back-btn" onclick="window.goBackToDashboardHome&&window.goBackToDashboardHome()" type="button">← Back to Dashboard</button></div>' +
      '<div class="fw-body"><div style="padding:16px;"><span style="color:#b51218;">⚠ '+esc(msg)+'</span> ' +
      '<button class="fw-btn" onclick="window.open5WTracker_()" style="margin-left:12px;background:#0076b6;color:#fff;">Retry</button></div></div></div>';
  }

  // ── Main dashboard renderer ───────────────────────────────────────────────
  function renderDashboard_(sec) {
    var rows = filteredRows();

    sec.innerHTML =
      '<div class="fw-page">' +
        buildTitlebar_() +
        buildFilters_(rows) +
        '<div id="fw5WBody" class="fw-body">' +
          buildKPICards_(rows) +
          buildSectionTable_(rows) +
          buildTrendChart_(rows) +
          buildRecentEvals_(rows) +
          (fw.isAdmin && fw.filter === 'ALL' ? buildRestaurantBreakdown_(rows) : '') +
        '</div>' +
      '</div>';

    bindDashboardEvents_(sec);
  }

  function buildTitlebar_() {
    return '<div class="fw-titlebar">' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
        '<span style="font-size:20px;">📊</span>' +
        '<div><div class="fw-title">5W Tracker</div>' +
        '<div class="fw-title-sub">Guest Experience Evaluations</div></div>' +
      '</div>' +
      '<button class="fw-back-btn" onclick="window.goBackToDashboardHome&&window.goBackToDashboardHome()" type="button">← Back to Dashboard</button>' +
    '</div>';
  }

  function buildFilters_(rows) {
    // Date filter tabs
    var dateTabs = [['ALL','All Time'],['30','Last 30 Days'],['90','Last 3 Months']].map(function(f){
      return '<button class="fw-tab'+(fw.dateMode===f[0]?' active':'')+'" data-fw-date="'+f[0]+'" type="button">'+f[1]+'</button>';
    }).join('');

    // Restaurant dropdown (admin only)
    var restSelect = '';
    if (fw.isAdmin) {
      var opts = '<option value="ALL">All Restaurants</option>' +
        fw.restaurants.map(function(r){ return '<option value="'+esc(r)+'"'+(fw.filter===r?' selected':'')+'>Restaurant #'+esc(r)+'</option>'; }).join('');
      restSelect = '<span class="fw-filter-label">Restaurant</span>' +
        '<select id="fwRestFilter" class="fw-filter-select">'+opts+'</select>';
    }

    return '<div>' +
      '<div class="fw-tabs">'+dateTabs+'</div>' +
      (fw.isAdmin ? '<div class="fw-filter-bar">'+restSelect+
        '<span class="fw-filter-count">'+rows.length+' evaluation'+(rows.length!==1?'s':'')+' shown</span></div>' : '') +
    '</div>';
  }

  // ── KPI Cards ─────────────────────────────────────────────────────────────
  function buildKPICards_(rows) {
    var total   = rows.length;
    var passed  = rows.filter(function(r){return r.ok;}).length;
    var perfSig = rows.filter(function(r){return r.pf;}).length;
    var avgOv   = avg(rows, 'ov');
    var avgSig  = avg(rows, 'sg');
    var passRate= pct(passed, total);

    var cards = [
      { label:'Evaluations',       value: total,           sub: fw.filter==='ALL'?'All Restaurants':'Restaurant #'+fw.filter, bg:'#0b1d3a', sc:'#7aadd6' },
      { label:'Pass Rate',         value: passRate+'%',    sub: passed+' of '+total+' passed',   bg: passed/Math.max(total,1)>=0.7?'#14532d':'#7f1d1d', sc:'#86efac' },
      { label:'Avg Overall',       value: avgOv+'/25',     sub: 'Target ≥ 18',                   bg:'#1e3a5f', sc:'#93c5fd' },
      { label:'Avg Signature',     value: avgSig+'/10',    sub: 'Target = 10',                   bg:'#1e3a5f', sc:'#93c5fd' },
      { label:'Perfect Signature', value: pct(perfSig,total)+'%', sub: perfSig+' × 10/10',       bg:'#4a1d6b', sc:'#c4b5fd' }
    ];

    var html = '<div style="margin-bottom:14px;">' +
      '<div style="font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">KEY METRICS</div>' +
      '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;">';

    cards.forEach(function(c) {
      html += '<div style="background:'+c.bg+';border-radius:6px;padding:14px 10px;text-align:center;">' +
        '<div style="color:#94a3b8;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;">'+esc(c.label)+'</div>' +
        '<div style="color:#ffffff;font-size:22px;font-weight:700;font-family:Georgia,serif;margin-bottom:4px;">'+esc(String(c.value))+'</div>' +
        '<div style="color:'+c.sc+';font-size:11px;font-weight:600;">'+esc(c.sub)+'</div>' +
      '</div>';
    });

    return html + '</div></div>';
  }

  // ── Section Table ─────────────────────────────────────────────────────────
  function buildSectionTable_(rows) {
    var total = rows.length;
    var html = '<div style="margin-bottom:14px;">' +
      '<div style="font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">SECTION PERFORMANCE (avg / 5 pts each)</div>' +
      '<div class="fw-table-wrap"><table class="fw-table"><thead><tr>' +
      '<th style="width:18%;">Section</th>' +
      '<th style="width:14%;text-align:center;">Avg Score</th>' +
      '<th style="width:12%;text-align:center;">Pass Rate</th>' +
      '<th style="width:12%;text-align:center;">Top Score</th>' +
      '<th style="width:12%;text-align:center;">Low Score</th>' +
      '<th style="width:12%;text-align:center;">Evals</th>' +
      '<th style="width:20%;text-align:center;">Status</th>' +
      '</tr></thead><tbody>';

    W_KEYS.forEach(function(key, i) {
      var scores = rows.map(function(r){return r[key];});
      var a      = total ? (scores.reduce(function(s,v){return s+v;},0)/total) : 0;
      var passR  = total ? pct(scores.filter(function(s){return s>=3;}).length, total) : 0;
      var top    = total ? Math.max.apply(null,scores) : 0;
      var low    = total ? Math.min.apply(null,scores) : 0;
      var stTxt  = a>=4?'✅ Excellent':a>=3?'🟡 Good':'🔴 Needs Work';
      var stBg   = a>=4?'#dcfce7':a>=3?'#fef9c3':'#fee2e2';
      var stFg   = a>=4?'#14532d':a>=3?'#713f12':'#7f1d1d';
      var bg     = i%2===0?'#f0f5fc':'#ffffff';
      html += '<tr>' +
        '<td style="background:'+W_COLORS[i]+';color:#fff;font-weight:700;text-align:left;padding-left:10px;">'+W_LABELS[i]+'</td>' +
        '<td style="background:'+bg+';text-align:center;">'+a.toFixed(1)+'/5</td>' +
        '<td style="background:'+bg+';text-align:center;">'+passR+'%</td>' +
        '<td style="background:'+bg+';text-align:center;">'+top+'/5</td>' +
        '<td style="background:'+bg+';text-align:center;">'+low+'/5</td>' +
        '<td style="background:'+bg+';text-align:center;">'+total+'</td>' +
        '<td style="background:'+stBg+';color:'+stFg+';font-weight:700;text-align:center;">'+stTxt+'</td>' +
      '</tr>';
    });

    var avgAll = avg(rows, 'ov');
    html += '<tr>' +
      '<td style="background:#0b1d3a;color:#fff;font-weight:700;">OVERALL</td>' +
      '<td colspan="5" style="background:#162d56;color:#93c5fd;font-weight:700;font-size:15px;">'+avgAll+'/25</td>' +
      '<td style="background:#162d56;color:#7aadd6;"></td>' +
    '</tr>';

    return html + '</tbody></table></div></div>';
  }

  // ── Trend Chart ───────────────────────────────────────────────────────────
  function buildTrendChart_(rows) {
    if (rows.length < 2) return '';
    // Last 20 evaluations chronologically for trend
    var trend = rows.slice().sort(function(a,b){return a.ts-b.ts;}).slice(-20);
    var max = 25, h = 120, w = 560, pad = 40;
    var cw = (w - pad*2) / Math.max(trend.length - 1, 1);

    function yPos(v) { return h - pad/2 - (v/max)*(h-pad); }

    // Build SVG polyline points
    var ovPoints = trend.map(function(r,i){ return (pad+i*cw)+','+(yPos(r.ov)+5); }).join(' ');
    var sigPoints = trend.map(function(r,i){ return (pad+i*cw)+','+(yPos(r.sg/10*25)+5); }).join(' ');

    // Pass line at 18
    var passY = yPos(18) + 5;

    var dots = trend.map(function(r,i){
      var x = pad+i*cw, y = yPos(r.ov)+5;
      var col = r.ok ? '#22c55e' : '#ef4444';
      return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+col+'" stroke="#0b1d3a" stroke-width="1.5">' +
        '<title>'+r.dt+' — '+r.mb+'\nOverall: '+r.ov+'/25 | Sig: '+r.sg+'/10</title></circle>';
    }).join('');

    // Y-axis labels
    var yLabels = [0,5,10,15,18,20,25].map(function(v){
      var y = yPos(v)+5;
      var col = v===18?'#fbbf24':'#94a3b8';
      return '<text x="'+(pad-6)+'" y="'+y+'" text-anchor="end" fill="'+col+'" font-size="9" dominant-baseline="middle">'+v+'</text>';
    }).join('');

    return '<div style="margin-bottom:14px;">' +
      '<div style="font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">SCORE TREND (last '+trend.length+' evaluations)</div>' +
      '<div style="background:#0b1d3a;border-radius:8px;padding:16px 20px;">' +
        '<svg viewBox="0 0 '+w+' '+(h+10)+'" style="width:100%;max-width:'+w+'px;display:block;">' +
          // Grid lines
          [5,10,15,20,25].map(function(v){
            var y=yPos(v)+5;
            return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="#1e3a6b" stroke-width="1" stroke-dasharray="3,3"/>';
          }).join('') +
          // Pass threshold line
          '<line x1="'+pad+'" y1="'+passY+'" x2="'+(w-10)+'" y2="'+passY+'" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3"/>' +
          '<text x="'+(w-8)+'" y="'+passY+'" fill="#fbbf24" font-size="8" text-anchor="end" dominant-baseline="middle">Pass 18</text>' +
          // Trend lines
          '<polyline points="'+ovPoints+'" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>' +
          // Dots
          dots +
          // Y axis labels
          yLabels +
          // X axis labels (first, mid, last)
          '<text x="'+pad+'" y="'+(h+8)+'" fill="#64748b" font-size="9" text-anchor="middle">'+trend[0].dt+'</text>' +
          (trend.length>2?'<text x="'+(pad+(trend.length-1)/2*cw)+'" y="'+(h+8)+'" fill="#64748b" font-size="9" text-anchor="middle">'+trend[Math.floor(trend.length/2)].dt+'</text>':'') +
          '<text x="'+(pad+(trend.length-1)*cw)+'" y="'+(h+8)+'" fill="#64748b" font-size="9" text-anchor="middle">'+trend[trend.length-1].dt+'</text>' +
        '</svg>' +
        '<div style="display:flex;gap:20px;margin-top:8px;">' +
          '<span style="color:#3b82f6;font-size:11px;">● Overall Score (out of 25)</span>' +
          '<span style="color:#fbbf24;font-size:11px;">— Pass Threshold (18)</span>' +
          '<span style="color:#22c55e;font-size:11px;">● Pass &nbsp;</span>' +
          '<span style="color:#ef4444;font-size:11px;">● Below Pass</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ── Recent Evaluations (paginated) ────────────────────────────────────────
  function buildRecentEvals_(rows) {
    var sorted = rows.slice(); // already sorted newest first
    var total  = sorted.length;
    var pages  = Math.max(1, Math.ceil(total / fw.PAGE_SIZE));
    fw.evalPage = Math.min(fw.evalPage, pages - 1);
    var start  = fw.evalPage * fw.PAGE_SIZE;
    var page   = sorted.slice(start, start + fw.PAGE_SIZE);

    var tableRows = page.length ? page.map(function(r, i) {
      var bg = i%2===0?'#f0f5fc':'#ffffff';
      var tdL = 'background:'+bg+';text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      var tdC = 'background:'+bg+';text-align:center;';
      return '<tr>' +
        '<td style="'+tdL+'white-space:nowrap;">'+esc(r.dt)+'</td>' +
        '<td style="'+tdL+'">'+esc(r.mb)+'</td>' +
        '<td style="'+tdL+'">'+esc(r.ev)+'</td>' +
        (fw.isAdmin?'<td style="'+tdC+'">#'+esc(r.rn)+'</td>':'') +
        '<td style="'+tdL+'">'+esc(r.sh)+'</td>' +
        '<td style="background:'+(r.pf?'#dcfce7':'#fff7ed')+';color:'+(r.pf?'#14532d':'#9a3412')+';font-weight:700;text-align:center;">'+r.sg+'/10</td>' +
        '<td style="background:'+(r.ok?'#dcfce7':'#fee2e2')+';color:'+(r.ok?'#14532d':'#7f1d1d')+';font-weight:700;text-align:center;">'+r.ov+'/25</td>' +
        '<td style="background:'+(r.ok?'#dcfce7':'#fee2e2')+';color:'+(r.ok?'#14532d':'#7f1d1d')+';font-weight:700;text-align:center;white-space:nowrap;">'+(r.ok?'✅ Pass':'❌ Below')+'</td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="'+(fw.isAdmin?8:7)+'" style="color:#6b7a94;padding:16px;">No evaluations found.</td></tr>';

    var paginationInfo = 'Showing '+(total?start+1:0)+'–'+Math.min(start+fw.PAGE_SIZE,total)+' of '+total;
    var prevDis = fw.evalPage===0?' disabled':'';
    var nextDis = fw.evalPage>=pages-1?' disabled':'';

    return '<div style="margin-bottom:14px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
        '<div style="font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;">RECENT EVALUATIONS</div>' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<span style="font-size:12px;color:#6b7a94;">'+paginationInfo+'</span>' +
          '<button class="fw-btn" id="fwEvalPrev"'+prevDis+' type="button">← Prev</button>' +
          '<button class="fw-btn" id="fwEvalNext"'+nextDis+' type="button">Next →</button>' +
        '</div>' +
      '</div>' +
      '<div class="fw-table-wrap"><table class="fw-table"><thead><tr>' +
        '<th style="width:90px;">Date</th>' +
        '<th style="width:16%;">Team Member</th>' +
        '<th style="width:14%;">Evaluator</th>' +
        (fw.isAdmin?'<th style="width:90px;">Restaurant</th>':'') +
        '<th style="width:10%;">Shift</th>' +
        '<th style="width:80px;text-align:center;">Signature</th>' +
        '<th style="width:80px;text-align:center;">Overall</th>' +
        '<th style="width:90px;text-align:center;">Result</th>' +
      '</tr></thead><tbody>'+tableRows+'</tbody></table></div>' +
    '</div>';
  }

  // ── Restaurant Breakdown (admin all view) ─────────────────────────────────
  function buildRestaurantBreakdown_(rows) {
    var restMap = {};
    rows.forEach(function(r) {
      if (!restMap[r.rn]) restMap[r.rn] = [];
      restMap[r.rn].push(r);
    });
    var restaurants = Object.keys(restMap).sort();
    if (!restaurants.length) return '';

    var tableRows = restaurants.map(function(rn, i) {
      var rRows = restMap[rn], cnt = rRows.length;
      var passR = pct(rRows.filter(function(r){return r.ok;}).length, cnt);
      var avgOv = avg(rRows,'ov');
      var avgSg = avg(rRows,'sg');
      var best  = Math.max.apply(null,rRows.map(function(r){return r.ov;}));
      var needW = rRows.filter(function(r){return !r.ok;}).length;
      var prBg  = passR>=70?'#dcfce7':passR>=50?'#fef9c3':'#fee2e2';
      var prFg  = passR>=70?'#14532d':passR>=50?'#713f12':'#7f1d1d';
      var bg    = i%2===0?'#f0fdf4':'#ffffff';
      return '<tr>' +
        '<td style="background:'+bg+';font-weight:700;">#'+esc(rn)+'</td>' +
        '<td style="background:'+bg+';">'+cnt+'</td>' +
        '<td style="background:'+prBg+';color:'+prFg+';font-weight:700;">'+passR+'%</td>' +
        '<td style="background:'+bg+';">'+avgOv+'/25</td>' +
        '<td style="background:'+bg+';">'+avgSg+'/10</td>' +
        '<td style="background:'+bg+';">'+best+'/25</td>' +
        '<td style="background:'+bg+';color:#b51218;font-weight:600;">'+needW+' staff</td>' +
      '</tr>';
    }).join('');

    return '<div style="margin-bottom:14px;">' +
      '<div style="font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">RESTAURANT BREAKDOWN</div>' +
      '<div class="fw-table-wrap"><table class="fw-table"><thead><tr>' +
        '<th>Restaurant</th><th>Evaluations</th><th>Pass Rate</th><th>Avg Overall</th><th>Avg Signature</th><th>Best Score</th><th>Needs Work</th>' +
      '</tr></thead><tbody>'+tableRows+'</tbody></table></div>' +
    '</div>';
  }

  // ── Event binding ─────────────────────────────────────────────────────────
  function bindDashboardEvents_(sec) {
    // Date filter tabs
    sec.querySelectorAll('[data-fw-date]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        fw.dateMode = btn.dataset.fwDate;
        fw.evalPage = 0;
        renderDashboard_(sec);
      });
    });

    // Restaurant filter (admin)
    var restSel = document.getElementById('fwRestFilter');
    if (restSel) {
      restSel.addEventListener('change', function() {
        fw.filter   = restSel.value;
        fw.evalPage = 0;
        renderDashboard_(sec);
      });
    }

    // Pagination
    var prevBtn = document.getElementById('fwEvalPrev');
    var nextBtn = document.getElementById('fwEvalNext');
    if (prevBtn) prevBtn.addEventListener('click', function() { fw.evalPage--; renderDashboard_(sec); });
    if (nextBtn) nextBtn.addEventListener('click', function() { fw.evalPage++; renderDashboard_(sec); });
  }
