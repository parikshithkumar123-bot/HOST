  window.gasCallGuard_ = window.gasCallGuard_ || {
    _ts: {},
    // Returns true if action is safe to fire, false if too recent
    allow: function(action, minMs) {
      var now = Date.now();
      minMs = minMs || 400;
      if (this._ts[action] && now - this._ts[action] < minMs) return false;
      this._ts[action] = now;
      return true;
    },
    // Reset a specific action (call after completion)
    release: function(action) { delete this._ts[action]; }
  };

function applyEmbeddedHeartLogo_() {
  document.querySelectorAll('[data-heart-logo-target]').forEach(function(node) {
    if (node.dataset.heartLogoApplied === 'true') return;
    if (node.tagName === 'IMG') {
      node.referrerPolicy = 'no-referrer';
      node.src = EMBEDDED_HEART_LOGO_URI;
      // Retry once without cache-busting on error (handles some CDN blocks)
      node.onerror = function() {
        if (!node.dataset.heartLogoRetried) {
          node.dataset.heartLogoRetried = 'true';
          node.src = EMBEDDED_HEART_LOGO_URI + '&t=' + Date.now();
        }
      };
    } else {
      node.style.backgroundImage = 'url(' + EMBEDDED_HEART_LOGO_URI + ')';
    }
    node.dataset.heartLogoApplied = 'true';
  });
}

applyEmbeddedHeartLogo_();
// Also apply on DOMContentLoaded for login screen img (may not be in DOM yet at script parse time)
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", applyEmbeddedHeartLogo_);
} else {
  // DOM already ready — run immediately (handles dynamic injection)
  setTimeout(applyEmbeddedHeartLogo_, 0);
}

      renderHostFlyout(category);
    });
  });
}

function triggerDashboardHeartAnimation_() {
  const heartShell = document.querySelector('.host-heart-shell');
  if (!heartShell) return;
  heartShell.classList.remove('login-burst');
  void heartShell.offsetWidth;
  heartShell.classList.add('login-burst');
  window.setTimeout(function() {
    heartShell.classList.remove('login-burst');
  }, 2900);
}

  if (newsletterEl) newsletterEl.style.display = '';
  cacheDashboardRefs_();
  bindHostButtons_();
}

function closeRoleActionsDropdown_() {
  const menu = document.getElementById('roleActionDropdownMenu');
  if (!menu || menu.hidden) return; // already closed — skip DOM writes
  menu.hidden = true;
  menu.setAttribute('hidden', '');
  menu.style.display = 'none';
  menu.classList.remove('show', 'open', 'active');
}

function openRoleActionsDropdown_() {
  const menu = document.getElementById('roleActionDropdownMenu');
  if (!menu) return;
  menu.hidden = false;
  menu.removeAttribute('hidden');
  menu.style.display = 'grid';
  menu.classList.add('open');
}

// ── GAS KEEPALIVE ──────────────────────────────────────────────────────────
// Fires a trivial ping() every 4 minutes after login to keep the V8 isolate
// warm. This eliminates the 800ms–2s cold-start penalty on every button click.
// Clears itself on logout so it doesn't run when nobody is logged in.
function startPortalKeepalive_() {
  if (window._portalKeepaliveTimer) return; // already running
  window._portalKeepaliveTimer = setInterval(function() {
    try {
      var token = getSessionToken_();
      if (!token) { stopPortalKeepalive_(); return; }
      google.script.run
        .withSuccessHandler(function() {})
        .withFailureHandler(function() {})
        .ping();
    } catch (e) {}
  }, 4 * 60 * 1000); // every 4 minutes
}
function stopPortalKeepalive_() {
  clearInterval(window._portalKeepaliveTimer);
  window._portalKeepaliveTimer = null;
}

// ── GLOBAL DOUBLE-SUBMIT GUARD ────────────────────────────────────────────────
// Tracks which record IDs currently have a save in flight.
// Call pendingSave_.lock(id) before saving — returns false if already locked.
// Call pendingSave_.unlock(id) in every success AND failure handler.
var pendingSave_ = (function() {
  var _locked = {};
  return {
    lock: function(id) {
      if (_locked[id]) return false; // already saving
      _locked[id] = true;
      return true;
    },
    unlock: function(id) {
      delete _locked[id];
    },
    isLocked: function(id) {
      return Boolean(_locked[id]);
    },
    lockBtn: function(btn, label) {
      if (!btn) return;
      btn.disabled = true;
      if (label !== undefined) btn.dataset._origText = btn.textContent;
      btn.textContent = label !== undefined ? label : 'Saving…';
    },
    unlockBtn: function(btn, originalText) {
      if (!btn) return;
      btn.disabled = false;
      btn.textContent = originalText || btn.dataset._origText || 'Save';
      delete btn.dataset._origText;
    }
  };
})();

// PAYROLL SAFE LOADER V421
// First checks if PayrollV360 is already included.
// If not, loads PayrollV360 from Apps Script and injects it into the page.
function ensurePayrollV360Loaded_() {
  function payrollReady_() {
    return typeof window.openPayrollSubmissionPageV360_ === 'function' &&
      typeof window.openPayrollReviewPageV360_ === 'function' &&
      typeof window.openPayrollAdminPageV360_ === 'function';
  }

  if (payrollReady_()) {
    return Promise.resolve(true);
  }

  if (window.__payrollV360LoadPromise) {
    return window.__payrollV360LoadPromise;
  }

  window.__payrollV360LoadPromise = new Promise(function(resolve, reject) {
    var attempts = 0;

    function checkAgain_() {
      attempts += 1;

      if (payrollReady_()) {
        resolve(true);
        return;
      }

      if (attempts < 20) {
        setTimeout(checkAgain_, 250);
        return;
      }

      window.__payrollV360LoadPromise = null;
      reject(new Error('PayrollV360 did not load. Check Apps Script has HTML file named exactly PayrollV360 and Index includes it before ClientCore.'));
    }

    checkAgain_();
  });

  return window.__payrollV360LoadPromise;
}


// HOTZONE LAZY LOAD
// HotZoneJS is loaded on demand when Hot Zone button is clicked.
function ensureHotZoneJSLoaded_() {
  if (typeof window.openHotzoneManagement_ === 'function') {
    return Promise.resolve(true);
  }

  if (window.__hotzoneJSLoadPromise) {
    return window.__hotzoneJSLoadPromise;
  }

  window.__hotzoneJSLoadPromise = new Promise(function(resolve, reject) {
    try {
      if (typeof showToast === 'function') showToast('Loading Hot Zone...', 'info');

      google.script.run
        .withSuccessHandler(function(res) {
          try {
            if (!res || res.success === false) {
              throw new Error((res && (res.error || res.message)) || 'Hot Zone module could not load.');
            }

            var content = '';
            if (res.data && res.data.content) content = String(res.data.content || '');
            else if (typeof res === 'string') content = res;

            // Strip outer <script> wrapper
            content = content
              .replace(/^\s*<script[^>]*>\s*/i, '')
              .replace(/\s*<\/script>\s*$/i, '');

            // Use a Blob URL so the script executes as a proper module
            // with full error visibility and guaranteed synchronous IIFE execution
            try {
              // Inline eval via Function — executes synchronously, surfaces errors
              (new Function(content))();
            } catch (execErr) {
              window.__hotzoneJSLoadPromise = null;
              reject(new Error('HotZone script execution failed: ' + execErr.message));
              return;
            }

            // Verify the entry point registered correctly
            if (typeof window.openHotzoneManagement_ !== 'function') {
              window.__hotzoneJSLoadPromise = null;
              reject(new Error('openHotzoneManagement_ not registered after load. Check HotZoneJS.html for errors.'));
              return;
            }

            window.__hotzoneJSLoadPromise = null;
            resolve(true);
          } catch (innerError) {
            window.__hotzoneJSLoadPromise = null;
            reject(innerError);
          }
        })
        .withFailureHandler(function(error) {
          window.__hotzoneJSLoadPromise = null;
          reject(error);
        })
        .getClientModuleContent('HotZoneJS', getSessionToken_());
    } catch (error) {
      window.__hotzoneJSLoadPromise = null;
      reject(error);
    }
  });

  return window.__hotzoneJSLoadPromise;
}

  function renderHostLinkItemV278_(link, color) {
    const url = link.url || '#';
    const description = link.description ? '<p class="host-link-desc-v278">' + escapeHtml(link.description) + '</p>' : '';
    const date = getHostLinkDateLabelV278_(link);
    const dateHtml = date ? '<div class="host-link-date-v278">' + escapeHtml(date) + '</div>' : '';
    return '<div class="host-link-item-v278" style="--host-color:' + escapeAttr(color) + '">' +
      '<a href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(link.title || 'Open link') + '</a>' +
      description + dateHtml +
    '</div>';
  }

  function getVisibleHostLinksV278_(letter) {
    const rows = Array.isArray(state.hostLinks) ? state.hostLinks : [];
    return rows.map(normalizeHostLinkV278_).filter(function(link) {
      if (link.category !== letter) return false;
      if (!link.title || !link.url) return false;
      if (link.status && link.status !== 'ACTIVE' && link.status !== 'PUBLISHED') return false;
      if (!hostLinkDateIsVisibleV278_(link)) return false;
      if (!hostLinkAudienceMatchesV278_(link)) return false;
      if (!hostLinkRestaurantMatchesV278_(link)) return false;
      return true;
    }).sort(function(a, b) {
      const ao = Number(a.sortOrder || 100) || 100;
      const bo = Number(b.sortOrder || 100) || 100;
      if (ao !== bo) return ao - bo;
      return String(a.title).localeCompare(String(b.title));
    });
  }

  function normalizeHostLinkV278_(row) {
    row = row || {};
    return {
      category: String(row.category_code || row.category || '').trim().toUpperCase(),
      title: String(row.title || row.link_title || '').trim(),
      url: String(row.url || row.link_url || row.link || '').trim(),
      description: String(row.description || row.notes || '').trim(),
      audience: String(row.target_role_codes || row.audience || row.role || '').trim(),
      restaurant: String(row.target_restaurant_ids || row.restaurant_number || row.restaurantNumber || row.restaurant || '').trim(),
      startAt: String(row.start_at || row.startAt || row.start_date || '').trim(),
      endAt: String(row.end_at || row.endAt || row.end_date || '').trim(),
      status: String(row.status || 'ACTIVE').trim().toUpperCase(),
      sortOrder: String(row.sort_order || row.sortOrder || '100').trim()
    };
  }

  function hostLinkDateIsVisibleV278_(link) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (link.startAt) {
      const start = new Date(link.startAt);
      if (!isNaN(start.getTime())) {
        start.setHours(0, 0, 0, 0);
        if (start.getTime() > today.getTime()) return false;
      }
    }
    if (link.endAt) {
      const end = new Date(link.endAt);
      if (!isNaN(end.getTime())) {
        end.setHours(23, 59, 59, 999);
        if (end.getTime() < Date.now()) return false;
      }
    }
    return true;
  }

  function hostLinkAudienceMatchesV278_(link) {
    const audience = String(link.audience || '').trim().toUpperCase();
    if (!audience || audience === 'ALL' || audience === 'ALL USERS' || audience === 'EVERYONE') return true;
    const role = String((state.session && (state.session.role || state.session.roleCode || state.session.role_code)) || '').toUpperCase();
    if (!role) return true;
    const roleLabel = role.replace(/_/g, ' ');
    return audience.indexOf(role) >= 0 || audience.indexOf(roleLabel) >= 0;
  }

  function hostLinkRestaurantMatchesV278_(link) {
    const rest = String(link.restaurant || '').trim();
    if (!rest || rest.toUpperCase() === 'ALL') return true;
    const allowed = getCurrentRestaurantNumbersV278_();
    if (!allowed.length) return true;
    return allowed.indexOf(rest) >= 0;
  }

  function getCurrentRestaurantNumbersV278_() {
    const nums = [];
    try {
      if (state.session) {
        const direct = state.session.restaurant_number || state.session.restaurantNumber || state.session.restaurant || '';
        if (direct) nums.push(String(direct));
        const list = state.session.restaurantNumbers || state.session.assignedRestaurants || state.session.restaurant_numbers || [];
        if (Array.isArray(list)) list.forEach(function(v) { if (v) nums.push(String(v)); });
      }
    } catch (error) {}
    try {
      const access = state.adminTools && (state.adminTools.restaurantAccess || state.adminTools.restaurantAccessRows || []);
      const userId = state.session && (state.session.userId || state.session.user_id || state.session.id);
      if (Array.isArray(access) && userId) {
        access.forEach(function(row) {
          const rowUserId = row.user_id || row.userId || row.user || '';
          if (String(rowUserId) === String(userId)) {
            const n = row.restaurant_number || row.restaurantNumber || row.restaurant || '';

  function formatHostLinkDisplayDateV288_(value) {
    if (!value) return '';
    const raw = String(value || '').trim();
    if (!raw) return '';
    const parsed = new Date(raw);
    if (!isNaN(parsed.getTime())) {
      return parsed.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }
    const simple = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (simple) {
      const y = Number(simple[1]);
      const m = Number(simple[2]) - 1;
      const d = Number(simple[3]);
      const date = new Date(y, m, d);
      if (!isNaN(date.getTime())) {
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      }
    }
    return raw.replace(/T.*$/, '');
  }

  function getHostLinkDateLabelV278_(link) {
    const start = formatHostLinkDisplayDateV288_(link.startAt || '');
    const end = formatHostLinkDisplayDateV288_(link.endAt || '');
    if (start && end) return start + ' to ' + end;
    if (start) return 'Starts ' + start;
    if (end) return 'Ends ' + end;
    return '';
  }

  function getLinkExpiryLabel_(link) {

    const endTime = new Date(link.end_at).getTime();
    return isNaN(endTime) ? 'Expiry not available' : (endTime < Date.now() ? 'Expired' : 'Expires ' + link.end_at);
  }

  function parseImportRows_(section, text) {
    const trimmed = String(text || '').trim();
    if (!trimmed) return [];
    const lines = trimmed.split(/\r?\n/).filter(Boolean);
    const delimiter = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
    const rows = lines.map(function(line) {
      return line.split(delimiter).map(function(cell) { return cell.trim(); });
    });
    const headers = IMPORT_COLUMNS[section] || [];
    let dataRows = rows;
    const firstRowNormalized = rows[0].map(function(cell) { return cell.toLowerCase(); });
    if (headers.every(function(header, index) { return firstRowNormalized[index] === header.toLowerCase(); })) {
      dataRows = rows.slice(1);
    }
    return dataRows.filter(function(row) { return row.some(Boolean); }).map(function(row) {
      const record = {};
      headers.forEach(function(header, index) {
        record[header] = row[index] || '';
      });
      return record;
    });
  }

  function exportSection(section) {
    const def = SECTION_DEFS[section];
    const rows = getSectionRows_(section);
    const headers = def.columns;
    const csv = [headers.join(',')].concat(rows.map(function(row) {
      return headers.map(function(header) {
        return '"' + String(row[header] || '').replaceAll('"', '""') + '"';
      }).join(',');
    })).join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = section.toLowerCase() + '.csv';
    link.click();
    URL.revokeObjectURL(link.href);

  function uniqueValuesFromRows_(rows, key) {
    const seen = {};
    return rows.map(function(row) { return String(row[key] || '').trim(); }).filter(function(value) {
      if (!value || seen[value]) return false;
      seen[value] = true;
      return true;
    });
  }

  function uniqueList_(values) {
    const seen = {};
    return values.filter(function(value) {
      const normalized = String(value || '').trim();
      if (!normalized || seen[normalized]) return false;
      seen[normalized] = true;
      return true;
    });
  }

  function inferRequestGroup(requestType) {
    const type = String(requestType || '').toUpperCase();
    if (type.indexOf('HIRING') !== -1 || type.indexOf('STAFFING') !== -1 || type.indexOf('TRANSFER') !== -1) return 'HR';
    if (type.indexOf('LETTER') !== -1 || type.indexOf('ADMIN') !== -1) return 'ADMIN';
    if (type.indexOf('SUPPLIES') !== -1 || type.indexOf('UNIFORM') !== -1 || type.indexOf('STATIONERY') !== -1) return 'SUPPLIES';
    if (type.indexOf('REPAIR') !== -1 || type.indexOf('MAINTENANCE') !== -1) return 'MAINTENANCE';
    return 'HR';
  }

  function formatLabel(key) {
    return String(key || '').replace(/_/g, ' ').replace(/([A-Z])/g, ' $1').replace(/^./, function(char) { return char.toUpperCase(); }).trim();

  function formatRoleLabel(roleCode) {
    return String(roleCode || '').split('_').map(function(part) {
      return part.charAt(0) + part.slice(1).toLowerCase();

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function escapeAttr(value) {
    return escapeHtml(value);
  }

  function escapeJsString_(value) {
  return String(value || '')
    .replaceAll('\\', '\\\\')
    .replaceAll("'", "\\'")
}

function getNewHeroYears_(members) {
  const found = {}
  const currentYear = new Date().getFullYear()

  found[String(currentYear)] = true

  ;(members || []).forEach(function(member) {
    const rawDate = member.completedAt || member.updatedAt || member.createdAt || member.hiredDate || ''
    const date = new Date(rawDate)

    if (!isNaN(date.getTime())) {
      found[String(date.getFullYear())] = true
    }
  })

  return Object.keys(found).sort(function(a, b) {
    return Number(b) - Number(a)
  })
}

    const end = new Date(start)

  }

  if (filters.dateMode === 'SPECIFIC') {

  }

  return 'Showing all dates'
}

function getNewHeroRestaurantCodes_(members) {
  const found = {}

  ;(members || []).forEach(function(member) {
    const codes = Array.isArray(member.restaurantCodes) ? member.restaurantCodes : []

    codes.forEach(function(code) {
      code = String(code || '').trim()

    })

function matchesNewHeroFilters_(member) {
  const filters = window.newHeroFilters || {}
  const search = String(filters.search || '').trim().toLowerCase()
  const restaurant = String(filters.restaurant || 'ALL').trim()
  const statusFilter = String(filters.status || 'ALL').trim()
  const dateMode = String(filters.dateMode || 'ALL').trim()
  const specificDate = String(filters.specificDate || '').trim()

  const name = String(member.name || '').toLowerCase()
  const status = normalizeNewHeroStatus_(member.outcomeStatus || member.status || '')
  const codes = Array.isArray(member.restaurantCodes) ? member.restaurantCodes : []
  const restaurantText = String(member.restaurantCode || member.restaurantName || '')

  if (search && name.indexOf(search) === -1) {
    return false
  }

  if (restaurant !== 'ALL') {
    const hasCode = codes.indexOf(restaurant) !== -1 || restaurantText.indexOf(restaurant) !== -1
    if (!hasCode) return false
  }

  if (statusFilter !== 'ALL' && status !== statusFilter) {
    return false
  }

  if (!matchesNewHeroDateFilter_(member, dateMode, specificDate)) {
    return false
  }

  return true
}

function matchesNewHeroDateFilter_(member, dateMode, specificDate) {
  if (!dateMode || dateMode === 'ALL') return true

  const rawDate = member.completedAt || member.updatedAt || member.createdAt || member.hiredDate || ''
  if (!rawDate) return false

  const date = new Date(rawDate)
  if (isNaN(date.getTime())) return false

  const now = new Date()

  if (dateMode === 'YTD') {
    return date.getFullYear() === now.getFullYear()
  }

  if (dateMode === 'MONTH') {
    return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth()
  }

  if (dateMode === 'WEEK') {
    const start = getStartOfWeekMonday_(now)
    const end = new Date(start)
    end.setDate(start.getDate() + 7)
    return date >= start && date < end
  }

  if (dateMode === 'SPECIFIC') {
    if (!specificDate) return true
    return date.toISOString().slice(0, 10) === specificDate
  }

  return true
}

function getStartOfWeekMonday_(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate())
  const day = d.getDay()
  const diff = day === 0 ? -6 : 1 - day
  d.setDate(d.getDate() + diff)
  d.setHours(0, 0, 0, 0)
  return d
}

function formatNewHeroDateTime_(value) {
  if (!value) return ''

  try {
    const date = new Date(value)
    if (isNaN(date.getTime())) return String(value)

    return date.toLocaleString('en-CA', {
      year: 'numeric',
      month: 'short',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    })
  } catch (error) {
    return String(value)
  }
}

function formatNewHeroDate_(value) {
  if (!value) return '';

  try {
    const date = new Date(value);
    if (isNaN(date.getTime())) return String(value);

    return date.toLocaleDateString('en-CA', {
      year: 'numeric',
      month: 'short',
      day: '2-digit'
    });
  } catch (error) {
    return String(value);
  }
}

function getHistoryHtml_(records) {

  const fromFilter = recruitmentState.historyDateFrom;

  const restFilter = recruitmentState.historyRestaurant.toLowerCase();

  let filtered = records;
  if (fromFilter) filtered = filtered.filter(function(h) { return (h.start_date || '') >= fromFilter; });
  if (toFilter) filtered = filtered.filter(function(h) { return (h.start_date || '') <= toFilter; });
  if (restFilter) filtered = filtered.filter(function(h) { return String(h.restaurant_id || '').toLowerCase().includes(restFilter); });

function getStatusBadgeHtml_(hire) {
  const confirmed = hire.restaurant_confirmation_at && String(hire.restaurant_confirmation_at).trim() !== '';

      if (!card) return;

      const quitWrap = card.querySelector('.nh-quit-reason-wrap');
      if (!quitWrap) return;

      quitWrap.style.display = selectEl.value === 'Quit' ? '' : 'none';
    });
  });

  document.querySelectorAll('.nh-save-status-btn').forEach(function(button) {
    button.addEventListener('click', function() {
      const teamMemberId = button.dataset.teamMemberId;
      const card = button.closest('.nh-employee-card');
      const msg = document.getElementById('newHeroStatusMsg_' + teamMemberId);

      if (!card) return;

      const statusField = card.querySelector('[data-new-hero-status]');
      const reasonField = card.querySelector('[data-new-hero-quit-reason]');

      const status = statusField ? statusField.value : '';
      const quitReason = reasonField ? reasonField.value.trim() : '';

      if (!status) {
        if (msg) msg.textContent = 'Please select a status.';
        return;
      }

      if (status === 'Quit' && !quitReason) {
        if (msg) msg.textContent = 'Please enter quit reason.';
        return;
      }

      button.disabled = true;
      if (msg) msg.textContent = 'Saving…';

      google.script.run
        .withSuccessHandler(function(response) {
          button.disabled = false;

          if (!response.success) {
            if (msg) msg.textContent = response.error || 'Could not save status.';
            return;
          }

          if (msg) msg.textContent = 'Saved ✓';
          // Optimistic local update — no round-trip reload needed
          try {
            var employees = (recruitmentState.teamData && recruitmentState.teamData.employees) ? recruitmentState.teamData.employees : [];
            for (var _i = 0; _i < employees.length; _i++) {
              if (String(employees[_i].team_member_id || employees[_i].id || '') === String(teamMemberId)) {
                employees[_i].status = status;
                if (quitReason) employees[_i].quit_reason = quitReason;
                break;
              }
            }
            if (typeof renderNewHeroesView_ === 'function') renderNewHeroesView_();
          } catch (_e) { loadNewHeroesPageData_(); }
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          if (msg) msg.textContent = error.message || 'Could not save status.';
        })
        .updateNewHeroEmployeeStatus({
          sessionToken: getSessionToken_(),
          teamMemberId: teamMemberId,
          status: status,
          quitReason: quitReason
        });
    });
  });
}

  if (saveBtn) saveBtn.disabled = true

function renderNewHeroesRestaurantChecklist_() {
  const box = document.getElementById('newHeroRestaurantChecklist');

  if (!box) return;

  const searchText = search ? search.value.toLowerCase() : '';
  const rows = newHeroesRestaurants.filter(function(restaurant) {
    const text = String((restaurant.restaurantCode || '') + ' ' + (restaurant.restaurantName || '')).toLowerCase();
    return !searchText || text.indexOf(searchText) !== -1;
  });

  if (!rows.length) {
    box.innerHTML = '<p class="helper-text">No restaurants found.</p>';
    return;
  }

  box.innerHTML = rows.map(function(restaurant) {
    const checked = newHeroesSelectedRestaurants.indexOf(restaurant.restaurantId) !== -1 ? ' checked' : '';
    return '' +
      '<label class="mt-check-option">' +
        '<input type="checkbox" value="' + escapeAttr(restaurant.restaurantId) + '"' + checked + '>' +
        '<span>' + escapeHtml((restaurant.restaurantCode ? restaurant.restaurantCode + ' - ' : '') + restaurant.restaurantName) + '</span>' +
      '</label>';
  }).join('');

  box.querySelectorAll('input[type="checkbox"]').forEach(function(checkbox) {
    checkbox.addEventListener('change', function() {
      if (checkbox.checked) {
        if (newHeroesSelectedRestaurants.indexOf(checkbox.value) === -1) {
          newHeroesSelectedRestaurants.push(checkbox.value);

      } else {
        newHeroesSelectedRestaurants = newHeroesSelectedRestaurants.filter(function(id) {

      updateNewHeroesRestaurantButton_();
    });
  });

        box.innerHTML = '<p class="message">' + escapeHtml(response.error || 'Could not load recent requests.') + '</p>';
        return;
      }

      const rows = response.data && response.data.requests ? response.data.requests : [];

      if (!rows.length) {
        box.innerHTML = '<p class="helper-text">No hiring requests yet.</p>';
        return;
      }

      box.innerHTML = rows.map(function(row) {
        const statusClass = row.status === 'Hiring Done' ? 'hiring-done' : 'viewed';

        return '' +
          '<div class="hiring-request-card">' +
            '<div><strong>' + escapeHtml(row.position || '-') + '</strong><span>' + escapeHtml(row.employmentType || '-') + '</span></div>' +
            '<div><span>' + escapeHtml(row.submitterName || '-') + '</span><small>' + escapeHtml(formatDateTime_(row.submittedAt)) + '</small></div>' +
            '<span class="hiring-status ' + statusClass + '">' + escapeHtml(row.status || 'Viewed') + '</span>' +
          '</div>';
      }).join('');
    })
    .withFailureHandler(function(error) {
      box.innerHTML = '<p class="message">' + escapeHtml(error.message || 'Could not load recent requests.') + '</p>';
    })
    .getRecentHiringRequests(getSessionToken_());
}

function formatDateTime_(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return value;
  return d.toLocaleString();
}

function bindManageTeamEvents_() {
  const form = document.getElementById('manageTeamForm');
  const cancelBtn = document.getElementById('manageTeamCancelBtn');
  const dropdownBtn = document.getElementById('mtRestaurantDropdownBtn');
  const dropdownPanel = document.getElementById('mtRestaurantDropdownPanel');
  const search = document.getElementById('mtRestaurantSearch');
  const selectAllBtn = document.getElementById('mtSelectAllRestaurants');
  const clearBtn = document.getElementById('mtClearRestaurants');
  const doneBtn = document.getElementById('mtDoneRestaurants');

  if (form) {
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      saveManageTeamEmployee_();
    });
  }

  if (cancelBtn) {
    cancelBtn.addEventListener('click', function() {
      form.reset();
      manageTeamSelectedRestaurants = [];
      document.getElementById('mtNewlyHired').checked = true;
      document.getElementById('manageTeamMessage').textContent = '';
      updateManageTeamRestaurantButton_();
      renderManageTeamRestaurantChecklist_();
    });
  }

  if (dropdownBtn) {
    dropdownBtn.addEventListener('click', function() {
      dropdownPanel.hidden = !dropdownPanel.hidden;
      renderManageTeamRestaurantChecklist_();
    });
  }

  if (search) {
    search.addEventListener('input', renderManageTeamRestaurantChecklist_);
  }

  if (selectAllBtn) {
    selectAllBtn.addEventListener('click', function() {
      manageTeamSelectedRestaurants = manageTeamRestaurants.map(function(r) {
        return r.restaurantId;
      });
      updateManageTeamRestaurantButton_();
      renderManageTeamRestaurantChecklist_();
    });
  }

  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      manageTeamSelectedRestaurants = [];
      updateManageTeamRestaurantButton_();
      renderManageTeamRestaurantChecklist_();
    });
  }

  if (doneBtn) {
    doneBtn.addEventListener('click', function() {
      dropdownPanel.hidden = true;
      updateManageTeamRestaurantButton_();
    });
  }
}

function loadManageTeamData_() {
  const list = document.getElementById('manageTeamList');

  if (list) list.innerHTML = 'Loading team members...';

  google.script.run
    .withSuccessHandler(function(response) {
      if (!response.success) {
        if (list) list.innerHTML = '<p class="message">' + escapeHtml(response.error || 'Could not load team data.') + '</p>';
        return;
      }

      const data = response.data || {};
      manageTeamRestaurants = data.restaurants || [];
      renderManageTeamRestaurantChecklist_();
      updateManageTeamRestaurantButton_();
      renderManageTeamList_(data.teamMembers || []);
    })
    .withFailureHandler(function(error) {
      if (list) list.innerHTML = '<p class="message">' + escapeHtml(error.message || 'Could not load team data.') + '</p>';
    })
    .getManageTeamData(getSessionToken_());

function saveManageTeamEmployee_() {
  const msg = document.getElementById('manageTeamMessage');

  const name = document.getElementById('mtName').value.trim();
  const mobile = document.getElementById('mtMobile').value.trim();
  const hiredDate = document.getElementById('mtHiredDate').value;
  const newlyHired = document.getElementById('mtNewlyHired').checked;

  const selectedRestaurants = manageTeamSelectedRestaurants.slice();

  if (!name || !mobile || !hiredDate || !selectedRestaurants.length) {
    msg.textContent = 'Please fill all required fields.';
    return;
  }

  if (!/^[0-9+()\\-\\s]{7,20}$/.test(mobile)) {
    msg.textContent = 'Please enter a valid mobile number.';
    return;
  }

  msg.textContent = 'Saving…';

  google.script.run
    .withSuccessHandler(function(response) {
      if (!response.success) {
        msg.textContent = response.error || 'Employee could not be saved.';
        return;
      }

      document.getElementById('manageTeamForm').reset();
      document.getElementById('mtNewlyHired').checked = true;
      msg.textContent = 'Employee saved successfully.';
      loadManageTeamData_();
    })
    .withFailureHandler(function(error) {
      msg.textContent = error.message || 'Employee could not be saved.';
    })
    .saveTeamMemberFromManageTeam({
      sessionToken: getSessionToken_(),
      newlyHired: newlyHired,
      name: name,
      mobile: mobile,
      hiredDate: hiredDate,
      assignedRestaurants: selectedRestaurants
    });
}

function renderManageTeamList_(members) {
  const list = document.getElementById('manageTeamList');
  if (!list) return;

  if (!members.length) {
    list.innerHTML = '<p class="helper-text">No team members added yet.</p>';
    return;
  }

  const followUpMembers = members.filter(function(member) {
    return String(member.status || '').trim() === 'Ready to Start';
  });

  const historyMembers = members.filter(function(member) {
    return String(member.status || '').trim() === 'ACTIVE';
  });

  const normalMembers = members.filter(function(member) {
    const status = String(member.status || '').trim();
    return status !== 'Ready to Start' && status !== 'Ready to Start' && status !== 'ACTIVE';
  });

  list.innerHTML =
    '<div class="mt-followup-section">' +
      '<h4>Follow Up Required</h4>' +
      (followUpMembers.length
        ? followUpMembers.map(renderManageTeamCard_).join('')
        : '<p class="helper-text">No follow up required.</p>') +
    '</div>' +

    '<div class="mt-history-section">' +
      '<h4>History</h4>' +
      (historyMembers.length
        ? historyMembers.map(renderManageTeamCard_).join('')
        : '<p class="helper-text">No completed employees yet.</p>') +
    '</div>' +

    '<div class="mt-normal-section">' +
      '<h4>Current Team</h4>' +
      (normalMembers.length
        ? normalMembers.map(renderManageTeamCard_).join('')
        : '<p class="helper-text">No current team members.</p>') +
    '</div>';

  list.querySelectorAll('[data-save-team-status]').forEach(function(button) {
    button.addEventListener('click', function() {
      const teamMemberId = button.dataset.saveTeamStatus;
      const select = list.querySelector('[data-team-status="' + teamMemberId + '"]');
      saveManageTeamStatus_(teamMemberId, select.value);
    });
  });
}

function saveManageTeamStatus_(teamMemberId, status) {

      if (!response.success) {
        showToast(response.error || 'Status could not be updated.', 'error');
        return;
      }

      showToast('Status updated successfully.', 'success');
      loadManageTeamData_();
    })

      showToast(error.message || 'Status could not be updated.', 'error');
    })

    });

function renderManageTeamRestaurantChecklist_() {
  const box = document.getElementById('mtRestaurantChecklist');
  const search = document.getElementById('mtRestaurantSearch');
  if (!box) return;

  const searchText = search ? search.value.toLowerCase() : '';

  const rows = manageTeamRestaurants.filter(function(r) {
    const text = String((r.restaurantCode || '') + ' ' + (r.restaurantName || '')).toLowerCase();
    return !searchText || text.indexOf(searchText) !== -1;
  });

  if (!rows.length) {
    box.innerHTML = '<p class="helper-text">No restaurants found.</p>';
    return;
  }

  box.innerHTML = rows.map(function(r) {
    const checked = manageTeamSelectedRestaurants.indexOf(r.restaurantId) !== -1 ? ' checked' : '';
    return '' +
      '<label class="mt-check-option">' +
        '<input type="checkbox" value="' + escapeAttr(r.restaurantId) + '"' + checked + '>' +
        '<span>' + escapeHtml((r.restaurantCode ? r.restaurantCode + ' - ' : '') + r.restaurantName) + '</span>' +
      '</label>';
  }).join('');

  box.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
    cb.addEventListener('change', function() {
      if (cb.checked) {
        if (manageTeamSelectedRestaurants.indexOf(cb.value) === -1) {
          manageTeamSelectedRestaurants.push(cb.value);
        }
      } else {
        manageTeamSelectedRestaurants = manageTeamSelectedRestaurants.filter(function(id) {
          return id !== cb.value;
        });
      }
      updateManageTeamRestaurantButton_();
    });
  });
}

function updateManageTeamRestaurantButton_() {
  const btn = document.getElementById('mtRestaurantDropdownBtn');
  if (!btn) return;

  if (!manageTeamSelectedRestaurants.length) {
    btn.textContent = 'Select restaurants';
    return;
  }

  btn.textContent = manageTeamSelectedRestaurants.length + ' restaurant selected';
}

function selected_(current, expected) {
  return String(current || '') === String(expected || '') ? ' selected' : '';
}

    page.hidden = true;
    dashboardStage.style.display = 'grid';
  }

  function setNewHeroesPageMessage_(message, isError) {
    const el = document.getElementById('newHeroesPageMessage');

    el.textContent = message || '';
    el.style.color = isError ? '#b51218' : '#0f8f57';
  }

  function loadNewHeroesPageDashboardData_() {
    const token = getSessionTokenForNewHeroesPage_();
    if (!token) {
      setNewHeroesPageMessage_('Session expired. Please log in again.', true);
      return;
    }

    google.script.run
      .withSuccessHandler(function(response) {
        if (!response || !response.success) {
          setNewHeroesPageMessage_((response && response.error) || 'Unable to load New Heroes data.', true);
          return;
        }

        const data = response.data || {};
        newHeroesPageRestaurants = data.restaurants || [];
        newHeroesPageEmployees = data.teamMembers || data.employees || [];
        renderNewHeroesPageRestaurantChecklist_();
        renderNewHeroesPageList_(newHeroesPageEmployees);
      })
      .withFailureHandler(function(error) {
        setNewHeroesPageMessage_((error && error.message) || 'Unable to load New Heroes data.', true);
      })
      .getManageTeamData(token);
  }

  function renderNewHeroesPageRestaurantChecklist_() {
    const list = document.getElementById('newHeroesRestaurantChecklist');
    const searchField = document.getElementById('newHeroesRestaurantSearch');
    if (!list) return;

    const searchValue = String((searchField && searchField.value) || '').toLowerCase();
    list.innerHTML = '';

    newHeroesPageRestaurants
      .filter(function(restaurant) {
        const label = [
          restaurant.restaurantCode,
          restaurant.restaurantName,
          restaurant.region
        ].join(' ').toLowerCase();

        return !searchValue || label.indexOf(searchValue) !== -1;
      })
      .forEach(function(restaurant) {
        const id = String(restaurant.restaurantId || '');
        const label = [restaurant.restaurantCode, restaurant.restaurantName].filter(Boolean).join(' - ') || id;
        const row = document.createElement('label');
        row.className = 'mt-check-option';
        row.innerHTML = '' +
          '<input type="checkbox" value="' + escapeAttr(id) + '"' +
            (selectedNewHeroesPageRestaurants.indexOf(id) !== -1 ? ' checked' : '') + '>' +
          '<span>' + escapeHtml(label) + '</span>';

        const checkbox = row.querySelector('input');
        checkbox.addEventListener('change', function() {
          if (checkbox.checked) {
            if (selectedNewHeroesPageRestaurants.indexOf(id) === -1) {
              selectedNewHeroesPageRestaurants.push(id);
            }
          } else {
            selectedNewHeroesPageRestaurants = selectedNewHeroesPageRestaurants.filter(function(value) {
              return value !== id;
            });
          }
          updateNewHeroesPageRestaurantButton_();
        });

        list.appendChild(row);
      });

    updateNewHeroesPageRestaurantButton_();
  }

  function updateNewHeroesPageRestaurantButton_() {

      btn.textContent = 'Select restaurants';
      return;

    if (mobileField) mobileField.value = '';

    renderNewHeroesPageRestaurantChecklist_();
    setNewHeroesPageMessage_('', false);

  function submitNewHeroesPage_(event) {

    const name = String((document.getElementById('newHeroesNameField') || {}).value || '').trim();
    const mobile = String((document.getElementById('newHeroesMobileField') || {}).value || '').trim();

    if (!selectedNewHeroesPageRestaurants.length) return setNewHeroesPageMessage_('Select at least one restaurant.', true);

    setNewHeroesPageMessage_('Saving new hero...', false);

    google.script.run
      .withSuccessHandler(function(response) {

          setNewHeroesPageMessage_((response && response.error) || 'Unable to save new hero.', true);
          return;
        }

        clearNewHeroesPageForm_();

      .saveManageTeamEmployee({

        mobile: mobile,

        newlyHired: true

    const teamMemberId = String(card.dataset.teamMemberId || '').trim();
    const employee = newHeroesPageEmployees.find(function(item) {

      return;

    if (tab === 'INACTIVE_USERS') return status === 'INACTIVE';
    if (tab === 'BLOCKED_USERS') return status === 'BLOCKED' || status === 'LOGIN_BLOCKED';
    return true;
  }

  function filteredUsers() {
    var st = window.userManagementState;
    var search = lower(st.search);
    var role = upper(st.role);
    var status = upper(st.status);
    var restaurant = clean(st.restaurant);
    var rows = getUsers().filter(function(user) {
      if (!userMatchesTab(user)) return false;
      if (role !== 'ALL' && upper(getRole(user)) !== role) return false;
      if (status !== 'ALL' && upper(getStatus(user)) !== status) return false;
      if (restaurant !== 'ALL') {
        var nums = assignedRestaurantNumbers(user).map(clean);
        var ids = assignedRestaurantIds(user).map(clean);
        if (nums.indexOf(restaurant) === -1 && ids.indexOf(restaurant) === -1) return false;
      }
      if (!search) return true;
      var hay = [getUserName(user), user.username, user.email, user.phone, getRole(user), getStatus(user), assignedRestaurantNumbers(user).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(search) !== -1;
    });
    var limit = st.rowLimit === 'ALL' ? rows.length : Number(st.rowLimit || 50);
    return rows.slice(0, limit || 50);
  }

  function uniqueStatuses() {
    var map = { ACTIVE: true, INACTIVE: true, BLOCKED: true };
    getUsers().forEach(function(u) { if (getStatus(u)) map[upper(getStatus(u))] = true; });
    return Object.keys(map);
  }

  function renderStatusOptions(selected) {
    return '<option value="ALL">All Status</option>' + uniqueStatuses().map(function(s) {
      return '<option value="' + attr(s) + '"' + (upper(selected) === s ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');
  }
  function renderRoleOptions(selected) {
    var roles = getRoles().slice();
    getUsers().forEach(function(u) { var r = getRole(u); if (r && roles.indexOf(r) === -1) roles.push(r); });
    return '<option value="ALL">All Roles</option>' + roles.map(function(role) {
      return '<option value="' + attr(role) + '"' + (upper(selected) === upper(role) ? ' selected' : '') + '>' + esc(roleLabel(role)) + '</option>';
    }).join('');
  }
  function renderRestaurantOptions(selected) {
    var selectedClean = clean(selected);
    return '<option value="ALL">All Restaurants</option>' + getRestaurants().map(function(r) {
      var id = restaurantIdFromRecord(r);
      var code = restaurantNumberFromRecord(r) || id;
      var name = clean(r.restaurantName || r.restaurant_name || r.name);
      var label = name ? code + ' - ' + name : code;
      var chosen = selectedClean === id || selectedClean === code;
      return '<option value="' + attr(id) + '"' + (chosen ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
  }

  function renderAssignedRestaurantOptions(selectedList) {
    var selected = {};
    (selectedList || []).forEach(function(item) { selected[clean(item)] = true; });
    return getRestaurants().map(function(r) {
      var id = restaurantIdFromRecord(r);
      var code = restaurantNumberFromRecord(r) || id;
      var name = clean(r.restaurantName || r.restaurant_name || r.name);
      var label = name ? code + ' - ' + name : code;
      var isSelected = selected[id] || selected[code];
      return '<option value="' + attr(id) + '" data-restaurant-code="' + attr(code) + '"' + (isSelected ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
  }

  function renderAssignedRestaurantChoices(selectedList, searchText) {
    var selected = {};
    (selectedList || []).forEach(function(item) { selected[clean(item)] = true; });
    var search = lower(searchText || '');
    var rows = getRestaurants().filter(function(r) {
      var id = restaurantIdFromRecord(r);
      var code = restaurantNumberFromRecord(r) || id;
      var name = clean(r.restaurantName || r.restaurant_name || r.name);
      var hay = [id, code, name].join(' ').toLowerCase();
      return !search || hay.indexOf(search) !== -1;
    });
    if (!rows.length) {
      if (window.userManagementState.restaurantsLoading) return '<div class="um-restaurant-row">Loading restaurants...</div>';
      return '<div class="um-restaurant-row">No restaurants found. Click Refresh Restaurants.</div>';
    }
    return rows.map(function(r) {
      var id = restaurantIdFromRecord(r);
      var code = restaurantNumberFromRecord(r) || id;
      var name = clean(r.restaurantName || r.restaurant_name || r.name);
      var label = name ? code + ' - ' + name : code;
      var isSelected = selected[id] || selected[code];
      return '<label class="um-restaurant-row"><input type="checkbox" data-um-restaurant-check value="' + attr(id) + '"' + (isSelected ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
    }).join('');
  }

  function selectedValues(selectEl) {
    if (!selectEl) return [];
    return Array.prototype.slice.call(selectEl.selectedOptions || []).map(function(option) { return clean(option.value); }).filter(Boolean);
  }

  function renderShell(contentHtml) {
    var sections = getSections();
    if (!sections) return;

    sections.innerHTML =
      '<section class="um-page">' +
        '<div class="um-titlebar">' +

      '</section>';

  }

  function tabBtn(key, label) {
    return '<button class="um-tab' + (window.userManagementState.tab === key ? ' active' : '') + '" data-um-tab="' + attr(key) + '" type="button">' + esc(label) + '</button>';
  }

  function renderFilter() {
    var st = window.userManagementState;
    return '<div class="um-filter">' +
      '<div class="um-filter-grid">' +
        '<label><span>Search</span><input class="um-control" id="umSearch" type="text" value="' + attr(st.search) + '" placeholder="Name, username, email, phone"></label>' +

        '<label><span>Rows</span><select class="um-control" id="umRowLimit"><option value="50"' + (st.rowLimit === '50' ? ' selected' : '') + '>Recent 50</option><option value="100"' + (st.rowLimit === '100' ? ' selected' : '') + '>Recent 100</option><option value="500"' + (st.rowLimit === '500' ? ' selected' : '') + '>Recent 500</option><option value="ALL"' + (st.rowLimit === 'ALL' ? ' selected' : '') + '>All Rows</option></select></label>' +
        '<button class="um-btn primary" id="umApplyFilter" type="button">Apply</button>' +
        '<button class="um-btn" id="umClearFilter" type="button">Clear</button>' +
      '</div>' +
    '</div>';
  }

  function getUserPageRows() {
    var st = window.userManagementState;
    var rows = filteredUsers();
    var pageSize = Number(st.pageSize || 10) || 10;
    var totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    var page = Math.max(1, Math.min(Number(st.page || 1) || 1, totalPages));
    st.page = page;
    var start = (page - 1) * pageSize;
    return rows.slice(start, start + pageSize);
  }

  function renderUserPagination() {
    var st = window.userManagementState;
    var rows = filteredUsers();
    var pageSize = Number(st.pageSize || 10) || 10;
    var total = rows.length;
    var totalPages = Math.max(1, Math.ceil(total / pageSize));
    var page = Math.max(1, Math.min(Number(st.page || 1) || 1, totalPages));
    st.page = page;
    var start = total ? ((page - 1) * pageSize + 1) : 0;
    var end = Math.min(page * pageSize, total);
    return '<div class="um-pagination">' +
      '<button class="um-btn small um-page-btn" id="umPrevPage" type="button"' + (page <= 1 ? ' disabled' : '') + '>Prev</button>' +
      '<span class="um-page-info">Showing ' + esc(start) + ' to ' + esc(end) + ' of ' + esc(total) + '</span>' +
      '<button class="um-btn small um-page-btn" id="umNextPage" type="button"' + (page >= totalPages ? ' disabled' : '') + '>Next</button>' +
    '</div>';
  }

  function renderUserRows() {
    var rows = getUserPageRows();
    if (!rows.length) return '<tr><td colspan="8">No users found.</td></tr>';
    return rows.map(function(user) {
      var id = getUserId(user);
      var status = getStatus(user) || 'ACTIVE';

      var mainRow = '<tr>' +
        '<td><button class="um-name" data-um-view="' + attr(id) + '" type="button">' + esc(getUserName(user) || 'No name') + '</button></td>' +
        '<td>' + esc(user.username || '') + '</td>' +
        '<td>' + esc(roleLabel(getRole(user))) + '</td>' +
        '<td>' + esc(nums.length ? String(nums.length) : '0') + '</td>' +
        '<td><span class="um-badge' + statusClass(status) + '">' + esc(status) + '</span></td>' +
        '<td>' + esc(user.lastLoginAt || user.last_login_at || '') + '</td>' +
        '<td>' + esc(user.email || '') + '</td>' +
        '<td>' + actionButtons(user) + '</td>' +
      '</tr>';
      var detailRow = open ? '<tr class="um-detail-row"><td colspan="8">' + userDetail(user) + '</td></tr>' : '';

  function actionButtons(user) {

    return '<div class="um-actions">' +
      '<button class="um-btn small" data-um-view="' + attr(id) + '" type="button">View</button>' +

  function userDetail(user) {

    return '<div class="um-detail">' +

        detailItem('Username', user.username) +
        detailItem('Email', user.email) +
        detailItem('Phone', user.phone) +
        detailItem('Role', roleLabel(getRole(user))) +
        detailItem('Status', getStatus(user)) +
        detailItem('Primary Restaurant', restaurantNumberById(user.restaurantId || user.restaurant_id || '')) +
        detailItem('Assigned Restaurants', nums.length ? nums.join(', ') : 'None') +
        detailItem('Last Login', user.lastLoginAt || user.last_login_at || '') +

        '<button class="um-btn" data-um-edit="' + attr(userId) + '" type="button">Edit User</button>' +

        '<button class="um-btn um-welcome-email-btn" style="background:#fff;color:#0076b6;border-color:#0076b6;" data-um-welcome="' + attr(userId) + '" data-um-welcome-email="' + attr(user.email || '') + '" data-um-welcome-name="' + attr(getUserName(user)) + '" data-um-welcome-needs-pw="' + (user.welcomeEmailPending ? 'false' : 'true') + '" type="button">✉ ' + (user.welcomeEmailPending ? 'Send Welcome Email' : 'Resend Welcome Email') + '</button>' +
        (upper(getStatus(user)) === 'ACTIVE' ? '<button class="um-btn danger" data-um-status="INACTIVE" data-um-id="' + attr(userId) + '" type="button">Deactivate</button>' : '<button class="um-btn" data-um-status="ACTIVE" data-um-id="' + attr(userId) + '" type="button">Activate</button>') +
        (upper(getStatus(user)) === 'BLOCKED' || upper(getStatus(user)) === 'LOGIN_BLOCKED' ? '<button class="um-btn" data-um-status="ACTIVE" data-um-id="' + attr(userId) + '" type="button">Unblock</button>' : '<button class="um-btn danger" data-um-status="BLOCKED" data-um-id="' + attr(userId) + '" type="button">Block</button>') +
      '</div>' +
      (isEditing ? renderInlineUserEditForm(user) : '') +

  function renderInlineUserEditForm(user) {

    return '<div class="um-edit-form">' +
      '<div class="um-edit-grid">' +
        '<label><span>Full Name</span><input class="um-control" id="umEditFullName" type="text" value="' + attr(getUserName(user)) + '"></label>' +
        '<label><span>Username</span><input class="um-control" id="umEditUsername" type="text" value="' + attr(user.username || '') + '"></label>' +
        '<label><span>Email</span><input class="um-control" id="umEditEmail" type="email" value="' + attr(user.email || '') + '"></label>' +
        '<label><span>Phone</span><input class="um-control" id="umEditPhone" type="text" value="' + attr(user.phone || '') + '"></label>' +
        '<label><span>Role</span><select class="um-control" id="umEditRole"><option value="">Select role</option>' + roleOptions + '</select></label>' +
        '<label><span>Status</span><select class="um-control" id="umEditStatus"><option value="ACTIVE"' + (upper(status) === 'ACTIVE' ? ' selected' : '') + '>ACTIVE</option><option value="INACTIVE"' + (upper(status) === 'INACTIVE' ? ' selected' : '') + '>INACTIVE</option><option value="BLOCKED"' + (upper(status) === 'BLOCKED' || upper(status) === 'LOGIN_BLOCKED' ? ' selected' : '') + '>BLOCKED</option></select></label>' +
        '<label style="grid-column:span 3;"><span>Assigned Restaurants</span><select class="um-control multiple" id="umEditRestaurants" multiple>' + renderAssignedRestaurantOptions(assignedRestaurantIds(user)) + '</select><div class="um-edit-note">Hold Ctrl on Windows or Command on Mac to select more than one restaurant.</div></label>' +
      '</div>' +
      '<div class="um-actions" style="margin-top:12px;">' +
        '<button class="um-btn primary" data-um-save-edit="' + attr(getUserId(user)) + '" type="button">Save Changes</button>' +

      '</div>' +

    '</div>';
  }

  function pendingActionRr(row) {
    var st = normalizeStatus(currentStatus(row)).toLowerCase();
    if (st === 'completed' || st === 'received' || st === 'hiring complete') return 'Completed';
    if (st === 'rejected' || st === 'cancelled' || st === 'closed') return 'Closed';
    if (st.indexOf('waiting') !== -1 && st.indexOf('restaurant') !== -1) return 'Waiting Restaurant';
    return 'Admin Action Needed';
  }
  function pendingClassRr(row) {
    var p = pendingActionRr(row);
    if (p === 'Completed' || p === 'Closed') return 'done';
    if (p === 'Admin Action Needed') return 'admin';
    return '';
  }
  function trackingCardRr(row) {
    return '<div class="rrc-track-card">' +
      '<div class="rrc-detail-label">Pending Action</div><div><span class="rrc-pending ' + pendingClassRr(row) + '">' + esc(pendingActionRr(row)) + '</span></div>' +
      '<div class="rrc-detail-label">Progress</div><div>' + progressHtmlRr(row) + '</div>' +
      '</div>';
  }
  function progressHtmlRr(row) {
    var st = normalizeStatus(currentStatus(row)).toLowerCase();
    var steps = ['Submitted','Viewed','In Review','Waiting','Completed'];
    var index = 0;
    if (st === 'viewed') index = 1;
    if (st.indexOf('review') !== -1 || st.indexOf('progress') !== -1) index = 2;
    if (st.indexOf('waiting') !== -1) index = 3;
    if (st === 'completed' || st === 'received' || st === 'hiring complete') index = 4;
    return '<div class="rrc-progress">' + steps.map(function(step, i) {
      var cls = i < index ? ' done' : (i === index ? ' current' : '');
      return '<span class="rrc-step' + cls + '"><span class="rrc-dot"></span>' + esc(step) + '</span>';
    }).join('') + '</div>';
  }

  function detailItem(label, value) { return '<div class="um-detail-item"><span>' + esc(label) + '</span><strong>' + esc(value || '') + '</strong></div>'; }

  function renderUserList() {

      '</div>' +

      '<div class="um-table-wrap"><table class="um-table"><thead><tr>' +
        '<th>Full Name</th><th>Username</th><th>Role</th><th>Restaurants</th><th>Status</th><th>Last Login</th><th>Email</th><th>Actions</th>' +
      '</tr></thead><tbody>' + renderUserRows() + '</tbody></table></div>' +
      renderUserPagination()
    );
  }


  function loadUserManagementRestaurants(callback) {
    if (window.userManagementState.restaurantsLoading) return;
    if (!window.google || !google.script || !google.script.run || !getToken()) return;

    window.userManagementState.restaurantsLoading = true;
    var list = byId('umRestaurantChoiceList');
    if (list) list.innerHTML = '<div class="um-restaurant-row">Loading restaurants...</div>';

    google.script.run
      .withSuccessHandler(function(response) {
        window.userManagementState.restaurantsLoading = false;
        var data = response && response.data ? response.data : {};
        window.userManagementState.restaurants = data.restaurants || data.restaurantRows || [];
        window.userManagementState.restaurantsLoaded = true;
        if (typeof callback === 'function') callback();
        else refreshCreateRestaurantChoices();
      })
      .withFailureHandler(function() {
        window.userManagementState.restaurantsLoading = false;
        if (typeof callback === 'function') callback();
        else refreshCreateRestaurantChoices();
      })
      .getManageTeamData(getToken());
  }

  function renderPage() {

  function openUserManagement() {

        state.activeAdminSection = 'USERS';

  function ensureAdminToolsState() {
    try {

  function upsertLocalUser(userRecord, assignedIds) {
    var admin = ensureAdminToolsState();
    var users = admin.users || [];
    var userId = clean(userRecord.userId || userRecord.user_id || userRecord.id);
    var username = lower(userRecord.username || '');
    var found = false;

    admin.users = users.map(function(existing) {
      var sameId = userId && clean(existing.userId || existing.user_id || existing.id) === userId;
      var sameUsername = username && lower(existing.username || '') === username;
      if (sameId || sameUsername) {
        found = true;
        return Object.assign({}, existing, userRecord, {
          assignedRestaurantIds: (assignedIds || []).join(','),
          assignedRestaurantCount: (assignedIds || []).length,
          restaurantId: (assignedIds || [])[0] || userRecord.restaurantId || userRecord.restaurant_id || ''
        });
      }
      return existing;
    });

    if (!found) {
      admin.users.push(Object.assign({}, userRecord, {
        assignedRestaurantIds: (assignedIds || []).join(','),
        assignedRestaurantCount: (assignedIds || []).length,
        restaurantId: (assignedIds || [])[0] || userRecord.restaurantId || userRecord.restaurant_id || ''
      }));
    }

    if (userId) {
      admin.restaurantMappings = (admin.restaurantMappings || []).filter(function(row) {
        return clean(row.userId || row.user_id) !== userId;
      });
      (assignedIds || []).forEach(function(restaurantId, index) {
        admin.restaurantMappings.push({
          accessId: 'local-' + userId + '-' + index,
          userId: userId,
          restaurantId: restaurantId,
          accessLevel: index === 0 ? 'PRIMARY' : 'ASSIGNED',
          isPrimary: index === 0 ? 'TRUE' : 'FALSE'
        });
      });
    }
  }

/* v259 save button guard: prevents double click save or submit while Google Apps Script is saving. */
(function saveButtonGuardV259() {
  if (window.__saveButtonGuardV259) return;
  window.__saveButtonGuardV259 = true;

  function injectBusyStyle() {
    if (document.getElementById('saveButtonGuardV259Style')) return;
    var style = document.createElement('style');
    style.id = 'saveButtonGuardV259Style';
    style.textContent = '' +
      'button[data-save-busy="1"]{opacity:.68!important;cursor:not-allowed!important;pointer-events:none!important;}' +
      'button[data-save-busy="1"]::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid rgba(255,255,255,.55);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;}' +
      'button[data-save-busy="1"].secondary-btn::after,button[data-save-busy="1"].inline-btn::after{border-color:rgba(22,58,99,.25);border-top-color:#163a63;}';
    document.head.appendChild(style);
  }

  function cleanText(value) {
    return String(value || '').replace(/\s+/g, ' ').trim();
  }

  function isSaveActionButton(button) {
    if (!button || button.disabled) return false;
    if (button.hasAttribute('data-no-save-lock')) return false;

    var text = cleanText(button.textContent).toLowerCase();
    var id = String(button.id || '').toLowerCase();
    var cls = String(button.className || '').toLowerCase();

    if (!text && !id) return false;

    if (/back|close|cancel|clear|refresh|view|apply|search|done|logout|theme|notification|role actions|select|forgot|contact support/.test(text)) {
      return false;
    }

    if (/back|close|cancel|clear|refresh|view|apply|search|done|logout|theme|notification|roleaction|select|forgot/.test(id)) {
      return false;
    }

    return /save|submit|create|add|update|complete|approve|reject|active|inactive|activate|deactivate|block|unblock|reset|transfer|upload/.test(text + ' ' + id + ' ' + cls);
  }

  function findFormSubmitButton(form) {
    if (!form) return null;
    return form.querySelector('button[type="submit"], .primary-btn');
  }

  function lockButton(button, label) {
    if (!button || button.dataset.saveBusy === '1') return false;
    injectBusyStyle();

    button.dataset.saveBusy = '1';
    button.dataset.saveOriginalText = cleanText(button.textContent);
    button.setAttribute('aria-busy', 'true');

    window.setTimeout(function() {
      if (!button || !button.isConnected) return;
      button.disabled = true;
      if (label) button.textContent = label;
    }, 0);

    window.setTimeout(function() {
      unlockButton(button);
    }, 6500);

    return true;
  }

  function unlockButton(button) {
    if (!button || !button.isConnected) return;
    if (button.dataset.saveBusy !== '1') return;

    var original = button.dataset.saveOriginalText || '';
    button.disabled = false;
    button.removeAttribute('aria-busy');
    delete button.dataset.saveBusy;
    delete button.dataset.saveOriginalText;
    if (original) button.textContent = original;
  }

  window.unlockSaveButtonV259 = unlockButton;

  document.addEventListener('click', function(event) {
    var button = event.target && event.target.closest ? event.target.closest('button') : null;
    if (!button) return;

    if (button.dataset.saveBusy === '1') {
      event.preventDefault();
      event.stopPropagation();
      return false;
    }

    if (!isSaveActionButton(button)) return;
    lockButton(button, 'Saving');
  }, true);

  document.addEventListener('submit', function(event) {
    var form = event.target;
    var button = findFormSubmitButton(form);
    if (!button) return;

    if (button.dataset.saveBusy === '1') return;
    if (!isSaveActionButton(button)) return;
    lockButton(button, 'Saving');
  }, true);
})();
