  function hideOtherPages() {
    ['newHeroesPage', 'hiringRequestPage'].forEach(function(id) {
      var el = byId(id);
      if (el) el.hidden = true;
    });
    document.body.classList.remove('portal-login');
    document.body.classList.add('portal-dashboard', 'portal-feature');
    getHostContainer();
  }

  function renderShell() {
    ensureStyle();
    hideOtherPages();
    var host = getHostContainer();
    host.innerHTML = buildHtml();
    bindEvents();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function tabButton(key, label, count) {
    return '<button type="button" class="crq-tab ' + (curState.tab === key ? 'active' : '') + '" data-crq-tab="' + key + '">' + esc(label) + ' (' + (count || 0) + ')</button>';
  }

  function buildHtml() {
    var counts = countRows();
    return '<section id="contactRequestsPageV263" class="crq-page">' +
      '<div class="crq-titlebar"><h2>Contact Us Requests</h2><button type="button" class="crq-back" id="crqBackDashboard">Back to Dashboard</button></div>' +
      '<div class="crq-tabs">' +
        tabButton('NEW', 'New Requests', counts.NEW) +
        tabButton('IN_PROGRESS', 'In Progress', counts.IN_PROGRESS) +
        tabButton('COMPLETED', 'Completed', counts.COMPLETED) +
      '</div>' +
      '<div class="crq-toolbar">' +
        '<input id="crqSearch" class="crq-control" style="width:280px" placeholder="Search name, username, email, message" value="' + attr(curState.search) + '" />' +
        '<button type="button" class="crq-btn" id="crqApplySearch">Apply</button>' +
        '<button type="button" class="crq-btn" id="crqClearSearch">Clear</button>' +
        '<button type="button" class="crq-btn" id="crqRefresh">Refresh</button>' +
      '</div>' +
      '<div class="crq-body">' +
        '<p class="crq-message" id="crqMessage">' + esc(curState.loading ? 'Loading requests...' : (curState.message || '')) + '</p>' +
        renderList() +
      '</div>' +
    '</section>';
  }

  function renderList() {
    if (curState.loading && !getRows().length) {
      return '<div class="crq-empty">Loading contact requests...</div>';
    }
    var rows = getFilteredRows();
    if (!rows.length) {
      return '<div class="crq-empty">No contact requests found for this view.</div>';
    }
    var html = '<div class="crq-card"><div class="crq-row crq-head"><div>Date</div><div>Name</div><div>Contact</div><div>Status</div><div>Action</div></div>';
    rows.forEach(function(row) { html += renderRow(row); });
    html += '</div>';
    return html;
  }

  function pillHtml(status) {
    status = getStatus({ status: status });
    var cls = status === 'NEW' ? 'new' : (status === 'COMPLETED' ? 'done' : 'progress');
    return '<span class="crq-pill ' + cls + '">' + esc(statusLabel(status)) + '</span>';
  }

  function renderRow(row) {
    var id = getRecordId(row);
    var open = curState.openId === id;
    var date = clean(row.requested_at || row.created_at || '').slice(0, 10);
    var contact = clean(row.email || '') || clean(row.phone || '') || clean(row.username || '');
    var html =
      '<div class="crq-row" data-crq-id="' + attr(id) + '">' +
        '<div>' + esc(date || '-') + '</div>' +
        '<div>' + esc(row.name || '-') + '<br><small>' + esc(row.username || '') + '</small></div>' +
        '<div>' + esc(contact || '-') + '</div>' +
        '<div>' + pillHtml(getStatus(row)) + '</div>' +
        '<div><button type="button" class="crq-btn" data-crq-view="' + attr(id) + '">' + (open ? 'Close' : 'View') + '</button></div>' +
      '</div>';
    if (open) html += renderDetails(row);
    return html;
  }

  function detailField(label, value) {
    return '<div class="crq-field"><span>' + esc(label) + '</span><div>' + esc(value || '-') + '</div></div>';
  }

  function renderDetails(row) {
    var id = getRecordId(row);
    var status = getStatus(row);
    var note = clean(row.action_taken_notes || row.notes || '');
    return '<div class="crq-details" data-crq-details="' + attr(id) + '">' +
      '<div class="crq-detail-grid">' +
        detailField('Name', row.name) +
        detailField('Username', row.username) +
        detailField('Email', row.email) +
        detailField('Phone', row.phone) +
        detailField('Source', row.source) +
        detailField('Restaurant', row.restaurant_number || row.restaurantNumber || row.restaurant_id) +
        detailField('Requested At', row.requested_at || row.created_at) +
      '</div>' +
      '<div class="crq-field" style="margin-bottom:12px"><span>Message from user</span><div>' + esc(row.message || '-') + '</div></div>' +
      '<label style="font-weight:700;display:block;margin-bottom:6px">Action notes</label>' +
      '<textarea class="crq-note" data-crq-note="' + attr(id) + '" placeholder="Write what was done for this request">' + esc(note) + '</textarea>' +
      '<div class="crq-actions">' +
        '<select class="crq-control" data-crq-status="' + attr(id) + '" style="width:190px">' +
          '<option value="IN_PROGRESS"' + (status === 'IN_PROGRESS' ? ' selected' : '') + '>In Progress</option>' +
          '<option value="COMPLETED"' + (status === 'COMPLETED' ? ' selected' : '') + '>Completed</option>' +
        '</select>' +
        '<button type="button" class="crq-btn primary" data-crq-save="' + attr(id) + '">Save</button>' +
      '</div>' +
    '</div>';
  }

  function updateLocal(id, patch) {
    var rows = getRows().map(function(row) {
      if (getRecordId(row) === id) {
        Object.keys(patch).forEach(function(key) { row[key] = patch[key]; });
      }
      return row;
    });
    setRows(rows);
  }

  function showMessage(message, type) {
    curState.message = message || '';
    var el = byId('crqMessage');
    if (el) {
      el.textContent = curState.message;
      el.style.color = type === 'error' ? '#b51218' : '#12385f';
    }
  }

  function fetchRequests(callback) {
    curState.loading = true;
    renderShell();
    google.script.run
      .withSuccessHandler(function(response) {
        curState.loading = false;
        if (!response || response.success === false) {
          showMessage((response && response.error) || 'Could not load contact requests.', 'error');
          return;
        }
        setRows((response.data && response.data.requests) || []);
        curState.message = '';
        renderShell();
        if (typeof callback === 'function') callback();
      })
      .withFailureHandler(function(error) {
        curState.loading = false;
        showMessage(error && error.message ? error.message : 'Could not load contact requests.', 'error');
      })
      .listContactRequests({ sessionToken: getSessionToken() });
  }

  function markViewedIfNew(id) {
    var row = getRows().find(function(item) { return getRecordId(item) === id; });
    if (!row || getStatus(row) !== 'NEW') return;
    updateLocal(id, { status: 'IN_PROGRESS', updated_at: new Date().toISOString() });
    renderShell();
    showMessage('Marked as In Progress. Saving in background.');
    google.script.run
      .withSuccessHandler(function(response) {
        if (response && response.success === false) {
          showMessage(response.error || 'Could not mark request as In Progress.', 'error');
          fetchRequests();
          return;
        }
        // Request moved to IN_PROGRESS - switch to ALL tab so it stays visible
        if (curState.tab === 'NEW') {
          curState.tab = 'ALL';
          curState.openId = id;
          renderShell();
          showMessage('Marked as In Progress — showing in All tab.');
        } else {
          renderShell();
          showMessage('Marked as In Progress.');
        }
      })
      .withFailureHandler(function(error) {
        showMessage(error && error.message ? error.message : 'Could not save status.', 'error');
        fetchRequests();
      })
      .updateContactRequest({
        sessionToken: getSessionToken(),
        contactRequestId: id,
        status: 'IN_PROGRESS',
        actionTakenNotes: clean(row.action_taken_notes || '')
      });
  }

  function saveRequest(id, button) {
    // Double-submit guard
    if (typeof pendingSave_ !== 'undefined' && !pendingSave_.lock('crq_' + id)) {
      showMessage('Already saving, please wait...', 'info');
      return;
    }
    var noteEl = document.querySelector('[data-crq-note="' + CSS.escape(id) + '"]');
    var statusEl = document.querySelector('[data-crq-status="' + CSS.escape(id) + '"]');
    var notes = noteEl ? noteEl.value : '';
    var status = statusEl ? statusEl.value : 'IN_PROGRESS';

    if (button) {
      button.disabled = true;
      button.textContent = 'Saving…';
    }
    if (statusEl) statusEl.disabled = true;
    if (noteEl) noteEl.disabled = true;
    updateLocal(id, { status: status, action_taken_notes: notes, updated_at: new Date().toISOString() });
    renderShell();
    showMessage('Status updated on screen. Saving in background.');

    google.script.run
      .withSuccessHandler(function(response) {
        if (typeof pendingSave_ !== 'undefined') pendingSave_.unlock('crq_' + id);
        if (button) { button.disabled = false; button.textContent = 'Save'; }
        if (statusEl) statusEl.disabled = false;
        if (noteEl) noteEl.disabled = false;
        if (response && response.success === false) {
          showMessage(response.error || 'Could not save request.', 'error');
          // Revert local change on failure so the display matches the real data
          fetchRequests();
          return;
        }
        // If the saved status moves the record OUT of the current tab,
        // switch to ALL so the user can see the record still exists with its new status.
        var savedStatus = upper(status);
        var tabMismatch = (curState.tab === 'NEW' && savedStatus !== 'NEW') ||
                          (curState.tab === 'IN_PROGRESS' && savedStatus !== 'IN_PROGRESS') ||
                          (curState.tab === 'COMPLETED' && savedStatus !== 'COMPLETED');
        if (tabMismatch) {
          curState.tab = 'ALL';
          curState.openId = id; // keep the card expanded so they can see it
          renderShell();
          showMessage('Saved. Status changed to ' + status + ' — showing in All tab.');
        } else {
          renderShell();
          showMessage('Saved. Status updated to ' + status + '.');
        }
      })
      .withFailureHandler(function(error) {
        if (typeof pendingSave_ !== 'undefined') pendingSave_.unlock('crq_' + id);
        if (button) { button.disabled = false; button.textContent = 'Save'; }
        if (statusEl) statusEl.disabled = false;
        if (noteEl) noteEl.disabled = false;
        showMessage(error && error.message ? error.message : 'Could not save request.', 'error');
      })
      .updateContactRequest({
        sessionToken: getSessionToken(),
        contactRequestId: id,
        status: status,
        actionTakenNotes: notes
      });
  }

  function bindEvents() {
    var back = byId('crqBackDashboard');
    if (back) back.addEventListener('click', goBack);

    document.querySelectorAll('[data-crq-tab]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        curState.tab = btn.getAttribute('data-crq-tab') || 'NEW';
        curState.openId = '';
        curState.message = '';
        renderShell();
      });
    });

    var search = byId('crqSearch');
    var apply = byId('crqApplySearch');
    var clear = byId('crqClearSearch');
    var refresh = byId('crqRefresh');

    if (apply) apply.addEventListener('click', function() {
      curState.search = search ? search.value : '';
      curState.openId = '';
      renderShell();
    });
    if (search) search.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        curState.search = search.value;
        curState.openId = '';
        renderShell();
      }
    });
    if (clear) clear.addEventListener('click', function() {
      curState.search = '';
      curState.openId = '';
      renderShell();
    });
    if (refresh) refresh.addEventListener('click', function() { fetchRequests(); });

    document.querySelectorAll('[data-crq-view]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = btn.getAttribute('data-crq-view') || '';
        var wasOpen = curState.openId === id;
        curState.openId = wasOpen ? '' : id;
        renderShell();
        if (!wasOpen) markViewedIfNew(id);
      });
    });

    document.querySelectorAll('[data-crq-save]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        saveRequest(btn.getAttribute('data-crq-save') || '', btn);
      });
    });
  }

  function openPage() {
    hideAllPages_();
    ensureStyle();
    curState.tab = curState.tab || 'NEW';
    curState.openId = '';
    curState.message = curState.loaded ? '' : 'Loading requests...';

    // Show the page immediately from local data first.
    // Then refresh from the sheet in the background.
    renderShell();

    setTimeout(function() {
      fetchRequests();
    }, 60);
  }

  ensureStyle();
  window.openContactUsRequestsCleanV263_ = openPage;
  window.openContactUsRequestsCleanV262_ = openPage;
  window.openContactUsRequestsCleanV260_ = openPage;
})();


/*******************************************************
 PASSWORD CHANGE REQUESTS CLEANUP V266
 Same Clearview style as Contact Us Requests.
 No login design change. No dashboard design change.
*******************************************************/
(function passwordChangeRequestsCleanV266() {
  var curState = window.passwordChangeRequestsStateV266 || {
    tab: 'NEW',
    search: '',
    openId: '',
    message: '',
    rows: [],
    loaded: false,
    loading: false
  };
  window.passwordChangeRequestsStateV266 = curState;

  function byId(id) { return document.getElementById(id); }
  function clean(value) { return String(value == null ? '' : value).trim(); }
  function upper(value) { return clean(value).toUpperCase(); }
  function esc(value) {
    return clean(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function attr(value) { return esc(value); }

  function getSessionToken() {
    try {
      return sessionStorage.getItem('portalSessionToken') || sessionStorage.getItem('sessionToken') || localStorage.getItem('portalSessionToken') || localStorage.getItem('sessionToken') || '';
    } catch (error) { return ''; }
  }

  function getHostContainer() {
    var login = document.querySelector('.login-stage');
    var dash = document.querySelector('.dashboard-stage');
    var center = document.querySelector('.center-column');
    var newsletter = document.querySelector('.newsletter');
    var workspace = byId('adminWorkspace') || window.adminWorkspace || null;
    var sections = byId('adminSections') || window.adminSections || null;

    if (login) { login.hidden = true; login.style.display = 'none'; }
    if (dash) { dash.hidden = false; dash.removeAttribute('hidden'); dash.style.display = 'grid'; }
    if (newsletter) newsletter.style.display = 'none';

    if (center && workspace) { center.innerHTML = ''; center.appendChild(workspace); center.style.display = 'block'; }
    if (workspace) {
      workspace.hidden = false;
      workspace.removeAttribute('hidden');
      workspace.style.display = 'grid';
      var header = workspace.querySelector('.admin-workspace-header');
      if (header) header.style.display = 'none';
    }
    ['adminSummaryGrid', 'adminSectionTabs'].forEach(function(id) {
      var el = byId(id) || window[id];
      if (el) el.innerHTML = '';
    });
    if (!sections) {
      sections = document.createElement('div');
      sections.id = 'adminSections';
      if (workspace) workspace.appendChild(sections);
      else if (center) center.appendChild(sections);
      else document.body.appendChild(sections);
      window.adminSections = sections;
    }
    sections.hidden = false;
    sections.removeAttribute('hidden');
    sections.style.display = 'block';
    return sections;
  }

  function goBack() {
    curState.openId = '';
    curState.message = '';
    // FIX: Use goBackToDashboardHome which correctly restores the full dashboard layout.
    try {
      if (typeof window.goBackToDashboardHome === 'function') {
        window.goBackToDashboardHome();
        return;
      }
    } catch (error) {}
    // Hard fallback — reload dashboard data from server
    try {
      if (typeof loadDashboard === 'function') { loadDashboard(); return; }
    } catch (error) {}
    // Last resort — remove the page element so user isn't stuck
    var page = byId('passwordRequestsPageV266');
    if (page) page.remove();
  }

  function getRecordId(row) {
    return clean(row.password_request_id || row.passwordRequestId || row.request_id || row.id);
  }

  function getStatus(row) {
    var raw = clean(row && row.status);
    var status = upper(raw || 'NEW').replace(/[\s-]+/g, '_');
    if (!status || status === 'BLANK') status = 'NEW';
    if (status === 'OPEN' || status === 'NEW_REQUEST' || status === 'PENDING' || status === 'SUBMITTED') status = 'NEW';
    if (status === 'VIEWED' || status === 'INPROGRESS' || status === 'WORKING' || status === 'WORK_STARTED') status = 'IN_PROGRESS';
    if (status === 'DONE' || status === 'COMPLETE' || status === 'CLOSED' || status === 'RESOLVED') status = 'COMPLETED';
    return status || 'NEW';
  }

  function statusLabel(status) {
    status = upper(status).replace(/[\s-]+/g, '_');
    if (status === 'NEW') return 'New Request';
    if (status === 'IN_PROGRESS') return 'In Progress';
    if (status === 'COMPLETED') return 'Completed';
    return clean(status).replace(/_/g, ' ');
  }

  function normalizeRow(row, index) {
    row = Object.assign({}, row || {});
    row.password_request_id = clean(row.password_request_id || row.passwordRequestId || row.request_id || row.id || ('LOCAL_PASSWORD_' + index));
    row.source = clean(row.source || 'Unknown');
    row.name = clean(row.name || row.full_name || row.fullName || '');
    row.username = clean(row.username || '');
    row.email = clean(row.email || '');
    row.phone = clean(row.phone || '');
    row.message = clean(row.message || row.request_message || row.details || '');
    row.status = getStatus(row);
    row.temporary_password = clean(row.temporary_password || '');
    row.action_taken_notes = clean(row.action_taken_notes || row.admin_notes || row.notes || '');
    row.requested_at = clean(row.requested_at || row.created_at || row.timestamp || '');
    row.updated_at = clean(row.updated_at || '');
    row.updated_by = clean(row.updated_by || '');
    row._id = row.password_request_id;
    return row;
  }

  function getRows() {
    var rows = Array.isArray(curState.rows) ? curState.rows.slice() : [];
    if (!rows.length) {
      try {
        if (window.state && state.adminTools && Array.isArray(state.adminTools.passwordRequests)) {
          rows = state.adminTools.passwordRequests.slice();
        }
      } catch (error) {}
    }
    rows = rows.map(normalizeRow).filter(function(row) {
      return row.password_request_id && (row.name || row.username || row.email || row.phone || row.message || row.requested_at);
    });
    rows.sort(function(a, b) { return clean(b.requested_at || '').localeCompare(clean(a.requested_at || '')); });
    return rows;
  }

  function setRows(rows) {
    curState.rows = (rows || []).map(normalizeRow);
    curState.loaded = true;
    try {
      if (!window.state) window.state = {};
      state.adminTools = state.adminTools || {};
      state.adminTools.passwordRequests = curState.rows.map(function(row) {
        var copy = Object.assign({}, row);
        delete copy._id;
        return copy;
      });
    } catch (error) {}
  }

  function getFilteredRows() {
    var rows = getRows();
    var search = clean(curState.search).toLowerCase();
    return rows.filter(function(row) {
      var status = getStatus(row);
      if (curState.tab === 'NEW' && status !== 'NEW') return false;
      if (curState.tab === 'IN_PROGRESS' && status !== 'IN_PROGRESS') return false;
      if (curState.tab === 'COMPLETED' && status !== 'COMPLETED') return false;
      if (!search) return true;
      var hay = [row.name, row.username, row.email, row.phone, row.message, row.source, row.status, row.action_taken_notes].map(clean).join(' ').toLowerCase();
      return hay.indexOf(search) !== -1;
    });
  }

  function saveRequest(id, button) {
    var noteEl = document.querySelector('[data-prq-note="' + CSS.escape(id) + '"]');

    var tempEl = document.querySelector('[data-prq-temp="' + CSS.escape(id) + '"]');
    var notes = noteEl ? noteEl.value : '';
    var status = statusEl ? statusEl.value : 'IN_PROGRESS';
    var temp = tempEl ? tempEl.value.trim() : '';

    if (status === 'COMPLETED' && temp && temp.length < 8) {
      showMessage('Temporary password must be at least 8 characters.', 'error');
      return;
    }
    // Double-submit guard
    if (typeof pendingSave_ !== 'undefined' && !pendingSave_.lock('prq_' + id)) {
      showMessage('Already saving, please wait...', 'info');
      return;
    }
    var statusEl2 = document.querySelector('[data-prq-status="' + id + '"]');
    if (button) { button.disabled = true; button.textContent = 'Saving…'; }
    if (statusEl2) statusEl2.disabled = true;
    updateLocal(id, { status: status, action_taken_notes: notes, updated_at: new Date().toISOString() });
    renderShell();
    showMessage('Status updated on screen. Saving in background.');

    var runner = google.script.run.withSuccessHandler(function(response) {
      if (typeof pendingSave_ !== 'undefined') pendingSave_.unlock('prq_' + id);
      if (button) { button.disabled = false; button.textContent = 'Save'; }
      var sel2 = document.querySelector('[data-prq-status="' + id + '"]');
      if (sel2) sel2.disabled = false;
      if (response && response.success === false) {
        showMessage(response.error || 'Could not save request.', 'error');
        // Revert local change on failure
        fetchRequests();
        return;
      }
      // If the saved status moves the record OUT of the current tab,
      // switch to ALL so the user can see the record still exists with its new status.
      var savedStatus = upper(status);
      var tabMismatch = (curState.tab === 'NEW' && savedStatus !== 'NEW') ||
                        (curState.tab === 'IN_PROGRESS' && savedStatus !== 'IN_PROGRESS') ||
                        (curState.tab === 'COMPLETED' && savedStatus !== 'COMPLETED');
      if (tabMismatch) {
        curState.tab = 'ALL';
        curState.openId = id;
        renderShell();
        showMessage('Saved. Status changed to ' + status + ' — showing in All tab.');
      } else {
        renderShell();
        showMessage('Saved. Status updated to ' + status + '.');
      }
    }).withFailureHandler(function(error) {
      if (typeof pendingSave_ !== 'undefined') pendingSave_.unlock('prq_' + id);
      if (button) { button.disabled = false; button.textContent = 'Save'; }
      var sel2 = document.querySelector('[data-prq-status="' + id + '"]');
      if (sel2) sel2.disabled = false;
      showMessage(error && error.message ? error.message : 'Could not save request.', 'error');
    });

    if (status === 'COMPLETED' && temp) {
      runner.fulfillPasswordChangeRequest({ sessionToken: getSessionToken(), passwordRequestId: id, temporaryPassword: temp, actionTakenNotes: notes });
    } else {
      runner.updatePasswordChangeRequest({ sessionToken: getSessionToken(), passwordRequestId: id, status: status, actionTakenNotes: notes });
    }
  }

  function bindEvents() {
    var back = byId('prqBackDashboard');
    if (back) back.addEventListener('click', goBack);
    document.querySelectorAll('[data-prq-tab]').forEach(function(btn) {
      btn.addEventListener('click', function() { curState.tab = btn.getAttribute('data-prq-tab') || 'NEW'; curState.openId = ''; curState.message = ''; renderShell(); });
    });
    var search = byId('prqSearch');
    var apply = byId('prqApplySearch');

    if (apply) apply.addEventListener('click', function() { curState.search = search ? search.value : ''; curState.openId = ''; renderShell(); });
    if (search) search.addEventListener('keydown', function(event) { if (event.key === 'Enter') { event.preventDefault(); curState.search = search.value; curState.openId = ''; renderShell(); } });
    if (clear) clear.addEventListener('click', function() { curState.search = ''; curState.openId = ''; renderShell(); });
    if (refresh) refresh.addEventListener('click', function() { fetchRequests(); });
    document.querySelectorAll('[data-prq-view]').forEach(function(btn) {
      btn.addEventListener('click', function() { var id = btn.getAttribute('data-prq-view') || ''; var wasOpen = curState.openId === id; curState.openId = wasOpen ? '' : id; renderShell(); if (!wasOpen) markViewedIfNew(id); });
    });
    document.querySelectorAll('[data-prq-save]').forEach(function(btn) { btn.addEventListener('click', function() { saveRequest(btn.getAttribute('data-prq-save') || '', btn); }); });
  }

  function openPage() {
    hideAllPages_();
    ensureStyle();
    curState.tab = curState.tab || 'NEW';
    curState.openId = '';
    curState.message = curState.loaded ? '' : 'Loading requests...';
    renderShell();
    setTimeout(function() { fetchRequests(); }, 60);
  }

  ensureStyle();
  window.openPasswordChangeRequestsCleanV266_ = openPage;
})();

(function changePasswordSelfServiceV267(){
  if (window.__changePasswordSelfServiceV267) return;
  window.__changePasswordSelfServiceV267 = true;

  function byId(id){ return document.getElementById(id); }
  function clean(value){ return String(value || '').trim(); }

    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

  function token_(){
    try { if (typeof getSessionToken_ === 'function') return getSessionToken_() || ''; } catch (error) {}

      // Recent activity
      '<div class="od-section-label">Recent activity</div>' +
      '<div class="od-activity"><h4>Latest updates</h4>' +
      (feed.length ? feed.map(function(item) {
        return '<div class="od-feed-item">' +
          '<div class="od-dot ' + esc(statusDotClass(item.status)) + '"></div>' +
          '<div class="od-feed-main">' +
            '<span class="od-feed-who">' + esc(item.by || 'System') + '</span> ' +
            '<span class="od-feed-what">&mdash; ' + esc(item.type) + ' at restaurant ' + esc(item.restaurant) + ' marked <em>' + esc(item.status) + '</em>' + (item.note ? ' &mdash; &ldquo;' + esc(item.note) + '&rdquo;' : '') + '</span>' +
          '</div>' +
          '<span class="od-feed-time">' + esc(formatTime(item.at)) + '</span>' +
        '</div>';
      }).join('') : '<div class="od-empty">No recent activity</div>') +
      '</div>' +

      '<div class="od-generated">Last updated: ' + esc(formatTime(data.generatedAt)) + '</div>';

    var body = byId('odBody');
    if (body) body.innerHTML = html;
  }

  function metricHtml(label, value, sub, cls) {
    return '<div class="od-metric ' + esc(cls || '') + '">' +
      '<div class="od-metric-label">' + esc(label) + '</div>' +
      '<div class="od-metric-value">' + esc(String(value)) + '</div>' +
      '<div class="od-metric-sub">' + esc(sub || '') + '</div>' +
    '</div>';
  }

  function bindEvents() {
    var back = byId('odBackBtn');
    if (back) back.addEventListener('click', function() {
      stopPoll_();
      if (typeof goBackToDashboardHome === 'function') return goBackToDashboardHome();
      if (typeof restoreDashboardHomeLayout_ === 'function') restoreDashboardHomeLayout_();
    });
    var refresh = byId('odRefreshBtn');
    if (refresh) refresh.addEventListener('click', function() {
      refresh.disabled = true;
      refresh.textContent = 'Refreshing...';
      loadData(true);
      setTimeout(function() {
        refresh.disabled = false;
        refresh.textContent = '\u21BB Refresh';
      }, 3000);
    });
  }

  function loadData(force, silent) {
    if (!force && odState.data && Date.now() - odState.loadedAt < 60000) {
      renderDashboard(odState.data);
      return;
    }
    if (!silent) {
      var body = byId('odBody');
      if (body && !odState.data) body.innerHTML = loadingHtml();
    }
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          notify((res && res.error) || 'Could not load dashboard data.', 'error');
          if (!odState.data) {
            var body = byId('odBody');
            if (body) body.innerHTML = '<div class="od-loading">Could not load data. Click Refresh to try again.</div>';
          }
          return;
        }
        odState.data = res.data || res;
        odState.loadedAt = Date.now();
        renderDashboard(odState.data);
      })
      .withFailureHandler(function(err) {
        notify(err && err.message ? err.message : 'Could not load dashboard.', 'error');
      })
      .getOperationsDashboardData({ sessionToken: token_(), forceRefresh: Boolean(force) });
  }

  function startPoll_() {
    if (odPollInterval_) return;
    odPollInterval_ = setInterval(function() {
      if (document.hidden) return;
      loadData(false, true); // silent background refresh
    }, 60000);
  }

  function stopPoll_() {
    if (odPollInterval_) { clearInterval(odPollInterval_); odPollInterval_ = null; }
  }

  function openOperationsDashboardV326_() {
    hideAllPages_();
    injectStyle();
    if (typeof closeRoleActionsDropdown_ === 'function') closeRoleActionsDropdown_();
    // If we have cached data render it instantly — no loading screen
    if (odState.data) {
      showWorkspace(shellHtml(''));
      bindEvents();
      renderDashboard(odState.data);
      // Silently refresh in background if cache is older than 60s
      if (Date.now() - odState.loadedAt > 60000) loadData(true);
    } else {
      showWorkspace(shellHtml());
      bindEvents();
      loadData(false);
    }
    startPoll_();
  }

  window.openOperationsDashboardV326_ = openOperationsDashboardV326_;
})();
